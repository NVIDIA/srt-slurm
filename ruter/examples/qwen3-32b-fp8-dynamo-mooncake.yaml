# End-to-end direct-host recipe for ruter.
# Requires srt-slurm with https://github.com/NVIDIA/srt-slurm/pull/317.
# Before rendering, replace the two /path/to values below.
name: qwen3-32b-fp8-dynamo-ruter

model:
  path: /path/to/Qwen3-32B-FP8
  container: direct-host
  precision: fp8

resources:
  gpu_type: h100
  gpus_per_node: 8
  agg_nodes: 1
  agg_workers: 8
  gpus_per_agg: 1

dynamo:
  install: false

# Avoid shared host NATS/etcd. These are consumed by the direct-host renderer.
environment:
  SRTCTL_ETCD_PORT: "22379"
  SRTCTL_ETCD_PEER_PORT: "22380"
  SRTCTL_NATS_PORT: "24222"

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: kv
  env:
    # Dynamo defaults retain context-free request_end rows as rotated gzip JSONL.
    # Put that prefix in the bundle instead of Dynamo's default /tmp location.
    DYN_REQUEST_TRACE: "1"
    DYN_REQUEST_TRACE_FILE_PATH: "{artifact_dir}/dynamo-request-trace"

backend:
  type: sglang
  kv_events_config:
    aggregated: true
  sglang_config:
    aggregated:
      served-model-name: Qwen/Qwen3-32B-FP8
      tensor-parallel-size: 1
      page-size: 16
      trust-remote-code: true
      mem-fraction-static: 0.85
      context-length: 40960
      max-running-requests: 64
      enable-metrics: true
      disable-piecewise-cuda-graph: true
      # Avoid DeepGEMM's host-NVCC JIT path on this CUDA 13.3 image. Triton is
      # SGLang's portable FP8 fallback and leaves the Dynamo routing experiment
      # and request trace contract unchanged.
      fp8-gemm-backend: triton

observability:
  enabled: true
  # ruter consumes Tachometer Parquet; skip the redundant raw JSONL scrape.
  scrape_metrics: false
  tachometer:
    enabled: true

benchmark:
  type: custom
  command: |
    aiperf profile \
      --model Qwen/Qwen3-32B-FP8 \
      --tokenizer Qwen/Qwen3-32B-FP8 \
      --tokenizer-trust-remote-code \
      --url "$SRT_FRONTEND_URL" \
      --endpoint-type chat \
      --streaming \
      --input-file /path/to/mooncake_refined.jsonl \
      --custom-dataset-type mooncake_trace \
      --fixed-schedule \
      --fixed-schedule-auto-offset \
      --extra-inputs ignore_eos:true \
      --use-legacy-max-tokens \
      --request-timeout-seconds 900 \
      --workers-max 128 \
      --output-artifact-dir "$AIPERF_ARTIFACT_DIR" \
      --profile-export-prefix trace \
      --ui none \
      --no-server-metrics
