[package]
name = "ruter"
version = "0.1.0"
edition = "2024"
description = "Post-hoc router benchmark observability"
license = "Apache-2.0"

[lib]
name = "ruter"
path = "src/lib.rs"

[[bin]]
name = "ruter"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arrow-array = "59.2.0"
arrow-schema = "59.2.0"
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
parquet = { version = "59.2.0", features = ["arrow"] }
regex = "1.11"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.15"
