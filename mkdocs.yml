site_name: srt-slurm
site_url: https://nvidia.github.io/srt-slurm/
repo_url: https://github.com/NVIDIA/srt-slurm
repo_name: NVIDIA/srt-slurm
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

hooks:
  - tools/mkdocs_llms_txt.py

exclude_docs: |
  AGENTS.md
  design/

validation:
  links:
    anchors: warn

nav:
  - Home: README.md
  - Get Started:
      - Installation: installation.md
      - Cluster Config: cluster-config.md
      - CLI Guide: cli.md
  - Write a Recipe:
      - Recipe Guide: config-reference.md
      - Engines: engines.md
      - Topology and Placement: topology.md
      - Frontends:
          - Frontends and Dynamo: frontends.md
          - SGLang Router: sglang-router.md
          - vLLM Router: vllm-router.md
          - Shepherd Model Gateway: smg.md
      - Benchmarks:
          - Benchmarks: benchmarks.md
          - Accuracy Benchmarks: accuracy.md
      - Paths, Mounts, and Environment: runtime-env.md
      - Services:
          - Services: services.md
          - Pools: pools.md
          - Mooncake KV Store: mooncake-kv-store.md
      - Config Overrides: overrides.md
      - Parameter Sweeps: sweeps.md
      - Workloads:
          - Native Sidecars: sidecars.md
          - TileRT: tilert.md
          - Shadow Engine Recovery: shadow-engine-recovery.md
          - SGLang Fast Engine Recovery: sglang-weight-cache.md
          - Miles RL Post-Training: miles.md
  - Run and Operate:
      - Monitoring: monitoring.md
      - SLURM FAQ: slurm-faq.md
      - Status API: status-api-spec.md
  - Analyze:
      - Observability and Telemetry: observability.md
      - Profiling: profiling.md
      - Per-run Performance Analysis: perf-analysis.md
      - Power:
          - GPU Power Telemetry: power-telemetry.md
          - CPU Power Telemetry: cpu-power-telemetry.md
          - DCGM 4.7 Runtime Support: dcgm-4.7-runtime-support.md
      - DSight:
          - DSight Trace Explorer: dsight.md
          - Data Flow: dsight-data-flow.md
          - Log Metrics: dsight-log-metrics.md
          - Storage: dsight-storage.md
  - Reference:
      - Schema Reference: schema-reference.md
      - CLI Reference: cli-reference.md
      - Legacy (v1) Recipe Layout: legacy-v1.md
  - Internals:
      - Architecture: architecture.md
