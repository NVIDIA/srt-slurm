[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "srtctl"
# The version is the git tag (vX.Y.Z); see CONTRIBUTING.md "Versioning".
dynamic = ["version"]
description = "Benchmark submission framework for distributed serving workloads"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "marshmallow>=3.20.0",
    "marshmallow-dataclass>=8.6.0",
    "mcp>=1.27.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "ruamel.yaml>=0.18.0",
    "matplotlib>=3.7.0",
    "pyarrow>=25.0.0",
    "tomli>=2.0",
]

[project.optional-dependencies]
ruter = [
    "pyarrow>=25.0.0",
]

[project.scripts]
srtctl = "srtctl.cli.submit:main"
srtctl-i = "srtctl.cli.interactive:main"
srtctl-sweep = "srtctl.cli.do_sweep:main"
srtctl-setup-head = "srtctl.cli.setup_head:main"
srtctl-mcp = "srtctl.mcp.server:main"
srtctl-validate-power = "srtctl.cli.validate_power_artifacts:main"
ruter = "srtctl.ruter.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/srtctl"]

# =============================================================================
# Versioning: one source of truth, the git tag
# =============================================================================
# `vX.Y.Z` tags are created by .github/workflows/release.yaml on every merge to
# main (bump size from the conventional-commit PR title). hatch-vcs derives the
# package version from the nearest tag, so `srtctl --version`, the wheel, the
# lockfile stamp, and the GitHub release always agree. Between tags a checkout
# reports e.g. 2.0.0.post3+g49715b7; without git metadata it falls back below.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# 2.0.0 at the tag, 2.0.0.post3+g<sha> three commits later (not a guessed 2.0.1.dev3).
version_scheme = "post-release"
fallback_version = "0.0.0+unknown"

[tool.hatch.build.hooks.vcs]
version-file = "src/srtctl/_version.py"

# =============================================================================
# Development dependencies
# =============================================================================
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0",
    "ruff>=0.8.0",
    "ty",  # Astral's fast type checker (replaces mypy)
    "fastapi>=0.109.0",
    "httpx>=0.27.0",  # Required by FastAPI TestClient
    "uvicorn>=0.27.0",  # Required for integration test mock server
    # Imported by the sa-bench scripts that tests/test_sa_bench_*.py load directly
    # (previously reached the dev env only as transitive dependencies of aiperf).
    "aiohttp>=3.9",
    "transformers>=4.40",
    "tqdm>=4.66",
    "datasets>=2.19",
    "pillow>=10.0",
    "pandas>=2.0",
]
# Real aiperf for the trace-replay integration tests (`pytest -m integration`).
# Kept out of `dev`: aiperf pulls pyzmq, whose wheels stop at CPython 3.13, so a
# plain `uv sync` on a 3.14 host otherwise tries to build libzmq from source.
integration = [
    "aiperf",
]

# =============================================================================
# Ruff - Fast Python linter and formatter
# =============================================================================
[tool.ruff]
line-length = 120
target-version = "py310"
# Exclude third-party / vendored sources kept byte-comparable with upstream:
#   - external benchmark scripts (from vLLM/other sources)
#   - the perf-dashboard ingest + renderer (see docs/component-dashboard.md).
#     Reformatting them would rewrite ~100 lines of deliberately dense upstream
#     style and destroy the diff against the repo they are re-synced from.
exclude = [
    "src/srtctl/benchmarks/scripts/*",
    "src/ingest/*",
    "src/visualization/*",
]

[tool.ruff.lint]
extend-select = [
    "I",      # isort - import sorting
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
]

[tool.ruff.lint.isort]
known-first-party = ["srtctl"]

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
# "." puts the repo root on sys.path so the vendored `src.ingest` /
# `src.visualization` packages are importable from tests (they are not part of
# the installed `srtctl` wheel; see docs/component-dashboard.md).
pythonpath = ["tests", "."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not integration'"
markers = [
    "integration: slow tests that run real aiperf against a mock server",
]

# =============================================================================
# ty - Astral's fast type checker (10-100x faster than mypy)
# https://docs.astral.sh/ty/
# =============================================================================
[tool.ty.src]
exclude = [
    "src/srtctl/benchmarks/scripts/",
    "scripts/",
    "ignition/",
    "src/ingest/",
    "src/visualization/",
]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
# All defaults for now
