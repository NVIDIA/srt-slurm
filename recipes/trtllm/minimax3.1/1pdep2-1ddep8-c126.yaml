services:
- args:
  - --eviction_high_watermark_ratio=0.99
  - --eviction_ratio=0.01
  env:
    GLOG_log_year_in_prefix: 'false'
  name: mooncake-master
  options:
    store_config:
      device_name: mlx5_0,mlx5_1,mlx5_2,mlx5_5,mlx5_6,mlx5_7,mlx5_8,mlx5_11
      enable_offload: false
      global_segment_size: 296GB
      local_buffer_size: 16MB
      metadata_server: P2PHANDSHAKE
      mode: embedded
      protocol: rdma
  type: mooncake-master
- command:
  - python3
  - -c
  - |-
    import os,glob,time;t=time.time();n=0
    for f in glob.glob('/model/**',recursive=True):
      if os.path.isfile(f):
        fd=os.open(f,os.O_RDONLY);os.posix_fadvise(fd,0,0,os.POSIX_FADV_DONTNEED);os.close(fd);n+=os.path.getsize(f)
    print('drop-ckpt-cache: fadvised %.1f GiB in %.1f s'%(n/2**30,time.time()-t),flush=True)
    for p in ('/sys/fs/cgroup/memory.current','/sys/fs/cgroup/memory.events','/sys/fs/cgroup/memory.pressure'):
      try: print(p, open(p).read().replace(chr(10),' | '),flush=True)
      except OSError as e: print(p,e)
  critical: false
  name: drop-ckpt-cache
  placement:
    node: all
  start: after_frontend
  type: generic
- command:
  - python3
  - -c
  - |-
    import glob,os,socket,time
    h=socket.gethostname()
    def rd(f):
      try: return open(f).read()
      except OSError: return ''
    def jobcg():
      p=([l.split(':',2)[2].strip() for l in rd('/proc/self/cgroup').splitlines() if l.startswith('0::')] or ['/'])[0]
      parts=[x for x in p.split('/') if x]
      for i in range(len(parts),0,-1):
        d='/sys/fs/cgroup/'+'/'.join(parts[:i])
        if parts[i-1].startswith('job_') and os.path.isdir(d): return d
      return '/sys/fs/cgroup'
    d=jobcg()
    cg=os.path.basename(d) if os.path.basename(d).startswith('job_') else 'root'
    kv=lambda s:dict(l.split()[:2] for l in s.splitlines() if len(l.split())>=2)
    X=('anon','file','pgsteal_direct','workingset_refault_file')
    while True:
      t=time.time()
      ev,st=kv(rd(d+'/memory.events')),kv(rd(d+'/memory.stat'))
      a=['M31MEM t=%.0f host=%s cg=%s'%(t,h,cg)]
      for k,f in (('cur','memory.current'),('peak','memory.peak'),('max','memory.max')):
        v=rd(d+'/'+f).strip()
        if v: a.append('%s=%s'%(k,v))
      a+=['ev_%s=%s'%(k,v) for k,v in ev.items()]
      if 'pgscan_direct' in st: a.append('pgscan_direct='+st['pgscan_direct'])
      b=['M31MEMX t=%.0f host=%s cg=%s'%(t,h,cg)]+['%s=%s'%(k,st[k]) for k in X if k in st]
      for l in rd(d+'/memory.numa_stat').splitlines():
        w=l.split()
        if w[:1] in (['anon'],['file']): b+=['numa%s_%s=%s'%(x.split('=')[0][1:],w[0],x.split('=')[1]) for x in w[1:]]
      for f in sorted(glob.glob('/sys/devices/system/node/node*/meminfo')):
        n=f.split('/')[-2][4:]
        m={l.split()[2].rstrip(':'):l.split()[3] for l in rd(f).splitlines() if len(l.split())>=4}
        if 'MemFree' in m: a.append('numa%s_free=%d'%(n,int(m['MemFree'])*1024))
        if 'FilePages' in m: b.append('numa%s_filepages=%d'%(n,int(m['FilePages'])*1024))
      print(' '.join(a),flush=True)
      print(' '.join(b),flush=True)
      time.sleep(30)
  critical: false
  name: mem-watch
  placement:
    node: all
  start: before_workers
  type: generic
