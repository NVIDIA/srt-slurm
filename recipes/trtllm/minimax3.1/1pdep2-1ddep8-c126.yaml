# Exact replay of the first seven-point sweep of InferenceMAX PR 1859: CI run 42170068985
# (commit 4455c46e, srt-slurm 1ca857b2). Every serving setting below is the config.yaml srtctl
# resolved for that run, including the CI's dspark synthetic-acceptance override (AL 4.04).
# Changes from the CI config:
#   - model/container: explicit paths instead of the CI cluster aliases (same files).
#   - slurm/sbatch_directives/extra_mount: the CI cluster settings for R37, made explicit.
#   - benchmark: runs `agentx profile` (agentx-harness 1.0.13 + datasets 5.1.0, as CI installed)
#     with the same flags directly instead of InferenceMAX's srt_agentic.sh; no InferenceMAX
#     post-processing.
#   - dropped CI-only post_eval and srun container-workdir=/infmax-workspace.
# Needs srtctl >= 1ca857b2 and, in R37's srtslurm.yaml,
#   default_bash_preamble: export PATH=/configs/m31-launch-bin:$PATH
# so INFMAX_API_CPUS / INFMAX_NUMA_PHYSICAL take effect (configs/m31-launch-bin). See README.md.

