# MiniMax-M3.1 Flash, vLLM + Dynamo 1.5.0, VR200 R37 (vrnvl72): 4 x DEP2 prefill (2 nodes, 2 workers/node) + 1 x DEP8 decode (2 nodes); C640, caps 32/20.
# Exact replay of the first seven-point sweep of InferenceMAX PR 1859: CI run 42170068985
# (commit 4455c46e, srt-slurm 1ca857b2). Every serving setting below is the config.yaml srtctl
# resolved for that run, including the CI's dspark synthetic-acceptance override (AL 4.04).
# In that run this point aborted during warmup: the frontend logged Dynamo TCP request
# timeouts to the decode worker. Later sweeps add frontend DYN_TCP_REQUEST_TIMEOUT: '120'.
# Changes from the CI config:
#   - model/container: explicit paths instead of the CI cluster aliases (same files).
#   - slurm/sbatch_directives/extra_mount: the CI cluster settings for R37, made explicit.
#   - benchmark: the GLM-5.3 Rubin client setup (recipes/trtllm/glm5.3/vrnvl72-lab-w2-fp8/
#     glm5.3-disagg-5p1d-tp4-dep16-c620.yaml) instead of CI's srt_agentic.sh: the local AgentX
#     checkout (/home/rihuo/agentx-harness) runs `aiperf profile --scenario inferencex-agentx-mvp`
#     with that recipe's flags and env. It sends X-Dynamo-Session-ID (CI did not).
#     No InferenceMAX post-processing.
#   - frontend: on the client's dedicated node, as in that GLM recipe (5 nodes total), without
#     CI's INFMAX_API_CPUS pinning.
#   - services/environment: the implied otel-collector is disabled and Dynamo runs with
#     OTEL_EXPORT_ENABLED=0 and DYN_LIFECYCLE_TRACE_ENABLED=0 (no OTLP export or lifecycle traces).
#   - decode numa-bind-cpus: every CPU of the rank's NUMA-node half, SMT siblings included, except
#     its M31_EC_CPUS (CI: 0-39 / 44-83 / 88-127 / 132-171, first SMT thread only).
#   - dropped CI-only post_eval and srun container-workdir=/infmax-workspace.
# Needs srtctl >= 1ca857b2 and, in R37's srtslurm.yaml,
#   default_bash_preamble: export PATH=/configs/m31-launch-bin:$PATH
# so INFMAX_API_CPUS / INFMAX_NUMA_PHYSICAL take effect (configs/m31-launch-bin). See README.md.

