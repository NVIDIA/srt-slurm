# GLM-5.2 NVFP4 AgentX benchmark point: 4p1d_dep8_c227_b16_mtp3
schema: 2
model:
  path: /lustre/fsw/coreai_comparch_inferencex/rihuo/GLM-5.2-NVFP4
  container: /lustre/fsw/coreai_comparch_inferencex/rihuo/tensorrt-llm-release-arm64-1-3-0rc28-dev202609210001.sqsh
  precision: fp4
dynamo:
  install: false
  request_plane: tcp
health_check:
  max_attempts: 270
  interval_seconds: 10
resources:
  gpu_type: gb300
  gpus_per_node: 4
engine:
  type: trtllm
    # --publish-metrics only (no KV events). ai-dynamo 1.6.0.dev20261004
    # (a) carries ai-dynamo/dynamo#12162 (performance metrics decoupled from KV events), so the
    #     trtllm_* engine gauges (kv_cache_hit_rate, kv_cache_utilization, ...) are exported without
    #     the attention-DP KV-event hang;
    # (b) parses --publish-metrics (the 1.5.0 release only knows --publish-events-and-metrics and
    #     exits with "Unrecognized argument: --publish-metrics");
    # Note: 1.6.0.dev20260923+ import redis.asyncio at worker startup (dynamo.common.multimodal), and
    # srtctl installs the wheel --no-deps, so the container must provide redis.
    # srtctl advertises the worker leaders' /metrics to AIPerf.
  publish_metrics: true
roles:
  prefill:
    gpus: 4
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TQDM_DISABLE: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TLLM_LOG_LEVEL: INFO
      TRTLLM_SERVER_DISABLE_GC: "1"
      TRTLLM_WORKER_DISABLE_GC: "1"
      TRTLLM_ENABLE_PDL: "1"
      NCCL_GRAPH_MIXING_SUPPORT: "0"
      MIMALLOC_PURGE_DELAY: "0"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TRTLLM_FUSED_DSA_METADATA: "1"
      TRTLLM_DSA_INDEXER_BF16: "1"
      TRTLLM_SERVE_ENABLE_MSGSPEC: "1"
      TLLM_ADP_ROUTER_MATCH_RATE_THRESHOLD: "0.10"
      TRTLLM_KV_CACHE_TRANSFER_TIMEOUT_SEC: "600"
      UCX_CUDA_IPC_ENABLE_MNNVL: "y"
      UCX_RNDV_SCHEME: put_zcopy
      TRTLLM_KVCACHE_SEND_BUFFER_COUNT: "1"
      TRTLLM_KVCACHE_RECV_BUFFER_COUNT: "1"
      DYN_TRTLLM_ENABLE_ATTENTION_DP: "1"
      DYN_ENGINE_CONV_AFFINITY: "1"
      DYN_TOKENIZER: fastokens
      DYN_PUBLISH_KV_EVENTS: "0"
    args:
      attention_dp_config:
        enable_kv_cache_aware_routing: false
        kv_cache_routing_conversation_affinity: true
        kv_cache_routing_max_sessions: 65536
      cache_transceiver_config:
        backend: NIXL
        transceiver_runtime: PYTHON
          # C++ transfer-agent bounce: every prefill->decode copy is staged in fixed pieces instead of
          # first-touch writes into the remote pool.
        agent_bounce_buffer_enable: true
        agent_bounce_params:
          max_average_descriptor_size: 4MB
          min_descriptor_count: '1'
        kv_cache_bounce_size_mb: 1024
        max_tokens_in_buffer: 1048576
        kv_transfer_timeout_ms: 600000
      cuda_graph_config:
      disable_overlap_scheduler: false
      enable_attention_dp: true
      enable_chunked_prefill: true
      trust_remote_code: true
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: true
        event_buffer_max_size: 0
        free_gpu_memory_fraction: 0.75
        host_cache_size: 137438953472
        tokens_per_block: 64
      max_batch_size: 256
      max_num_tokens: 8192
      max_seq_len: 1048576
      moe_config:
        backend: CUTEDSL
      moe_expert_parallel_size: 4
      num_postprocess_workers: 8
      pipeline_parallel_size: 1
      enable_iter_perf_stats: true
      print_iter_log: true
      return_perf_metrics: false
      scheduler_config:
        capacity_scheduler_policy: MAX_UTILIZATION
      sparse_attention_config:
        algorithm: dsa
        enable_heuristic_topk: true
      speculative_config:
        decoding_type: MTP
        max_draft_len: 3
      tensor_parallel_size: 4
    nodes: 4
    workers: 4
  decode:
    workers: 1
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TQDM_DISABLE: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TLLM_LOG_LEVEL: INFO
      TRTLLM_SERVER_DISABLE_GC: "1"
      TRTLLM_WORKER_DISABLE_GC: "1"
      TRTLLM_ENABLE_PDL: "1"
      NCCL_GRAPH_MIXING_SUPPORT: "0"
      MIMALLOC_PURGE_DELAY: "0"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TRTLLM_FUSED_DSA_METADATA: "1"
      TRTLLM_DSA_INDEXER_BF16: "1"
      TRTLLM_SERVE_ENABLE_MSGSPEC: "1"
      TLLM_ADP_ROUTER_MATCH_RATE_THRESHOLD: "0.10"
      TRTLLM_KV_CACHE_TRANSFER_TIMEOUT_SEC: "600"
      UCX_CUDA_IPC_ENABLE_MNNVL: "y"
      UCX_RNDV_SCHEME: put_zcopy
      TRTLLM_KVCACHE_SEND_BUFFER_COUNT: "1"
      TRTLLM_KVCACHE_RECV_BUFFER_COUNT: "1"
      DYN_TRTLLM_ENABLE_ATTENTION_DP: "1"
      DYN_ENGINE_CONV_AFFINITY: "1"
      DYN_TOKENIZER: fastokens
      DYN_PUBLISH_KV_EVENTS: "0"
    args:
      cache_transceiver_config:
        backend: NIXL
        transceiver_runtime: PYTHON
          # C++ transfer-agent bounce: every prefill->decode copy is staged in fixed pieces instead of
          # first-touch writes into the remote pool.
        agent_bounce_buffer_enable: true
        agent_bounce_params:
          max_average_descriptor_size: 4MB
          min_descriptor_count: '1'
        kv_cache_bounce_size_mb: 1024
        max_tokens_in_buffer: 1048576
        kv_transfer_timeout_ms: 600000
      cuda_graph_config:
        enable_padding: true
        batch_sizes:
          - 1
          - 2
          - 4
          - 8
          - 16
      enable_attention_dp: true
      trust_remote_code: true
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        event_buffer_max_size: 0
        free_gpu_memory_fraction: 0.9
        tokens_per_block: 64
        host_cache_size: 137438953472
      max_num_tokens: 128
      max_seq_len: 1048576
      moe_config:
        backend: CUTEDSL
        use_low_precision_moe_combine: true
      num_postprocess_workers: 4
      pipeline_parallel_size: 1
      enable_iter_perf_stats: true
      print_iter_log: true
      return_perf_metrics: false
      sparse_attention_config:
        algorithm: dsa
        enable_heuristic_topk: true
        use_cute_dsl_paged_mqa_logits: true
      speculative_config:
        decoding_type: MTP
        max_draft_len: 3
      stream_interval: 20
      enable_lm_head_tp_in_adp: false
      max_batch_size: 16
      moe_expert_parallel_size: 8
      tensor_parallel_size: 8

    nodes: 2
    gpus: 8
frontend:
  type: dynamo
  enable_multiple_frontends: false
  env:
    ETCD_LEASE_TTL: '120'
    DYN_ROUTER_QUEUE_THRESHOLD: None
    DYN_ROUTER_TEMPERATURE: '0'
    DYN_TOKENIZER_CACHE: '1'
    DYN_TOKENIZER_CACHE_BYTES: '8000000000'
    DYN_TOKENIZER: fastokens
    DYN_TCP_REQUEST_TIMEOUT: '30'
    DYN_LOG: warn
    DYN_ROUTER_SESSION_AFFINITY_TTL_SECS: '14400'
  args:
    router-mode: kv
    no-kv-events: true
    active-decode-blocks-threshold: None
    active-prefill-tokens-threshold: None
    active-prefill-tokens-threshold-frac: None
  placement:
    node: head
benchmark:
  type: custom
  command: |
    set -euo pipefail
    AIPERF_VENV="${TMPDIR:-/tmp}/agentx-aiperf-${SLURM_JOB_ID:-$$}"
    if [ ! -x "$AIPERF_VENV/bin/aiperf" ]; then
      python3 -m venv "$AIPERF_VENV"
      "$AIPERF_VENV/bin/pip" install -q --upgrade pip
      "$AIPERF_VENV/bin/pip" install -q "aiperf @ $AIPERF_REF" "datasets>=4.7.0" "huggingface_hub[cli]>=0.25.0"
    fi
    ARTIFACT_DIR="/logs/agentic/conc_227/aiperf_artifacts"
    mkdir -p "$ARTIFACT_DIR"
    metrics_args=()
    if [ -n "${AIPERF_SERVER_METRICS_URLS:-}" ]; then
      IFS=',' read -r -a metrics_urls <<< "$AIPERF_SERVER_METRICS_URLS"
      metrics_args=(--server-metrics "${metrics_urls[@]}")
    fi
    "$AIPERF_VENV/bin/aiperf" profile --scenario inferencex-agentx-mvp \
      --url "http://$SRT_FRONTEND_HOST:$SRT_FRONTEND_PORT" \
      --endpoint /v1/chat/completions --endpoint-type chat --streaming \
      --model GLM-5.2-NVFP4 --tokenizer /model --tokenizer-trust-remote-code \
      --public-dataset semianalysis_cc_traces_weka_062126 \
    --trajectory-start-min-ratio 0.25 --trajectory-start-max-ratio 0.75 \
    --num-dataset-entries 393 --slice-duration 1.0 --stats-interval 30 \
    --use-server-token-count --no-gpu-telemetry --random-seed 42 \
      --concurrency 227 --benchmark-duration 3600 \
      --failed-request-threshold 0.1 --warmup-requests-per-lane 10 \
      --trace-idle-gap-cap-seconds 300 --warmup-grace-period 1800 \
      "${metrics_args[@]}" --output-artifact-dir "$ARTIFACT_DIR"
  env:
    AIPERF_DATASET_CONFIGURATION_TIMEOUT: "1800"
    AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT: "1800"
    AIPERF_HTTP_TCP_USER_TIMEOUT: "900000"
    AIPERF_REF: file:///lustre/fsw/coreai_comparch_inferencex/rihuo/agentx-harness
    AIPERF_DATASET_MMAP_CACHE_DIR: /lustre/fsw/coreai_comparch_inferencex/rihuo/aiperf_mmap_cache
    HF_HUB_CACHE: /lustre/fsw/coreai_comparch_inferencex/rihuo/hf_cache
    AIPERF_DATASET_WEKA_LIVE_ASSISTANT_RESPONSES: "0"
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
    OPENAI_API_KEY: EMPTY
  placement:
    node: last_decode

name: dynamo-disagg-gb300-4p1d-dep8-c227-b16-mtp3
extra_mount:
  - "/lustre:/lustre"
  - "/lustre/fsw/coreai_comparch_inferencex/rihuo/dynamo_wheels:/dynamo_wheels"

setup_script: install_dynamo_wheel.sh
