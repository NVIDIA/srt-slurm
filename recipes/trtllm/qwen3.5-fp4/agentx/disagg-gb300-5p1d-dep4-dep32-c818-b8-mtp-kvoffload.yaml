  gpus_per_node: 4
  prefill_nodes: 5
  prefill_workers: 5
  gpus_per_prefill: 4
  decode_nodes: 8
  decode_workers: 1
  gpus_per_decode: 32
backend:
  type: trtllm
  prefill_environment:
    TLLM_LOG_LEVEL: INFO
    TRTLLM_SERVER_DISABLE_GC: '1'
    TRTLLM_WORKER_DISABLE_GC: '1'
    TRTLLM_ENABLE_PDL: '1'
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    MIMALLOC_PURGE_DELAY: '0'
    TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '3.80'
    CUDA_SCALE_LAUNCH_QUEUES: 4x
    UCX_TLS: cuda_ipc,cuda_copy,sm,self,tcp
    DYN_ENGINE_CONV_AFFINITY: "1"
  decode_environment:
    TLLM_LOG_LEVEL: INFO
    TRTLLM_SERVER_DISABLE_GC: '1'
    TRTLLM_WORKER_DISABLE_GC: '1'
    TRTLLM_ENABLE_PDL: '1'
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    MIMALLOC_PURGE_DELAY: '0'
    TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '3.80'
    UCX_TLS: cuda_ipc,cuda_copy,sm,self,tcp
    DYN_ENGINE_CONV_AFFINITY: "1"
  trtllm_config:
    prefill:
      attention_dp_config:
        kv_cache_routing_conversation_affinity: true
      cache_transceiver_config:
        backend: NIXL
        kv_transfer_timeout_ms: 600000
        transceiver_runtime: PYTHON
      cuda_graph_config: null
      disable_overlap_scheduler: false
      enable_attention_dp: true
      enable_chunked_prefill: true
      enable_iter_perf_stats: false
      enable_iter_req_stats: false
      kv_cache_config:
        block_reuse_config:
          policy: per_conversation
          max_num_turns: 3
        dtype: fp8
        enable_block_reuse: true
        event_buffer_max_size: 0
        free_gpu_memory_fraction: 0.8
        host_cache_size: 137438953472
        iteration_stats_interval: 1
        mamba_state_config:
          additional_snapshot_offsets_from_end:
          - 2
          periodic_snapshot_interval: 0
        pool_ratio:
        - 0.8
        - 0.2
        tokens_per_block: 64
        use_kv_cache_manager_v2: true
      max_batch_size: 64
      max_num_tokens: 8192
      max_seq_len: 262144
      moe_config:
        backend: CUTEDSL
      moe_expert_parallel_size: 4
      num_serve_frontends: 4
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      pipeline_parallel_size: 1
      print_iter_log: true
      return_perf_metrics: false
      scheduler_config:
        capacity_scheduler_policy: MAX_UTILIZATION
      tensor_parallel_size: 4
      torch_compile_config:
        capture_num_tokens:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 32
        - 64
        - 128
        - 256
        - 512
        - 1024
        - 2048
        - 4096
        - 8192
        enable_fullgraph: true
        enable_piecewise_cuda_graph: true
      trust_remote_code: true
    decode:
      cache_transceiver_config:
        backend: NIXL
        kv_transfer_timeout_ms: 600000
        transceiver_runtime: PYTHON
      cuda_graph_config:
        batch_sizes:
        - 1
        - 2
        - 4
        - 8
        enable_padding: true
      enable_attention_dp: true
      enable_iter_perf_stats: false
      enable_iter_req_stats: false
      enable_lm_head_tp_in_adp: true
      kv_cache_config:
        avg_seq_len: 102150
        dtype: fp8
        enable_block_reuse: false
        event_buffer_max_size: 0
        free_gpu_memory_fraction: 0.85
        host_cache_size: 137438953472
        iteration_stats_interval: 1
        tokens_per_block: 64
        use_kv_cache_manager_v2: true
      max_batch_size: 8
      max_num_tokens: 56
      max_seq_len: 262148
      moe_config:
        backend: CUTEDSL
        use_low_precision_moe_combine: true
      moe_expert_parallel_size: 32
      num_postprocess_workers: 4
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      pipeline_parallel_size: 1
      print_iter_log: true
      return_perf_metrics: false
      scheduler_config:
        capacity_scheduler_policy: GUARANTEED_NO_EVICT
      speculative_config:
        decoding_type: MTP
        max_draft_len: 6
      stream_interval: 20
      tensor_parallel_size: 32
      trust_remote_code: true
frontend:
  type: dynamo
  nginx_session_affinity: true
  enable_multiple_frontends: true
  num_additional_frontends: 3
  nginx_session_affinity_header: X-Dynamo-Session-ID
  env:
    ETCD_LEASE_TTL: "120"
    DYN_TOKENIZER_CACHE: "1"
    DYN_TOKENIZER_CACHE_BYTES: "8000000000"
    DYN_TOKENIZER: "fastokens"
  args:
    router-mode: kv
    router-session-affinity-ttl-secs: '14400'
    active-decode-blocks-threshold: None
    active-prefill-tokens-threshold: None
    active-prefill-tokens-threshold-frac: None

benchmark:
  type: custom
  client_placement: last_decode
  env:
    AIPERF_REF: file:///lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/rihuo/aiperf
    HF_HUB_CACHE: /lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/rihuo/hf_cache
    HF_HOME: /lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/rihuo/hf_cache
    AIPERF_DATASET_MMAP_CACHE_DIR: /lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/rihuo/hf_cache/aiperf_mmap
    AIPERF_DATASET_CONFIGURATION_TIMEOUT: '1800'
    AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT: '1800'
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
  command: |
    set -euo pipefail
    AIPERF_VENV="${TMPDIR:-/tmp}/agentx-aiperf-${SLURM_JOB_ID:-$$}"
    if [ ! -x "$AIPERF_VENV/bin/aiperf" ]; then
      python3 -m venv "$AIPERF_VENV"
      "$AIPERF_VENV/bin/pip" install -q --upgrade pip
      "$AIPERF_VENV/bin/pip" install -q "aiperf @ $AIPERF_REF" "datasets>=4.7.0" "huggingface_hub[cli]>=0.25.0"
    fi
    mkdir -p /logs/agentic/concurrency_818
    "$AIPERF_VENV/bin/aiperf" profile --scenario inferencex-agentx-mvp --url http://$SRT_FRONTEND_HOST:$SRT_FRONTEND_PORT --endpoint /v1/chat/completions \
      --endpoint-type chat --streaming -m Qwen3.5-397B-A17B-NVFP4-V2 --tokenizer /model \
      --tokenizer-trust-remote-code --public-dataset semianalysis_cc_traces_weka_062126_256k --num-dataset-entries 393 \
      --slice-duration 1.0 --trajectory-start-min-ratio 0.25 --trajectory-start-max-ratio 0.75 \
      --trace-idle-gap-cap-seconds 300 --warmup-requests-per-lane 10 --warmup-grace-period 1800 \
      --stats-interval 30 --use-server-token-count --no-gpu-telemetry \
      --random-seed 42 --failed-request-threshold 0.10 --benchmark-duration 3600 \
      --concurrency 818 --output-artifact-dir /logs/agentic/concurrency_818
