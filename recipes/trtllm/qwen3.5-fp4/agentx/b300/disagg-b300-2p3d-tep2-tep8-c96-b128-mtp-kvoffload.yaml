name: disagg-b300-2p3d-tep2-tep8-c96-b128-mtp-kvoffload
model:
  path: qwen3.5-nvfp4
  container: ${AGENTX_CONTAINER_V6}
  precision: fp4
identity:
  model:
    repo: Qwen3.5-397B-A17B-NVFP4-V2
  container:
    image: ${AGENTX_CONTAINER_V6}
  frameworks:
    tensorrt_llm: 1.3.0rc24
extra_mount:
  - ${AGENTX_TRANSFER_PY}:/usr/local/lib/python3.12/dist-packages/tensorrt_llm/_torch/disaggregation/native/transfer.py
slurm:
  time_limit: 04:00:00
health_check:
  max_attempts: 540
  interval_seconds: 10
resources:
  gpu_type: b300
  gpus_per_node: 8
  prefill_nodes: 1
  prefill_workers: 2
  gpus_per_prefill: 2
  decode_nodes: 3
  decode_workers: 3
  gpus_per_decode: 8
backend:
  type: trtllm
  prefill_environment:
    LD_PRELOAD: /usr/local/lib/libagentx_srand_port.so
    CUDA_SCALE_LAUNCH_QUEUES: 4x
    MIMALLOC_ARENA_RESERVE: '0'
    MIMALLOC_PURGE_DELAY: ''
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    TLLM_LOG_LEVEL: INFO
    TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '3.80'
    TRTLLM_ENABLE_PDL: '1'
    TRTLLM_PINNED_WEIGHT_STAGING: '1'
    TRTLLM_SERVER_DISABLE_GC: '1'
    TRTLLM_WORKER_DISABLE_GC: '1'
    UCX_TLS: cuda_ipc,cuda_copy,sm,self,tcp
    TRTLLM_KV_TRANSFER_NUM_THREADS: '8'
    TLLM_AUTOTUNER_CACHE_PATH: ${AGENTX_CACHE_ROOT}/disagg-b300-2p3d-tep2-tep8-c96-b128-mtp-kvoffload/autotuner_prefill.json
  decode_environment:
    MIMALLOC_ARENA_RESERVE: '0'
    MIMALLOC_PURGE_DELAY: ''
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    TLLM_LOG_LEVEL: INFO
    TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '3.80'
    TRTLLM_ENABLE_PDL: '1'
    TRTLLM_PINNED_WEIGHT_STAGING: '1'
    TRTLLM_SERVER_DISABLE_GC: '1'
    TRTLLM_WORKER_DISABLE_GC: '1'
    UCX_TLS: cuda_ipc,cuda_copy,sm,self,tcp
    TRTLLM_KV_TRANSFER_NUM_THREADS: '8'
    TLLM_AUTOTUNER_CACHE_PATH: ${AGENTX_CACHE_ROOT}/disagg-b300-2p3d-tep2-tep8-c96-b128-mtp-kvoffload/autotuner_decode.json
  trtllm_config:
    prefill:
      attention_dp_config:
        kv_cache_routing_conversation_affinity: true
      cache_transceiver_config:
        backend: NIXL
        kv_transfer_sender_future_timeout_ms: 20
        kv_transfer_timeout_ms: 600000
        transceiver_runtime: PYTHON
      cuda_graph_config: null
      # B300 stability adaptation: the matched overlap run stalled in the
      # sampler-event path; the non-overlap control is the measured recipe.
      disable_overlap_scheduler: true
      enable_attention_dp: false
      enable_chunked_prefill: true
      enable_iter_perf_stats: false
      enable_iter_req_stats: false
      kv_cache_config:
        block_reuse_config:
          max_num_turns: 3
          policy: per_conversation
        dtype: fp8
        enable_block_reuse: true
        event_buffer_max_size: 0
        free_gpu_memory_fraction: 0.8
        host_cache_size: 137438953472
        mamba_state_config:
          additional_snapshot_offsets_from_end:
          - 2
          periodic_snapshot_interval: 0
        pool_ratio:
        - 0.8
        - 0.2
        tokens_per_block: 64
        use_kv_cache_manager_v2: true
      max_batch_size: 64
      max_num_tokens: 16384
      max_seq_len: 262144
      moe_config:
        backend: CUTEDSL
      moe_expert_parallel_size: 2
      num_serve_frontends: 8
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      pipeline_parallel_size: 1
      print_iter_log: true
      return_perf_metrics: false
      scheduler_config:
        capacity_scheduler_policy: MAX_UTILIZATION
      tensor_parallel_size: 2
      torch_compile_config:
        capture_num_tokens:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 32
        - 64
        - 128
        - 256
        - 512
        - 1024
        - 2048
        - 4096
        - 8192
        - 16384
        enable_fullgraph: true
        enable_piecewise_cuda_graph: true
      trust_remote_code: true
    decode:
      cache_transceiver_config:
        backend: NIXL
        kv_transfer_sender_future_timeout_ms: 20
        kv_transfer_timeout_ms: 600000
        transceiver_runtime: PYTHON
      cuda_graph_config:
        batch_sizes:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 24
        - 32
        - 40
        - 48
        - 56
        - 64
        - 72
        - 80
        - 88
        - 96
        - 104
        - 112
        - 120
        - 128
        enable_padding: true
      enable_attention_dp: false
      enable_iter_perf_stats: false
      enable_iter_req_stats: false
      enable_lm_head_tp_in_adp: false
      kv_cache_config:
        avg_seq_len: 102150
        dtype: fp8
        enable_block_reuse: false
        event_buffer_max_size: 0
        free_gpu_memory_fraction: 0.85
        host_cache_size: 137438953472
        tokens_per_block: 64
        use_kv_cache_manager_v2: true
      max_batch_size: 128
      max_num_tokens: 896
      max_seq_len: 262148
      moe_config:
        backend: CUTEDSL
        use_low_precision_moe_combine: true
      moe_expert_parallel_size: 8
      num_postprocess_workers: 4
      num_serve_frontends: 4
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      pipeline_parallel_size: 1
      print_iter_log: true
      return_perf_metrics: false
      scheduler_config:
        capacity_scheduler_policy: GUARANTEED_NO_EVICT
      speculative_config:
        decoding_type: MTP
        max_draft_len: 6
      stream_interval: 20
      tensor_parallel_size: 8
      trust_remote_code: true
frontend:
  type: trtllm_serve
  enable_multiple_frontends: false
  ctx_router:
    type: conversation
  server_config_extra:
    gen_strip_message_history: true
    gen_tokids_ctxbytes: true
    num_workers: 4
    return_perf_metrics: false
    server_keep_alive_timeout: 3600
  orchestrator_placement: first_decode
  args:
    server_start_timeout: 7200
    request_timeout: 7200
environment:
  PYTHONPATH: ${AGENTX_TRTLLM_PYTHONPATH}
  TRTLLM_SERVER_DISABLE_GC: '1'
benchmark:
  type: custom
  client_placement: last_decode
  env:
    AIPERF_REF: file://${AGENTX_AIPERF_REF}
    HF_HUB_CACHE: ${AGENTX_HF_CACHE}
    HF_HOME: ${AGENTX_HF_CACHE}
    AIPERF_DATASET_MMAP_CACHE_DIR: ${AGENTX_CACHE_ROOT}/aiperf_mmap
  command: |
    set -euo pipefail
    # Package mirrors can return transient 5xx responses during startup.
    export PIP_RETRIES=20 PIP_TIMEOUT=120
    # aiperf goes INTO the container image (reusing its numpy/torch/HF stack),
    # exactly as run_benchmark_agentx.sh does for the measured runs.
    pip install --force-reinstall --no-deps "aiperf @ $AIPERF_REF"
    pip install cyclopts "ruamel.yaml" msgspec orjson kaleido dash dash-bootstrap-components \
        textual starlette-compress setproctitle jmespath aiofiles ffmpeg-python \
        pydantic-settings prometheus_client fastapi soundfile plotly seaborn tiktoken \
        tqdm "uvicorn[standard]" uvloop crick zstandard
    pip install -U datasets
    # LAST, and load-bearing: the image ships pydantic 2.13.0, whose
    # ValidationInfo.data=None bug fails ~20% of conversation decodes.
    pip install --force-reinstall "pydantic==2.13.4"
    export HF_HUB_TRUST_REMOTE_CODE=1
    # Both exports were live in the measured runs (unconditional in
    # run_benchmark_agentx.sh): the X-Session-ID mirror of X-Correlation-ID
    # (trtllm-serve accepts either as the conversation id), and the persistent
    # dataset mmap-decode cache injected by the renderer.
    export AIPERF_HTTP_X_SESSION_ID_FROM_CORRELATION_ID=true
    : "${AIPERF_DATASET_MMAP_CACHE_DIR:?must be set}"
    mkdir -p /logs/agentic/concurrency_96 "$AIPERF_DATASET_MMAP_CACHE_DIR"
    # The measured runs carried a 1 Hz /perf_metrics drain on the orchestrator
    # for the whole window (harness poller; return_perf_metrics=false server-side,
    # so responses were empty). Reproduce the load, then stop it after aiperf.
    ( while true; do curl -sf http://$SRT_FRONTEND_HOST:$SRT_FRONTEND_PORT/perf_metrics >/dev/null 2>&1 || true; sleep 1; done ) &
    POLLER_PID=$!
    aiperf profile \
      --scenario inferencex-agentx-mvp \
      -m /model \
      --tokenizer-trust-remote-code \
      --url http://$SRT_FRONTEND_HOST:$SRT_FRONTEND_PORT \
      --endpoint /v1/chat/completions \
      --endpoint-type chat \
      --streaming \
      --public-dataset semianalysis_cc_traces_weka_062126_256k \
      --trajectory-start-min-ratio 0.25 \
      --trajectory-start-max-ratio 0.75 \
      --failed-request-threshold 0.10 \
      --use-server-token-count \
      --no-gpu-telemetry \
      --random-seed 42 \
      --benchmark-duration 3600 \
      --concurrency 96 \
      --artifact-dir /logs/agentic/concurrency_96 \
      --warmup-requests-per-lane 10 \
      --warmup-grace-period 1800 \
      --num-dataset-entries 393 \
      --slice-duration 1.0 \
      --stats-interval 30 \
      --trace-idle-gap-cap-seconds 300
    kill $POLLER_PID 2>/dev/null || true
