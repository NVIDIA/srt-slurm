name: disagg-gb300-1p1d-tep2-tep4-c8-b128-mtp-kvoffload
model:
  path: /lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/rihuo/Qwen3.5-397B-A17B-NVFP4-V2
  container: /lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/rihuo/tensorrt-llm-release-arm64-1-3-0rc24.sqsh
  precision: fp4
setup_script: "install_dynamo_wheel.sh"

extra_mount:
  - /lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/rihuo/dynamo_wheels:/dynamo_wheels
  - /lustre:/lustre

dynamo:
  install: false

identity:
  model:
    repo: Qwen3.5-397B-A17B-NVFP4-V2
  container:
    image: /lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/rihuo/tensorrt-llm-release-arm64-1-3-0rc24.sqsh
  frameworks:
    tensorrt_llm: 1.3.0rc24
slurm:
  time_limit: 04:00:00
health_check:
  max_attempts: 720
  interval_seconds: 10
resources:
  gpu_type: gb300
  gpus_per_node: 4
  prefill_nodes: 1
  prefill_workers: 1
  gpus_per_prefill: 2
  decode_nodes: 1
  decode_workers: 1
  gpus_per_decode: 4
backend:
  type: trtllm
  prefill_environment:
    CUDA_SCALE_LAUNCH_QUEUES: 4x
    MIMALLOC_ARENA_RESERVE: '0'
    MIMALLOC_PURGE_DELAY: ''
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    TLLM_LOG_LEVEL: INFO
    TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '3.80'
    TRTLLM_ENABLE_PDL: '1'
    TRTLLM_KV_TRANSFER_NUM_THREADS: '8'
    TRTLLM_PINNED_WEIGHT_STAGING: '1'
    TRTLLM_SERVER_DISABLE_GC: '1'
    TRTLLM_WORKER_DISABLE_GC: '1'
    UCX_TLS: cuda_ipc,cuda_copy,sm,self,tcp
    DYN_ENGINE_CONV_AFFINITY: "1"
  decode_environment:
    MIMALLOC_ARENA_RESERVE: '0'
    MIMALLOC_PURGE_DELAY: ''
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    TLLM_LOG_LEVEL: INFO
    TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '3.80'
    TRTLLM_ENABLE_PDL: '1'
    TRTLLM_KV_TRANSFER_NUM_THREADS: '8'
    TRTLLM_PINNED_WEIGHT_STAGING: '1'
    TRTLLM_SERVER_DISABLE_GC: '1'
    TRTLLM_WORKER_DISABLE_GC: '1'
    UCX_TLS: cuda_ipc,cuda_copy,sm,self,tcp
    DYN_ENGINE_CONV_AFFINITY: "1"
  trtllm_config:
    prefill:
      attention_dp_config:
        kv_cache_routing_conversation_affinity: true
      cache_transceiver_config:
        backend: NIXL
        kv_transfer_sender_future_timeout_ms: 20
        kv_transfer_timeout_ms: 600000
        transceiver_runtime: PYTHON
      cuda_graph_config: null
      disable_overlap_scheduler: false
      enable_attention_dp: false
      enable_chunked_prefill: true
      enable_iter_perf_stats: false
      enable_iter_req_stats: false
      kv_cache_config:
        block_reuse_config:
          max_num_turns: 3
          policy: per_conversation
        dtype: fp8
        enable_block_reuse: true
        event_buffer_max_size: 0
        free_gpu_memory_fraction: 0.8
        host_cache_size: 137438953472
        iteration_stats_interval: 1
        mamba_state_config:
          additional_snapshot_offsets_from_end:
          - 2
          periodic_snapshot_interval: 0
        pool_ratio:
        - 0.8
        - 0.2
        tokens_per_block: 64
        use_kv_cache_manager_v2: true
      max_batch_size: 64
      max_num_tokens: 16384
      max_seq_len: 262144
      moe_config:
        backend: CUTEDSL
      moe_expert_parallel_size: 2
      num_serve_frontends: 8
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      pipeline_parallel_size: 1
      print_iter_log: true
      return_perf_metrics: false
      scheduler_config:
        capacity_scheduler_policy: MAX_UTILIZATION
      tensor_parallel_size: 2
      torch_compile_config:
        capture_num_tokens:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 32
        - 64
        - 128
        - 256
        - 512
        - 1024
        - 2048
        - 4096
        - 8192
        - 16384
        enable_fullgraph: true
        enable_piecewise_cuda_graph: true
      trust_remote_code: true
    decode:
      cache_transceiver_config:
        backend: NIXL
        kv_transfer_sender_future_timeout_ms: 20
        kv_transfer_timeout_ms: 600000
        transceiver_runtime: PYTHON
      cuda_graph_config:
        batch_sizes:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 24
        - 32
        - 40
        - 48
        - 56
        - 64
        - 72
        - 80
        - 88
        - 96
        - 104
        - 112
        - 120
        - 128
        enable_padding: true
      enable_attention_dp: false
      enable_iter_perf_stats: false
      enable_iter_req_stats: false
      enable_lm_head_tp_in_adp: false
      kv_cache_config:
        avg_seq_len: 102150
        dtype: fp8
        enable_block_reuse: false
        event_buffer_max_size: 0
        free_gpu_memory_fraction: 0.85
        host_cache_size: 137438953472
        iteration_stats_interval: 1
        tokens_per_block: 64
        use_kv_cache_manager_v2: true
      max_batch_size: 128
      max_num_tokens: 896
      max_seq_len: 262148
      moe_config:
        backend: CUTEDSL
        use_low_precision_moe_combine: true
      moe_expert_parallel_size: 4
      num_postprocess_workers: 4
      num_serve_frontends: 4
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      pipeline_parallel_size: 1
      print_iter_log: true
      return_perf_metrics: false
      scheduler_config:
        capacity_scheduler_policy: GUARANTEED_NO_EVICT
      speculative_config:
        decoding_type: MTP
        max_draft_len: 6
      stream_interval: 20
      tensor_parallel_size: 4
      trust_remote_code: true
frontend:
  type: dynamo
  enable_multiple_frontends: false
  env:
    ETCD_LEASE_TTL: "120"
    DYN_TOKENIZER_CACHE: "1"
    DYN_TOKENIZER_CACHE_BYTES: "8000000000"
    DYN_TOKENIZER: "fastokens"
  args:
    router-mode: kv
    router-session-affinity-ttl-secs: '14400'
    active-decode-blocks-threshold: None
    active-prefill-tokens-threshold: None
    active-prefill-tokens-threshold-frac: None
benchmark:
  type: custom
  client_placement: last_decode
  env:
    AIPERF_REF: file:///lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/rihuo/aiperf
    HF_HUB_CACHE: /lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/rihuo/hf_cache
    HF_HOME: /lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/rihuo/hf_cache
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
  command: |
    set -euo pipefail
    # aiperf goes INTO the container image (reusing its numpy/torch/HF stack),
    # exactly as run_benchmark_agentx.sh does for the measured runs.
    pip install --force-reinstall --no-deps "aiperf @ $AIPERF_REF"
    pip install cyclopts "ruamel.yaml" msgspec orjson kaleido dash dash-bootstrap-components \
        textual starlette-compress setproctitle jmespath aiofiles ffmpeg-python \
        pydantic-settings prometheus_client fastapi soundfile plotly seaborn tiktoken \
        tqdm "uvicorn[standard]" uvloop crick zstandard
    pip install -U datasets
    # LAST, and load-bearing: the image ships pydantic 2.13.0, whose
    # ValidationInfo.data=None bug fails ~20% of conversation decodes.
    pip install --force-reinstall "pydantic==2.13.4"
    export HF_HUB_TRUST_REMOTE_CODE=1
    mkdir -p /logs/agentic/concurrency_8
    aiperf profile \
      --scenario inferencex-agentx-mvp \
      -m Qwen3.5-397B-A17B-NVFP4-V2 --tokenizer /model \
      --tokenizer-trust-remote-code \
      --url http://$SRT_FRONTEND_HOST:$SRT_FRONTEND_PORT \
      --endpoint /v1/chat/completions \
      --endpoint-type chat \
      --streaming \
      --public-dataset semianalysis_cc_traces_weka_062126_256k \
      --trajectory-start-min-ratio 0.25 \
      --trajectory-start-max-ratio 0.75 \
      --failed-request-threshold 0.10 \
      --use-server-token-count \
      --no-gpu-telemetry \
      --random-seed 42 \
      --benchmark-duration 3600 \
      --concurrency 8 \
      --artifact-dir /logs/agentic/concurrency_8 \
      --warmup-requests-per-lane 10 \
      --warmup-grace-period 1800 \
      --num-dataset-entries 393 \
      --slice-duration 1.0 \
      --stats-interval 30 \
      --trace-idle-gap-cap-seconds 300
