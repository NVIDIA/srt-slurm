# Dynamo counterpart of ../trtllm-serve-final/disagg-gb300-1p1d-tep4-tep16-c8-b1-mtp-kvoffload.yaml
# Final Pareto point rpT1 c8: 1x CTX TEP4 + 1x GEN TEP16 b1, concurrency 8; trtllm-serve job 1148697.
# Topology, NUMA binding, engine args, worker optimizations and AgentX traffic follow the original recipe;
# dynamo.trtllm workers and the Dynamo frontend (1.6.0.dev20261010 from the mounted /dynamo_wheels).
# Dropped trtllm-serve-only settings: frontend process pools (num_serve_frontends, num_postprocess_workers),
# per-conversation frontend affinity and incremental tokenization (Dynamo's tokenizer prefix cache replaces it),
# the ctx router (Dynamo KV router with session affinity), server_config_extra and per-request perf-metrics JSONL.
# gen_router load_balancing (fewest active requests) maps to least-loaded, advertised by the decode workers
# through DYN_ROUTER_MODE (dynamo.trtllm --router-mode). The prefill hop would inherit that advertisement, so
# the prefill workers advertise the frontend's KV routing and 14400 s session affinity themselves.
# Benchmark client: the standard dynamo-1019 Dynamo-aware AIPerf client (no run-specific client customization).
# Engine return_perf_metrics is off; Dynamo publish_metrics is on. Not yet measured under Dynamo.
# Engine env requires latest-source Q35 ctx/gen profiles; rebuild/select model.container accordingly.
# Compiler caches use library defaults; see README.md.
schema: 2
name: disagg-gb300-1p1d-tep4-tep16-c8-b1-mtp-kvoffload-dynamo
model:
  path: /lustre/fsw/coreai_comparch_inferencex/rihuo/Qwen3.5-397B-A17B-NVFP4-V2
  container: /lustre/fsw/coreai_comparch_inferencex/rihuo/nvidia+tensorrt-llm+release+1.3.0a0.dev202610151219+q35repro-09607ea47b.sqsh
  precision: fp4
identity:
  model:
    repo: Qwen3.5-397B-A17B-NVFP4-V2
  container:
    image: /scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/xiaomingc/qwen35_e2e/images/nvidia+tensorrt-llm+release+1.3.0a0.dev202610151219+q35repro-09607ea47b.sqsh
  frameworks:
    tensorrt_llm: 1.3.0a0.dev202610151219
    dynamo: 1.6.0.dev20261010
health_check:
  max_attempts: 540
  interval_seconds: 10
resources:
  gpu_type: gb300
  gpus_per_node: 4
engine:
  type: trtllm
  served_model_name: Qwen3.5-397B-A17B-NVFP4-V2
  publish_metrics: true
  numa_cpu_bind: true
  numa_memory_bind: preferred
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 4
    env:
      TRTLLM_Q35_PROFILE: ctx
      CUDA_SCALE_LAUNCH_QUEUES: 4x
      ENROOT_ALLOW_DEV: 'yes'
      MIMALLOC_ARENA_RESERVE: '0'
      MIMALLOC_PURGE_DELAY: ''
      NCCL_GRAPH_MIXING_SUPPORT: '0'
      OMP_NUM_THREADS: '1'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TLLM_LOG_LEVEL: INFO
      TLLM_PROFILE_LOG_RANKS: all
      TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '3.80'
      TRTLLM_CTX_SCHED_SRPT: '1'
      TRTLLM_EMBED_COMPILE_ONCE: '1'
      TRTLLM_ENABLE_PDL: '1'
      TRTLLM_KV_TRANSFER_NUM_THREADS: '8'
      TRTLLM_MAMBA_INFORWARD_SNAPSHOT: '1'
      TRTLLM_PINNED_WEIGHT_STAGING: '1'
      TRTLLM_PREFILL_BCG: '1'
      TRTLLM_SERVER_DISABLE_GC: '1'
      TRTLLM_SKIP_KV_CACHE_ESTIMATION: '1'
      TRTLLM_WORKER_DISABLE_GC: '1'
      UCX_CUDA_COPY_MAX_POLL: inf
      UCX_CUDA_IPC_MAX_POLL: inf
      UCX_TLS: rc,cuda_ipc,cuda_copy,sm,self,tcp
      DYN_ENGINE_CONV_AFFINITY: '1'
      DYN_ROUTER_MODE: kv
      DYN_ROUTER_SESSION_AFFINITY_TTL_SECS: '14400'
    args:
      allreduce_strategy: TWOSHOT
      attention_dp_config:
        kv_cache_routing_conversation_affinity: true
      cache_transceiver_config:
        backend: NIXL
        kv_transfer_sender_future_timeout_ms: 20
        kv_transfer_timeout_ms: 600000
        transceiver_runtime: PYTHON
      cuda_graph_config: null
      disable_overlap_scheduler: false
      enable_attention_dp: false
      enable_chunked_prefill: true
      enable_iter_perf_stats: true
      enable_iter_req_stats: false
      iter_perf_stats_interval: 40
      kv_cache_config:
        block_reuse_config:
          max_num_turns: 3
          policy: per_conversation
        dtype: fp8
        enable_block_reuse: true
        event_buffer_max_size: 0
        free_gpu_memory_fraction: 0.8
        host_cache_size: 137438953472
        iteration_stats_interval: 40
        mamba_state_config:
          additional_snapshot_offsets_from_end:
          - 2
          periodic_snapshot_interval: 0
        pool_ratio:
        - 0.8
        - 0.2
        tokens_per_block: 64
        use_kv_cache_manager_v2: true
      max_batch_size: 64
      max_num_tokens: 16384
      max_seq_len: 262144
      moe_config:
        backend: CUTEDSL
      moe_expert_parallel_size: 4
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      pipeline_parallel_size: 1
      print_iter_log: true
      return_perf_metrics: false
      scheduler_config:
        capacity_scheduler_policy: MAX_UTILIZATION
      speculative_config:
        decoding_type: MTP
        max_draft_len: 1
      tensor_parallel_size: 4
      torch_compile_config:
        capture_num_tokens:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 32
        - 64
        - 128
        - 256
        - 384
        - 512
        - 768
        - 1024
        - 1536
        - 2048
        - 2560
        - 3072
        - 3584
        - 4096
        - 4608
        - 5120
        - 5632
        - 6144
        - 6656
        - 7168
        - 7680
        - 8192
        - 10240
        - 12288
        - 14336
        - 16384
        enable_fullgraph: true
        enable_piecewise_cuda_graph: true
        enable_userbuffers: false
      trust_remote_code: true
  decode:
    nodes: 4
    workers: 1
    gpus: 16
    env:
      TRTLLM_Q35_PROFILE: gen
      ENROOT_ALLOW_DEV: 'yes'
      MIMALLOC_ARENA_RESERVE: '0'
      MIMALLOC_PURGE_DELAY: ''
      NCCL_GRAPH_MIXING_SUPPORT: '0'
      OMP_NUM_THREADS: '1'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TLLM_LOG_LEVEL: INFO
      TLLM_PROFILE_LOG_RANKS: all
      TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '3.80'
      TRTLLM_DISAGG_GEN_EMIT_FIRST_STEP: '1'
      TRTLLM_DISAGG_GEN_IDLE_POLL_SKIP: '1'
      TRTLLM_ENABLE_PDL: '1'
      TRTLLM_KV_TRANSFER_NUM_THREADS: '8'
      TRTLLM_OVERLAP_LOOP_ON_EXECUTION_STREAM: '1'
      TRTLLM_PINNED_WEIGHT_STAGING: '1'
      TRTLLM_SERVER_DISABLE_GC: '1'
      TRTLLM_SPEC_SAMPLER_FUSED_STORE: '1'
      TRTLLM_WORKER_DISABLE_GC: '1'
      UCX_CUDA_COPY_MAX_POLL: inf
      UCX_CUDA_IPC_MAX_POLL: inf
      UCX_TLS: rc,cuda_ipc,cuda_copy,sm,self,tcp
      DYN_ENGINE_CONV_AFFINITY: '1'
      DYN_ROUTER_MODE: least-loaded
    args:
      cache_transceiver_config:
        backend: NIXL
        kv_transfer_sender_future_timeout_ms: 20
        kv_transfer_timeout_ms: 600000
        transceiver_runtime: PYTHON
      cuda_graph_config:
        batch_sizes:
        - 1
        enable_padding: true
      enable_attention_dp: false
      enable_iter_perf_stats: true
      enable_iter_req_stats: false
      enable_lm_head_tp_in_adp: false
      iter_perf_stats_interval: 40
      kv_cache_config:
        avg_seq_len: 102150
        dtype: fp8
        enable_block_reuse: false
        event_buffer_max_size: 0
        free_gpu_memory_fraction: 0.85
        host_cache_size: 137438953472
        iteration_stats_interval: 40
        tokens_per_block: 64
        use_kv_cache_manager_v2: true
      max_batch_size: 1
      max_num_tokens: 7
      max_seq_len: 262148
      moe_config:
        backend: TRTLLM
        use_low_precision_moe_combine: true
      moe_expert_parallel_size: 8
      moe_tensor_parallel_size: 2
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      pipeline_parallel_size: 1
      print_iter_log: true
      return_perf_metrics: false
      scheduler_config:
        capacity_scheduler_policy: GUARANTEED_NO_EVICT
      speculative_config:
        decoding_type: MTP
        max_draft_len: 6
      stream_interval: 20
      tensor_parallel_size: 16
      trust_remote_code: true
frontend:
  type: dynamo
  enable_multiple_frontends: false
  env:
    ETCD_LEASE_TTL: '120'
    DYN_TOKENIZER_CACHE: '1'
    DYN_TOKENIZER_CACHE_BYTES: '8000000000'
    DYN_TOKENIZER: fastokens
    DYN_TOKEN_IDS_AS_BYTES: '1'
  args:
    router-mode: kv
    router-session-affinity-ttl-secs: '14400'
  placement:
    node: first_decode
benchmark:
  type: custom
  env:
    AIPERF_UI_REALTIME_METRICS_ENABLED: 'true'
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: trtllm_kv_cache_utilization
    AIPERF_REF: /lustre/fsw/coreai_comparch_inferencex/rihuo/agentx-harness
    HF_HUB_CACHE: /lustre/fsw/coreai_comparch_inferencex/rihuo/hf_cache
    HF_HOME: /lustre/fsw/coreai_comparch_inferencex/rihuo/hf_cache
  command: |
    set -euo pipefail
    # Install the Dynamo-aware AIPerf client and preserve the conversation decoding fix.
    python3 -m pip install --upgrade "$AIPERF_REF" "datasets==5.0.0" "huggingface-hub==1.14.0" "pydantic==2.13.4"
    export HF_HUB_TRUST_REMOTE_CODE=1
    export AIPERF_DATASET_MMAP_CACHE_DIR=/lustre/fsw/coreai_comparch_inferencex/rihuo/aiperf_mmap_cache
    mkdir -p /logs/agentic/concurrency_8
    : "${AIPERF_SERVER_METRICS_URLS:?Worker metrics URLs must be provided by srtctl}"
    IFS=',' read -r -a SERVER_METRICS_URLS <<< "$AIPERF_SERVER_METRICS_URLS"
    aiperf profile \
      --server-metrics "${SERVER_METRICS_URLS[@]}" \
      --server-metrics-formats json csv parquet jsonl \
      --scenario inferencex-agentx-mvp \
      -m Qwen3.5-397B-A17B-NVFP4-V2 --tokenizer /model \
      --tokenizer-trust-remote-code \
      --url http://$SRT_FRONTEND_HOST:$SRT_FRONTEND_PORT \
      --endpoint /v1/chat/completions \
      --endpoint-type chat \
      --streaming \
      --public-dataset semianalysis_cc_traces_weka_062126_256k \
      --max-context-length 1048576 \
      --trajectory-start-min-ratio 0.25 \
      --trajectory-start-max-ratio 0.75 \
      --failed-request-threshold 0.10 \
      --use-server-token-count \
      --no-gpu-telemetry \
      --random-seed 42 \
      --benchmark-duration 3600 \
      --concurrency 8 \
      --artifact-dir /logs/agentic/concurrency_8 \
      --warmup-requests-per-lane 10 \
      --warmup-grace-period 1800 \
      --num-dataset-entries 393 \
      --slice-duration 1.0 \
      --stats-interval 30 \
      --trace-idle-gap-cap-seconds 300
  placement:
    node: last_decode
setup_script: install_dynamo_wheel.sh
extra_mount:
- /lustre/:/lustre/
- /lustre/fsw/coreai_comparch_inferencex/rihuo/dynamo_wheels:/dynamo_wheels
dynamo:
  install: false
observability:
  enable_otel: false
