    MIMALLOC_ARENA_RESERVE: '0'
    MIMALLOC_PURGE_DELAY: ''
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    TLLM_LOG_LEVEL: INFO
    TLLM_PROFILE_LOG_RANKS: all
    TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '3.80'
    TRTLLM_ENABLE_PDL: '1'
    TRTLLM_KV_TRANSFER_NUM_THREADS: '8'
    TRTLLM_PINNED_WEIGHT_STAGING: '1'
    TRTLLM_SERVER_DISABLE_GC: '1'
    TRTLLM_WORKER_DISABLE_GC: '1'
    UCX_TLS: rc,cuda_ipc,cuda_copy,sm,self,tcp
  trtllm_config:
    prefill:
      attention_dp_config:
        kv_cache_routing_conversation_affinity: true
      cache_transceiver_config:
        backend: NIXL
        kv_transfer_sender_future_timeout_ms: 20
        kv_transfer_timeout_ms: 600000
        transceiver_runtime: PYTHON
      cuda_graph_config: null
      disable_overlap_scheduler: false
      enable_attention_dp: false
      enable_chunked_prefill: true
      enable_iter_perf_stats: true
      enable_iter_req_stats: false
      iter_perf_stats_interval: 40
      kv_cache_config:
        block_reuse_config:
          max_num_turns: 3
          policy: per_conversation
        dtype: fp8
        enable_block_reuse: true
        event_buffer_max_size: 0
        free_gpu_memory_fraction: 0.8
        host_cache_size: 137438953472
        iteration_stats_interval: 40
        mamba_state_config:
          additional_snapshot_offsets_from_end:
          - 2
          periodic_snapshot_interval: 0
        pool_ratio:
        - 0.8
        - 0.2
        tokens_per_block: 64
        use_kv_cache_manager_v2: true
      max_batch_size: 64
      max_num_tokens: 32768
      max_seq_len: 262144
      moe_config:
        backend: CUTEDSL
      moe_expert_parallel_size: 4
      num_serve_frontends: 8
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      perf_metrics_max_requests: 100000
      perf_metrics_output_dir: /logs/perf_metrics/ctx
      pipeline_parallel_size: 1
      print_iter_log: true
      return_perf_metrics: true
      scheduler_config:
        capacity_scheduler_policy: MAX_UTILIZATION
      tensor_parallel_size: 4
      torch_compile_config:
        capture_num_tokens:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 32
        - 64
        - 128
        - 256
        - 512
        - 1024
        - 2048
        - 4096
        - 8192
        - 16384
        - 32768
        enable_fullgraph: true
        enable_piecewise_cuda_graph: true
      trust_remote_code: true
    decode:
      cache_transceiver_config:
        backend: NIXL
        kv_transfer_sender_future_timeout_ms: 20
        kv_transfer_timeout_ms: 600000
        transceiver_runtime: PYTHON
      cuda_graph_config:
        batch_sizes:
        - 1
        - 2
        - 4
        enable_padding: true
      enable_attention_dp: false
      enable_iter_perf_stats: true
      enable_iter_req_stats: false
      enable_lm_head_tp_in_adp: false
      iter_perf_stats_interval: 40
      kv_cache_config:
        avg_seq_len: 102150
        dtype: fp8
        enable_block_reuse: false
        event_buffer_max_size: 0
        free_gpu_memory_fraction: 0.85
        host_cache_size: 137438953472
        iteration_stats_interval: 40
        tokens_per_block: 64
        use_kv_cache_manager_v2: true
      max_batch_size: 2
      max_num_tokens: 14
      max_seq_len: 262148
      moe_config:
        backend: CUTEDSL
        use_low_precision_moe_combine: true
      moe_expert_parallel_size: 8
      num_postprocess_workers: 4
      num_serve_frontends: 4
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      perf_metrics_max_requests: 100000
      perf_metrics_output_dir: /logs/perf_metrics/gen
      pipeline_parallel_size: 1
      print_iter_log: true
      return_perf_metrics: true
      scheduler_config:
        capacity_scheduler_policy: GUARANTEED_NO_EVICT
      speculative_config:
        decoding_type: MTP
        max_draft_len: 6
      stream_interval: 20
      tensor_parallel_size: 8
      trust_remote_code: true
frontend:
  type: trtllm_serve
  enable_multiple_frontends: false
  ctx_router:
    type: conversation
  server_config_extra:
    gen_strip_message_history: true
    gen_tokids_ctxbytes: true
    return_perf_metrics: true
    num_workers: 4
    server_keep_alive_timeout: 3600
    perf_metrics_max_requests: 100000
    perf_metrics_output_dir: /logs/perf_metrics/orch
  orchestrator_placement: first_decode
  args:
    server_start_timeout: 7200
    request_timeout: 7200
environment:
  TRTLLM_SERVER_DISABLE_GC: '1'
benchmark:
  type: custom
  client_placement: last_decode
  env:
    AIPERF_REF: file:///lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/laliao/build/aiperf/wheel/aiperf-0.12.0-py3-none-any.whl
    HF_HUB_CACHE: /lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/lingjiew/agentX/hf_cache
    HF_HOME: /lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/lingjiew/agentX/hf_cache
  command: |
    set -euo pipefail
    # aiperf goes INTO the container image (reusing its numpy/torch/HF stack),
    # exactly as run_benchmark_agentx.sh does for the measured runs.
    pip install --force-reinstall --no-deps "aiperf @ $AIPERF_REF"
    pip install cyclopts "ruamel.yaml" msgspec orjson kaleido dash dash-bootstrap-components \
        textual starlette-compress setproctitle jmespath aiofiles ffmpeg-python \
        pydantic-settings prometheus_client fastapi soundfile plotly seaborn tiktoken \
        tqdm "uvicorn[standard]" uvloop crick zstandard
    pip install "datasets==5.0.0" "huggingface-hub==1.14.0"
    # LAST, and load-bearing: the image ships pydantic 2.13.0, whose
    # ValidationInfo.data=None bug fails ~20% of conversation decodes.
    pip install --force-reinstall "pydantic==2.13.4"
    export HF_HUB_TRUST_REMOTE_CODE=1
    python - <<'CLIENT_PROOF'
    import importlib.metadata as m, hashlib
    from transformers import AutoTokenizer
    for p,v in [('datasets','5.0.0'),('huggingface-hub','1.14.0')]:
        actual=m.version(p); print('[client version]',p,actual,flush=True); assert actual==v
    t=AutoTokenizer.from_pretrained('/model',trust_remote_code=True,local_files_only=True)
    h=hashlib.sha256(t.chat_template.encode()).hexdigest()
    assert h=='a4aee8afcf2e0711942cf848899be66016f8d14a889ff9ede07bca099c28f715'
    print('[default template SHA256]',h,flush=True)
    CLIENT_PROOF
    # Both exports were live in the measured runs (unconditional in
    # run_benchmark_agentx.sh): the X-Session-ID mirror of X-Correlation-ID
    # (trtllm-serve accepts either as the conversation id), and the dataset
    # mmap-decode cache (dir rewritten to the log mount; client startup only).
    export AIPERF_HTTP_X_SESSION_ID_FROM_CORRELATION_ID=true
    export AIPERF_DATASET_MMAP_CACHE_DIR=/logs/agentic/mmap_cache
    mkdir -p /logs/agentic/concurrency_32 /logs/agentic/mmap_cache
    python -m tensorrt_llm.serve.scripts.benchmark_serving --model /model --dataset-name random --random-ids --random-input-len 100 --random-output-len 10 --num-prompts 4 --host "$SRT_FRONTEND_HOST" --port "$SRT_FRONTEND_PORT" --ignore-eos --trust-remote-code --non-streaming || true
    aiperf profile \
      --scenario inferencex-agentx-mvp \
      -m /model \
      --tokenizer-trust-remote-code \
      --url http://$SRT_FRONTEND_HOST:$SRT_FRONTEND_PORT \
      --endpoint /v1/chat/completions \
      --endpoint-type chat \
      --streaming \
      --public-dataset semianalysis_cc_traces_weka_062126_256k \
      --trajectory-start-min-ratio 0.25 \
      --trajectory-start-max-ratio 0.75 \
      --failed-request-threshold 0.10 \
      --use-server-token-count \
      --no-gpu-telemetry \
      --random-seed 42 \
      --benchmark-duration 3600 \
      --concurrency 32 \
      --artifact-dir /logs/agentic/concurrency_32 \
      --warmup-requests-per-lane 10 \
      --warmup-grace-period 1800 \
      --num-dataset-entries 393 \
      --slice-duration 1.0 \
      --stats-interval 30 \
      --trace-idle-gap-cap-seconds 300
container_mounts:
  /lustre: /lustre
  /raid/scratch: /raid/scratch
sbatch_directives:
  qos: normal
observability:
  enabled: false
  enable_otel: false
  tachometer:
    enabled: false
    default_exporters: false
