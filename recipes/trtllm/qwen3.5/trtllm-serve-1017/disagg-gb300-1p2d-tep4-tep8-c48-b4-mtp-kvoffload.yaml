benchmark:
  type: custom
  placement:
    node: last_decode
  env:
    HF_HOME: /scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/rihuo/hf_cache
    HF_HUB_CACHE: /scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/rihuo/hf_cache
    AIPERF_DATASET_MMAP_CACHE_DIR: /scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/rihuo/aiperf_mmap_cache/agentx-harness-1.0.11
    AIPERF_HTTP_X_SESSION_ID_FROM_CORRELATION_ID: 'true'
    AGENTX_HARNESS_SPEC: agentx-harness==1.0.11
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: trtllm_kv_cache_utilization
    CONC: '48'
    SERVED_MODEL_NAME: Qwen3.5-397B-A17B-NVFP4-V2
    AIPERF_UI_REALTIME_METRICS_ENABLED: 'true'
  command: |
    set -euo pipefail
    : "${AIPERF_SERVER_METRICS_URLS:?Worker metrics URLs must be provided by srtctl}"
    OUT=/logs/agentic/concurrency_${CONC}
    mkdir -p "$OUT" "$AIPERF_DATASET_MMAP_CACHE_DIR"
    # Isolated client runtime, as InferenceX infx/bench/agentic/venv.py builds it (uv venv, py3.11, pinned PyPI release).
    RT=/tmp/agentx-rt-${SLURM_JOB_ID:-$$}
    python3 -m pip install --quiet uv
    python3 -m uv venv --python 3.11 "$RT/venv" || python3 -m uv venv --python python3 "$RT/venv"
    python3 -m uv pip install --quiet --python "$RT/venv/bin/python" --no-config "$AGENTX_HARNESS_SPEC" "datasets>=4.7.0"
    "$RT/venv/bin/python" -m pip --version >/dev/null 2>&1 || true
    "$RT/venv/bin/agentx" --version | tee "$OUT/agentx_version.txt"
    "$RT/venv/bin/hf" download --repo-type dataset semianalysisai/cc-traces-weka-062126-256k > "$OUT/hf_download.log" 2>&1
    # Worker Prometheus endpoints injected by srtctl (return_perf_metrics: true on both roles).
    echo "${AIPERF_SERVER_METRICS_URLS:-<unset>}" | tr ',' '\n' | tee "$OUT/server_metrics_urls.txt"
    for u in $(echo "${AIPERF_SERVER_METRICS_URLS:-}" | tr ',' ' '); do
      n=$(curl -sf "$u" | grep -c '^trtllm_kv_cache_utilization' || true)
      echo "$u trtllm_kv_cache_utilization_lines=$n"
    done | tee "$OUT/metrics_probe.txt"
    ARGV=("$RT/venv/bin/agentx" profile --url "http://$SRT_FRONTEND_HOST:$SRT_FRONTEND_PORT"
          --model "$SERVED_MODEL_NAME" --tokenizer /model --concurrency "$CONC" --benchmark-duration 3600
          --tokenizer-trust-remote-code)
    if [ -n "${AIPERF_SERVER_METRICS_URLS:-}" ]; then
      ARGV+=(--server-metrics $(echo "$AIPERF_SERVER_METRICS_URLS" | tr ',' ' ') --server-metrics-formats json csv parquet jsonl)
    fi
    ARGV+=(--output-artifact-dir "$OUT/aiperf_artifacts" --public-dataset semianalysis_cc_traces_weka_062126_256k)
    printf '%q ' "${ARGV[@]}" > "$OUT/benchmark_command.txt"; echo >> "$OUT/benchmark_command.txt"
    set +e
    "${ARGV[@]}" 2>&1 | tee "$OUT/benchmark.log"
    rc=${PIPESTATUS[0]}
    set -e
    # InferenceX gate (AIPERF_REQUIRED_SERVER_METRIC_PREFIX=trtllm_kv_cache_utilization): metric present in the export.
    if grep -q "\"$AIPERF_REQUIRED_SERVER_METRIC_PREFIX" "$OUT/aiperf_artifacts/server_metrics_export.json" 2>/dev/null; then
      echo "server metrics: trtllm_kv_cache_utilization PRESENT" | tee "$OUT/server_metrics_check.txt"
    else
      echo "server metrics: trtllm_kv_cache_utilization MISSING" | tee "$OUT/server_metrics_check.txt"
    fi
    exit $rc
