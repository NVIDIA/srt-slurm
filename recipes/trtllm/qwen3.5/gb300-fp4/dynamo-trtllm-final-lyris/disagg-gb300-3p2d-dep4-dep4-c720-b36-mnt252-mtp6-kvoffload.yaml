extra_mount:
- /lustre:/lustre
- /lustre/fsw/coreai_comparch_inferencex/rihuo/dynamo_wheels:/dynamo_wheels
health_check:
  max_attempts: 540
  interval_seconds: 10
resources:
  gpu_type: gb300
  gpus_per_node: 4
  het_jobs: false
engine:
  type: trtllm
  served_model_name: Qwen3.5-397B-A17B-NVFP4-V2
  publish_metrics: true
  numa_cpu_bind: true
  numa_memory_bind: preferred
roles:
  prefill:
    nodes: 3
    workers: 3
    gpus: 4
    env:
      TLLM_LOG_LEVEL: INFO
      TRTLLM_SERVER_DISABLE_GC: '1'
      TRTLLM_WORKER_DISABLE_GC: '1'
      NCCL_GRAPH_MIXING_SUPPORT: '0'
      MIMALLOC_ARENA_RESERVE: '0'
      OMP_NUM_THREADS: '1'
      TLLM_NUMA_AWARE_WORKER_AFFINITY: '1'
      MPI_UCX_TLS: rc,ud,sm,self
      MPI_UCX_NET_DEVICES: mlx5_0:1,mlx5_2:1
      OMPI_MCA_coll: ^ucc,hcoll
      UCX_CUDA_IPC_MAX_POLL: inf
      UCX_CUDA_COPY_MAX_POLL: inf
      UCX_TLS: rc,cuda_ipc,cuda_copy,sm,self,tcp
      TRTLLM_Q35_MTP_MOE_QUANT_MAX_M: '0'
      TRTLLM_ENABLE_PDL: '1'
      TRTLLM_KV_TRANSFER_NUM_THREADS: '8'
      TRTLLM_Q35_PROFILE: ctx
      TRTLLM_CTX_SCHED_SRPT: '1'
      TRTLLM_CTX_SCHED_SRPT_AGE_S: '8'
      TRTLLM_CTX_SCHED_SRPT_AGE_CAP: '2048'
      TRTLLM_MAMBA_INFORWARD_SNAPSHOT: '1'
      CUDA_SCALE_LAUNCH_QUEUES: 4x
      TRTLLM_SKIP_KV_CACHE_ESTIMATION: '1'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TRTLLM_PINNED_WEIGHT_STAGING: '1'
      MIMALLOC_PURGE_DELAY: ''
      TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '3.80'
      DYN_ENGINE_CONV_AFFINITY: '1'
    args:
      attention_dp_config:
        kv_cache_routing_conversation_affinity: true
      cache_transceiver_config:
        backend: NIXL
        kv_transfer_sender_future_timeout_ms: 20
        kv_transfer_timeout_ms: 600000
        transceiver_runtime: PYTHON
      cuda_graph_config: null
      disable_mm_encoder: true
      disable_overlap_scheduler: false
      enable_attention_dp: true
      enable_chunked_prefill: true
      enable_iter_perf_stats: true
      enable_iter_req_stats: false
      iter_perf_stats_interval: 40
      kv_cache_config:
        block_reuse_config:
          max_num_turns: 3
          policy: per_conversation
        dtype: fp8
        enable_block_reuse: true
        event_buffer_max_size: 0
        free_gpu_memory_fraction: 0.8
        host_cache_size: 137438953472
        iteration_stats_interval: 40
        mamba_state_config:
          additional_snapshot_offsets_from_end:
          - 2
          periodic_snapshot_interval: 0
        pool_ratio:
        - 0.2
        - 0.8
        tokens_per_block: 64
        use_kv_cache_manager_v2: true
      max_batch_size: 64
      max_num_tokens: 8192
      max_seq_len: 262144
      moe_config:
        backend: CUTEDSL
      moe_expert_parallel_size: 4
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      pipeline_parallel_size: 1
      print_iter_log: true
      return_perf_metrics: false
      scheduler_config:
        capacity_scheduler_policy: MAX_UTILIZATION
      tensor_parallel_size: 4
      torch_compile_config:
        capture_num_tokens:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 32
        - 64
        - 128
        - 256
        - 512
        - 1024
        - 2048
        - 4096
        - 8192
        enable_fullgraph: true
        enable_piecewise_cuda_graph: true
      trust_remote_code: true
  decode:
    nodes: 2
    workers: 2
    gpus: 4
    env:
      TLLM_LOG_LEVEL: INFO
      TRTLLM_SERVER_DISABLE_GC: '1'
      TRTLLM_WORKER_DISABLE_GC: '1'
      NCCL_GRAPH_MIXING_SUPPORT: '0'
      MIMALLOC_ARENA_RESERVE: '0'
      OMP_NUM_THREADS: '1'
      TLLM_NUMA_AWARE_WORKER_AFFINITY: '1'
      MPI_UCX_TLS: rc,ud,sm,self
      MPI_UCX_NET_DEVICES: mlx5_0:1,mlx5_2:1
      OMPI_MCA_coll: ^ucc,hcoll
      UCX_CUDA_IPC_MAX_POLL: inf
      UCX_CUDA_COPY_MAX_POLL: inf
      UCX_TLS: rc,cuda_ipc,cuda_copy,sm,self,tcp
      TRTLLM_Q35_MTP_MOE_QUANT_MAX_M: '0'
      TRTLLM_ENABLE_PDL: '1'
      TRTLLM_KV_TRANSFER_NUM_THREADS: '8'
      TRTLLM_Q35_PROFILE: gen
      TRTLLM_SPEC_SAMPLER_FUSED_STORE: '1'
      TRTLLM_OVERLAP_LOOP_ON_EXECUTION_STREAM: '1'
      TRTLLM_DISAGG_GEN_IDLE_POLL_SKIP: '1'
      TRTLLM_DISAGG_GEN_EMIT_FIRST_STEP: '1'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TRTLLM_PINNED_WEIGHT_STAGING: '1'
      MIMALLOC_PURGE_DELAY: ''
      TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '3.80'
      DYN_ENGINE_CONV_AFFINITY: '1'
    args:
      cache_transceiver_config:
        backend: NIXL
        kv_transfer_sender_future_timeout_ms: 20
        kv_transfer_timeout_ms: 600000
        transceiver_runtime: PYTHON
      cuda_graph_config:
        batch_sizes:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 24
        - 32
        - 36
        enable_padding: true
      disable_mm_encoder: true
      enable_attention_dp: true
      enable_iter_perf_stats: true
      enable_iter_req_stats: false
      enable_lm_head_tp_in_adp: true
      iter_perf_stats_interval: 40
      kv_cache_config:
        avg_seq_len: 102150
        dtype: fp8
        enable_block_reuse: false
        event_buffer_max_size: 0
        free_gpu_memory_fraction: 0.85
        host_cache_size: 137438953472
        iteration_stats_interval: 40
        tokens_per_block: 64
        use_kv_cache_manager_v2: true
      max_batch_size: 36
      max_num_tokens: 252
      max_seq_len: 262148
      moe_config:
        backend: CUTEDSL
        use_low_precision_moe_combine: true
      moe_expert_parallel_size: 4
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      pipeline_parallel_size: 1
      print_iter_log: true
      return_perf_metrics: false
      scheduler_config:
        capacity_scheduler_policy: GUARANTEED_NO_EVICT
      speculative_config:
        decoding_type: MTP
        max_draft_len: 6
      stream_interval: 20
      tensor_parallel_size: 4
      trust_remote_code: true
frontend:
  type: dynamo
  enable_multiple_frontends: false
  env:
    ETCD_LEASE_TTL: '120'
    DYN_TOKENIZER_CACHE: '1'
    DYN_TOKENIZER_CACHE_BYTES: '8000000000'
    DYN_TOKENIZER: fastokens
    DYN_TOKEN_IDS_AS_BYTES: '1'
  args:
    router-mode: kv
    router-session-affinity-ttl-secs: '14400'
  placement:
    node: first_decode
benchmark:
  type: custom
  placement:
    node: last_decode
  env:
    AIPERF_UI_REALTIME_METRICS_ENABLED: 'true'
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
    AIPERF_REF: /lustre/fsw/coreai_comparch_inferencex/rihuo/agentx-harness
    AIPERF_DATASET_CONFIGURATION_TIMEOUT: '1800'
    AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT: '1800'
    AIPERF_DATASET_MMAP_CACHE_DIR: /lustre/fsw/coreai_comparch_inferencex/rihuo/aiperf_mmap_cache
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: trtllm_kv_cache_utilization
    HF_HUB_CACHE: /lustre/fsw/coreai_comparch_inferencex/rihuo/hf_cache
    HF_HOME: /lustre/fsw/coreai_comparch_inferencex/rihuo/hf_cache
  command: |
    set -euo pipefail
    # Install the Dynamo-aware AIPerf client and preserve the conversation decoding fix.
    python3 -m pip install --upgrade "$AIPERF_REF" "datasets==5.0.0" "huggingface-hub==1.14.0" "pydantic==2.13.4"
    export HF_HUB_TRUST_REMOTE_CODE=1
    mkdir -p /logs/agentic/concurrency_720
    : "${AIPERF_SERVER_METRICS_URLS:?Worker metrics URLs must be provided by srtctl}"
    IFS=',' read -r -a SERVER_METRICS_URLS <<< "$AIPERF_SERVER_METRICS_URLS"
    aiperf profile \
      --server-metrics "${SERVER_METRICS_URLS[@]}" \
      --server-metrics-formats json csv parquet jsonl \
      --scenario inferencex-agentx-mvp \
      -m Qwen3.5-397B-A17B-NVFP4-V2 --tokenizer /model \
      --tokenizer-trust-remote-code \
      --url http://$SRT_FRONTEND_HOST:$SRT_FRONTEND_PORT \
      --endpoint /v1/chat/completions \
      --endpoint-type chat \
      --streaming \
      --public-dataset semianalysis_cc_traces_weka_062126_256k \
      --max-context-length 1048576 \
      --trajectory-start-min-ratio 0.25 \
      --trajectory-start-max-ratio 0.75 \
      --failed-request-threshold 0.10 \
      --use-server-token-count \
      --no-gpu-telemetry \
      --random-seed 42 \
      --benchmark-duration 3600 \
      --concurrency 720 \
      --artifact-dir /logs/agentic/concurrency_720 \
      --warmup-requests-per-lane 10 \
      --warmup-grace-period 1800 \
      --num-dataset-entries 393 \
      --slice-duration 1.0 \
      --stats-interval 30 \
      --trace-idle-gap-cap-seconds 300
setup_script: install_dynamo_wheel.sh
dynamo:
  install: false
observability:
  enable_otel: false
services:
- name: otel-collector
  type: otel-collector
  enabled: false
