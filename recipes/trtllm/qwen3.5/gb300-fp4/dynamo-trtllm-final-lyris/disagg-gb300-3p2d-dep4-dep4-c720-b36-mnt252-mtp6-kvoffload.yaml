# Dynamo counterpart of ../trtllm-serve-final-lyris/disagg-gb300-3p2d-dep4-dep4-c720-b36-mnt252-mtp6-kvoffload.yaml
# Same image, topology, NUMA binding, engine args and worker env; dynamo.trtllm workers and the Dynamo
# frontend installed from the mounted /dynamo_wheels (configs/install_dynamo_wheel.sh).
# Dropped trtllm-serve-only settings: frontend process pools, per-conversation frontend affinity,
# incremental tokenization, the ctx/gen routers, server_config_extra and engine perf-metrics output.
# Frontend uses the Dynamo KV router with 14400 s session affinity.
# Not yet measured under Dynamo.
schema: 2
name: disagg-gb300-3p2d-dep4-dep4-c720-b36-mnt252-mtp6-kvoffload-dynamo
model:
  path: /lustre/fsw/coreai_comparch_inferencex/rihuo/Qwen3.5-397B-A17B-NVFP4-V2
  container: /lustre/fsw/coreai_comparch_inferencex/rihuo/nvidia+tensorrt-llm+release+1.4.0rc2.dev202610210802+pr20815r3-481e06cca.sqsh
  precision: nvfp4
identity:
  model:
    repo: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
  container:
    image: /scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/xiaomingc/qwen35_e2e/images/nvidia+tensorrt-llm+release+1.4.0rc2.dev202610210802+pr20815r3-ac94c99cc.sqsh
  frameworks:
    tensorrt_llm: 1.4.0rc2.dev202610210802
    dynamo: 1.7.0.dev20261027
