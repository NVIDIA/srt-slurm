    serve_frontend_affinity_port_stride: 10
  placement:
    node: first_decode
  args:
    server_start_timeout: 7200
    request_timeout: 7200
benchmark:
  type: custom
  placement:
    node: last_decode
  env:
    AIPERF_REF: git+https://github.com/SemiAnalysisAI/agentx-harness.git@754356e9a39acc6cc6afb242d123bb57c3fb6f75
    AIPERF_DATASET_CONFIGURATION_TIMEOUT: '1800'
    AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT: '1800'
    AIPERF_DATASET_MMAP_CACHE_DIR: /scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/xiaomingc/qwen35_e2e/hf_cache/aiperf_mmap
  command: |
    set -euo pipefail
    AIPERF_VENV="${TMPDIR:-/tmp}/agentx-aiperf-${SLURM_JOB_ID:-$$}"
    if [ ! -x "$AIPERF_VENV/bin/aiperf" ]; then
      python3 -m venv "$AIPERF_VENV"
      "$AIPERF_VENV/bin/pip" install -q --upgrade pip
      "$AIPERF_VENV/bin/pip" install -q "aiperf @ $AIPERF_REF" "datasets>=4.7.0" "huggingface_hub[cli]>=0.25.0"
    fi
    mkdir -p /logs/agentic/concurrency_96
    "$AIPERF_VENV/bin/aiperf" profile --scenario inferencex-agentx-mvp \
      --url http://$SRT_FRONTEND_HOST:$SRT_FRONTEND_PORT --endpoint /v1/chat/completions --endpoint-type chat --streaming \
      -m /model --tokenizer-trust-remote-code \
      --public-dataset semianalysis_cc_traces_weka_062126_256k \
      --max-context-length 1048576 \
      --trajectory-start-min-ratio 0.25 --trajectory-start-max-ratio 0.75 \
      --trace-idle-gap-cap-seconds 300 --warmup-requests-per-lane 10 \
      --num-dataset-entries 393 --slice-duration 1.0 --stats-interval 30 \
      --use-server-token-count --no-gpu-telemetry --random-seed 42 \
      --failed-request-threshold 0.10 \
      --benchmark-duration 3600 --concurrency 96 \
      --output-artifact-dir /logs/agentic/concurrency_96 --ui simple --warmup-grace-period 1800
