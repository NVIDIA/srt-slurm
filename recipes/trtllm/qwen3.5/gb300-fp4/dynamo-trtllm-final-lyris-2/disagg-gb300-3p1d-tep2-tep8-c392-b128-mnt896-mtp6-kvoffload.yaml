# Dynamo counterpart of ../trtllm-serve-final-jhb-2/disagg-gb300-3p1d-tep2-tep8-c392-b128-mnt896-mtp6-kvoffload.yaml
# Same image, topology, NUMA binding, engine args and worker env; dynamo.trtllm workers and the Dynamo
