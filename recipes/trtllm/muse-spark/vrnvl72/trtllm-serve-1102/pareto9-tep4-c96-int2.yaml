# Muse Spark Open NVFP4, Vera Rubin (VR), AgentX 1M corpus, full protocol (3600 s): tep4-c96-int2.
# mso-vrmerge delivery recipe (xiaow/trtllm-study 1b81cf82, notes/pinedrift/2026-10-30-mso-merge-vr-configs/
# configs/vr/vr-tep4-c96-int2.yaml), measured on Hecate batch-xdr: x p10 105.5 tok/s/user, y 136,568 tok/s/GPU,
# TTFT p90 3.27 s (jobs 918060 / 918062 / 918850 / 918851).
# container = the image built from xiaow/tekit mso-vrmerge/staircase-clean @ 32862f7e42 (sm103, sm107);
# no code-overlay mounts. Engine args, env opt-ins and the benchmark block are the delivered recipe's.
# Converted from BTK e2e_pareto/pareto9.yaml with hecate's substitutions resolved. The checkpoint is the
# cluster's MODEL_MUSESPARK_OPEN_NVFP4 substitution (same weights); the chat template is pinned to
# the measured vv6 copy, since the checkpoint's own template renders tools differently.
# Set TZ at submit time so the run stays within one calendar date (the chat template carries the date).
