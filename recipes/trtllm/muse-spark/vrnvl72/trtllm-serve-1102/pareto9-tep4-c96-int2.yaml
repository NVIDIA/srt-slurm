benchmark:
  type: custom
  env:
    MODEL_NAME: /model
    TOKENIZER: /model
    OUTPUT_ARTIFACT_DIR: /logs/agentic/conc_96_aggtp4/aiperf_artifacts
    PUBLIC_DATASET: semianalysis_cc_traces_weka_062126
    CONCURRENCY: '96'
    MAX_CONTEXT_LENGTH: '1048576'
    BENCHMARK_DURATION: '3600'
    RANDOM_SEED: '42'
    AIPERF_FAILED_REQUEST_THRESHOLD: '0.10'
    AIPERF_WARMUP_GRACE_PERIOD: '1800'
    AIPERF_HTTP_TCP_USER_TIMEOUT: '1000000'
  command: |
    set -euo pipefail
    mkdir -p /scratch/tmp
    AIPERF_RUNTIME_DIR="${TMPDIR:-/tmp}/inferencex-agentic-${SLURM_JOB_ID:-$$}"
    python3 -m venv "$AIPERF_RUNTIME_DIR/venv"
    "$AIPERF_RUNTIME_DIR/venv/bin/pip" install --no-cache-dir --quiet --upgrade pip
    "$AIPERF_RUNTIME_DIR/venv/bin/pip" install --no-cache-dir --constraint /lustre/fsw/coreai_comparch_trtllm/xiaow/musesparkopen-pareto-20261015/source/jhb-inputs/client-constraints-baseline.txt /opt/aiperf
    AIPERF="$AIPERF_RUNTIME_DIR/venv/bin/aiperf"
    "$AIPERF_RUNTIME_DIR/venv/bin/python" -c 'import aiperf; print("aiperf", aiperf.__version__)'
    SERVER_URL="${SERVER_URL:-http://${SRT_FRONTEND_HOST:-localhost}:${SRT_FRONTEND_PORT:-8000}}"
    # Server metrics from every worker srtctl lists (none without an engine metrics endpoint).
    SERVER_METRICS_ARGS=()
    if [ -n "${AIPERF_SERVER_METRICS_URLS:-}" ]; then
      IFS=',' read -r -a SERVER_METRICS_URLS <<< "$AIPERF_SERVER_METRICS_URLS"
      SERVER_METRICS_ARGS=(--server-metrics "${SERVER_METRICS_URLS[@]}")
    fi
    mkdir -p "$OUTPUT_ARTIFACT_DIR"
    "$AIPERF" profile \
      --scenario agentx \
      --url "$SERVER_URL" \
      --endpoint /v1/chat/completions \
      --endpoint-type chat \
      --streaming \
      --model "$MODEL_NAME" \
      --tokenizer "$TOKENIZER" \
      --concurrency "$CONCURRENCY" \
      --benchmark-duration "$BENCHMARK_DURATION" \
      --max-context-length "$MAX_CONTEXT_LENGTH" \
      --stats-interval 30 \
      --random-seed "$RANDOM_SEED" \
      --failed-request-threshold "$AIPERF_FAILED_REQUEST_THRESHOLD" \
      --warmup-requests-per-lane 10 \
      --benchmark-grace-period 30 \
      --trace-idle-gap-cap-seconds 300 \
      --trajectory-start-min-ratio 0.25 \
      --trajectory-start-max-ratio 0.75 \
      --warmup-grace-period "$AIPERF_WARMUP_GRACE_PERIOD" \
      --use-server-token-count \
      --no-gpu-telemetry \
      --tokenizer-trust-remote-code \
      --num-dataset-entries 393 \
      --slice-duration 1.0 \
      "${SERVER_METRICS_ARGS[@]}" \
      --output-artifact-dir "$OUTPUT_ARTIFACT_DIR" \
      --public-dataset "$PUBLIC_DATASET"
  placement:
    node: head
identity:
  container:
    image: 'mso-vrmerge delivery image: GitHub NVIDIA/TensorRT-LLM feat/musespark-open-agentx c55183f445 + the merged VR HC
      / midc / LL levers (lever resolver), commit 32862f7e42, built from the branch''s own wheel (sm103+sm107 aarch64, TRT-LLM
      1.4.0a0); no code overlay'
  frameworks:
    tensorrt_llm: 1.4.0a0
# Hecate VR200 performance runs need the HBM clock locked at 4752 MHz: lock it on every node before any
# worker starts and reset it when the job ends (teardown also runs on failure). A failed lock fails the job.
host_setup:
  commands:
  - sudo -n nvidia-smi -lmc 4752,4752
  teardown:
  - sudo -n nvidia-smi -rmc
