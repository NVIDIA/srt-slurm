benchmark:
  type: custom
  env:
    AGENTX_CLIENT: agentx-harness==1.0.12
    HF_HOME: /lustre/fsw/coreai_comparch_aarwlt/itabrizian/hf_cache
    AIPERF_DATASET_MMAP_CACHE_DIR: /lustre/fsw/coreai_comparch_aarwlt/itabrizian/hf_cache/aiperf_mmap_cache
    AGENTX_CLIENT_CACHE_DIR: /lustre/fsw/coreai_comparch_aarwlt/itabrizian/hf_cache/agentx_client_cache
    AIPERF_HTTP_X_SESSION_ID_FROM_CORRELATION_ID: 'true'
    HF_HUB_TRUST_REMOTE_CODE: '1'
    AIPERF_DATASET_CONFIGURATION_TIMEOUT: '1800'
    AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT: '1800'
  command: |
    set -euo pipefail
    AGENTX_RUNTIME="$(mktemp -d "${TMPDIR:-/tmp}/agentx-client.XXXXXX")"
    CACHE="${AGENTX_CLIENT_CACHE_DIR:-$AGENTX_RUNTIME/cache}"
    if ! { mkdir -p "$CACHE" && [ -w "$CACHE" ]; } 2>/dev/null; then
      echo "AgentX client cache $CACHE is not writable; using a per-job cache"
      CACHE="$AGENTX_RUNTIME/cache"
    fi
    echo "AgentX client cache: $CACHE"
    export UV_LINK_MODE=copy UV_PYTHON_INSTALL_DIR="$AGENTX_RUNTIME/python" UV_HTTP_TIMEOUT=120 UV_HTTP_RETRIES=3 UV_LOCK_TIMEOUT=1800
    UV="$(command -v uv || true)"
    if [ -z "$UV" ]; then
      PIP_CACHE_DIR="$CACHE/pip" python3 -m pip install -q --target "$AGENTX_RUNTIME/uv" uv
      UV="$AGENTX_RUNTIME/uv/bin/uv"
    fi
    agentx_install() {
      env -u PYTHONPATH UV_CACHE_DIR="$1/uv" UV_PYTHON_CACHE_DIR="$1/python" "$UV" venv -q --no-config --python 3.11 "$2" &&
      env -u PYTHONPATH UV_CACHE_DIR="$1/uv" UV_PYTHON_CACHE_DIR="$1/python" "$UV" pip install --no-config --exclude-newer 2026-10-27T04:39:14Z --python "$2/bin/python" "$AGENTX_CLIENT" "datasets>=4.7.0"
    }
    AGENTX_VENV="$AGENTX_RUNTIME/venv"
    if ! agentx_install "$CACHE" "$AGENTX_VENV"; then
      echo "AgentX client install with the cache $CACHE failed; retrying with a per-job cache"
      AGENTX_VENV="$AGENTX_RUNTIME/venv-retry"
      agentx_install "$AGENTX_RUNTIME/cache" "$AGENTX_VENV"
    fi
    # The runner's UCX warmup: small requests prime the CTX->GEN KV path before the measured client.
    python -m tensorrt_llm.serve.scripts.benchmark_serving --model /model --dataset-name random --random-ids \
      --random-input-len 100 --random-output-len 10 --num-prompts 10 \
      --host "$SRT_FRONTEND_HOST" --port "$SRT_FRONTEND_PORT" --ignore-eos --trust-remote-code --non-streaming || true
    mkdir -p /logs/agentic/concurrency_100
    # Server metrics from every worker srtctl lists (none without an engine metrics endpoint).
    SERVER_METRICS_ARGS=()
    if [ -n "${AIPERF_SERVER_METRICS_URLS:-}" ]; then
      IFS=',' read -r -a SERVER_METRICS_URLS <<< "$AIPERF_SERVER_METRICS_URLS"
      SERVER_METRICS_ARGS=(--server-metrics "${SERVER_METRICS_URLS[@]}")
    fi
    env -u PYTHONPATH PYTHONNOUSERSITE=1 "$AGENTX_VENV/bin/aiperf" profile --scenario agentx \
      --url http://$SRT_FRONTEND_HOST:$SRT_FRONTEND_PORT --endpoint /v1/chat/completions \
      -m /model --tokenizer-trust-remote-code \
      --public-dataset semianalysis_cc_traces_weka_062126 --concurrency 100 \
      --output-artifact-dir /logs/agentic/concurrency_100 --ui simple \
      --benchmark-duration 3600 --warmup-requests-per-lane 10 --max-context-length 996579 "${SERVER_METRICS_ARGS[@]}"
  placement:
    node: last_decode
