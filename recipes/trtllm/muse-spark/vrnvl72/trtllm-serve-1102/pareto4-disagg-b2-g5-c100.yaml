      FLASHINFER_CACHE_DIR: /lustre/fsw/coreai_comparch_aarwlt/itabrizian/hf_cache/musespark-open/mso-vrmerge/verarubin/disagg-b2-g5-c100/flashinfer
      FLASHINFER_WORKSPACE_BASE: /lustre/fsw/coreai_comparch_aarwlt/itabrizian/hf_cache/musespark-open/mso-vrmerge/verarubin/disagg-b2-g5-c100/flashinfer
