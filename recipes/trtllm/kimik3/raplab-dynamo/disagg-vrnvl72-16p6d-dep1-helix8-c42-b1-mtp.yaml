# Dynamo variant of the matching ../hecate recipe.
# Keep the custom TRT-LLM image and engine tuning; install Dynamo into the image.
# Dynamo owns routing and prefill/decode roles. Standalone server routing,
# HTTP frontend pools, postprocessing pools and server timeouts are omitted.
schema: 2
name: disagg-vrnvl72-16p6d-dep1-helix8-c42-b1-mtp-dynamo
model:
  path: /raid/common-models/kimi-k3-nvfp4
  container: /home/_shared/trtllm-kimi-k3-arm64-a4b28d25fc.sqsh
  precision: fp4
identity:
  model:
    repo: moonshotai/Kimi-K3
  container:
    image: /home/_shared/trtllm-kimi-k3-arm64-a4b28d25fc.sqsh
  frameworks:
    tensorrt_llm: 1.3.0rc25
slurm:
  time_limit: 04:00:00
health_check:
  max_attempts: 540
  interval_seconds: 10
resources:
  gpu_type: vrnvl72
  gpus_per_node: 4
extra_mount:
  - /home/rihuo/dynamo_wheels:/dynamo_wheels
  - /home/rihuo:/home/rihuo
  - /raid/common-models:/raid/common-models
setup_script: install_dynamo_wheel.sh
dynamo:
  install: false
environment:
  # The image's /etc/environment points pip at urm.nvidia.com, which RapLab cannot resolve.
  PIP_CONFIG_FILE: /dev/null
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_EXTRA_INDEX_URL: https://pypi.nvidia.com
engine:
  numa_cpu_bind: true
  numa_memory_bind: local
  type: trtllm
  served_model_name: Kimi-K3
  publish_metrics: true
roles:
  prefill:
    nodes: 4
    workers: 16
    gpus: 1
    env:
      UCX_LOG_LEVEL: info
      # The NUMA wrapper selects UCX NICs per task from its GPU NUMA node.
      SRTCTL_UCX_NET_DEVICES_NUMA_0: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_5:1,eth0
      SRTCTL_UCX_NET_DEVICES_NUMA_1: mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_11:1,eth0
      MPI_UCX_TLS: rc,ud,sm,self
      MPI_UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_5:1,mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_11:1
      MPI_UCX_RNDV_THRESH: inf
      OMPI_MCA_coll: ^ucc,hcoll
      # Advertise session-affine KV routing for the prefill worker set only.
      DYN_ROUTER_MODE: kv
      DYN_ROUTER_SESSION_AFFINITY_TTL_SECS: '14400'
      DYN_ENGINE_CONV_AFFINITY: '1'
      DYN_ENGINE_CONV_AFFINITY_DP_RANK_SOURCE: engine
      TLLM_LOG_LEVEL: INFO
      TRTLLM_SERVER_DISABLE_GC: '1'
      TRTLLM_WORKER_DISABLE_GC: '1'
      NCCL_GRAPH_MIXING_SUPPORT: '0'
      MIMALLOC_ARENA_RESERVE: '0'
      OMP_NUM_THREADS: '1'
      HF_HUB_TRUST_REMOTE_CODE: '1'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      KIMI_K3_MLA_MAX_POSITIONS: '1048576'
      KIMI_K3_ATTN_RES_TOPOLOGY: '1'
      TRTLLM_KV_TRANSFER_NUM_THREADS: '8'
      TRTLLM_SERVE_ENABLE_MSGSPEC: '1'
      WORKER_CPU_AFFINITY: numa
      TLLM_K3_MLA_GEN_BACKEND: cute-dsl
      KIMI_K3_FP8_WEIGHT_READ_MOE_MLP: '1'
      TLLM_KIMI_K3_BF16_KV_LAYERS: 91,92
      TLLM_KIMI_K3_FP8_KV_LAYERS: 91,92
      TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '2.84'
      CUDA_SCALE_LAUNCH_QUEUES: 4x
      TLLM_V2_CTX_COST_KV_OFFSET: '0'
      TLLM_V2_CTX_COST_KV_DEPTH_THRESHOLD: '0'
      TLLM_V2_CTX_COST_PER_CHUNK_DEPTH_TOKENS: '0'
      TLLM_V2_CTX_DEMOTE_UNCACHED_TOKENS: '0'
      TLLM_V2_CTX_DEMOTE_MAX_ITERS: '0'
      TLLM_MOE_ASYNC_INPUT_QUANT: '0'
      TLLM_ROUTING_DISABLE_COOP_LAUNCH: '1'
      TRTLLM_CTX_ONLY_BENCHMARK: '1'
      TRTLLM_DWDP_PREFETCH_GATHER: '1'
      TRTLLM_DWDP_GATHER_KERNEL: tma
      TLLM_AUTOTUNER_MULTIPROCESS: '0'
      TLLM_FMHA_LIBS: -flashinfer_trtllm_gen
      UCX_TLS: rc,ud,cuda_ipc,cuda_copy,sm,self,tcp
    args:
      enable_iter_perf_stats: true
      iter_perf_stats_interval: 40
      backend: pytorch
      attention_dp_config:
        kv_cache_routing_conversation_affinity: true
        kv_cache_routing_new_conv_placement: least_queued
      cache_transceiver_config:
        backend: NIXL
        kv_cache_bounce_size_mb: 0
        kv_transfer_timeout_ms: 600000
        transceiver_runtime: PYTHON
      cuda_graph_config: null
      disable_overlap_scheduler: true
      dwdp_config:
        contention_opt: false
        dwdp_size: 16
        num_experts_per_worker: 56
        num_groups: 1
        num_prefetch_experts: 56
      enable_attention_dp: true
      enable_chunked_prefill: true
      kv_cache_config:
        iteration_stats_interval: 40
        block_reuse_config:
          max_num_turns: 5
          policy: per_conversation
        dtype: nvfp4
        enable_block_reuse: true
        free_gpu_memory_fraction: 0.7
        host_cache_size: 171798691840
        mamba_ssm_cache_dtype: bfloat16
        mamba_state_config:
          additional_snapshot_offsets_from_end:
          - 0
        pool_ratio:
        - 0.205
        - 0.02
        - 0.635
        - 0.14
        tokens_per_block: 128
        use_kv_cache_manager_v2: true
      max_batch_size: 16
      max_num_tokens: 16384
      max_seq_len: 996672
      moe_config:
        backend: CUTEDSL
        max_num_tokens: 16384
        use_low_precision_moe_combine: true
      moe_expert_parallel_size: 1
      pipeline_parallel_size: 1
      print_iter_log: true
      stream_interval: 10
      tensor_parallel_size: 1
      trust_remote_code: true
      return_perf_metrics: false
  decode:
    nodes: 12
    workers: 6
    gpus: 8
    env:
      UCX_LOG_LEVEL: info
      # The NUMA wrapper selects UCX NICs per task from its GPU NUMA node.
      SRTCTL_UCX_NET_DEVICES_NUMA_0: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_5:1,eth0
      SRTCTL_UCX_NET_DEVICES_NUMA_1: mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_11:1,eth0
      MPI_UCX_TLS: rc,ud,sm,self
      MPI_UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_5:1,mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_11:1
      MPI_UCX_RNDV_THRESH: inf
      OMPI_MCA_coll: ^ucc,hcoll
      DYN_ENGINE_CONV_AFFINITY: '1'
      DYN_ENGINE_CONV_AFFINITY_DP_RANK_SOURCE: engine
      DYN_ROUTER_MODE: least-loaded
      TLLM_LOG_LEVEL: INFO
      TRTLLM_SERVER_DISABLE_GC: '1'
      TRTLLM_WORKER_DISABLE_GC: '1'
      NCCL_GRAPH_MIXING_SUPPORT: '0'
      MIMALLOC_ARENA_RESERVE: '0'
      OMP_NUM_THREADS: '1'
      HF_HUB_TRUST_REMOTE_CODE: '1'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      KIMI_K3_MLA_MAX_POSITIONS: '1048576'
      KIMI_K3_ATTN_RES_TOPOLOGY: '1'
      TRTLLM_KV_TRANSFER_NUM_THREADS: '8'
      TRTLLM_SERVE_ENABLE_MSGSPEC: '1'
      WORKER_CPU_AFFINITY: numa
      TLLM_K3_MLA_GEN_BACKEND: cute-dsl
      KIMI_K3_FP8_WEIGHT_READ_MOE_MLP: '1'
      TLLM_KIMI_K3_BF16_KV_LAYERS: 91,92
      TLLM_KIMI_K3_FP8_KV_LAYERS: 91,92
      TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '2.84'
      TRTLLM_FP4_MLA_SPLIT_KV: '8'
      UCX_TLS: rc,ud,cuda_ipc,cuda_copy,sm,self,tcp
    args:
      enable_iter_perf_stats: true
      iter_perf_stats_interval: 40
      backend: pytorch
      cache_transceiver_config:
        backend: NIXL
        kv_cache_bounce_size_mb: 0
        kv_transfer_timeout_ms: 600000
        transceiver_runtime: PYTHON
      context_parallel_size: 8
      cp_config:
        cp_type: HELIX
        fifo_version: 2
        tokens_per_block: 128
        use_nccl_for_alltoall: false
      cuda_graph_config:
        batch_sizes:
        - 1
        - 2
        - 4
        enable_padding: true
      enable_attention_dp: false
      kv_cache_config:
        iteration_stats_interval: 40
        avg_seq_len: 149442
        block_reuse_config:
          max_num_turns: 5
          policy: per_conversation
        dtype: nvfp4
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.8
        host_cache_size: 0
        mamba_ssm_cache_dtype: bfloat16
        mamba_state_config:
          additional_snapshot_offsets_from_end:
          - 0
        tokens_per_block: 128
        use_kv_cache_manager_v2: true
      max_batch_size: 1
      max_num_tokens: 8
      max_seq_len: 997696
      moe_config:
        backend: CUTEDSL_FC12
        use_low_precision_moe_combine: true
      moe_expert_parallel_size: 8
      pipeline_parallel_size: 1
      print_iter_log: true
      speculative_config:
        block_size: 7
        decoding_type: DSpark
        max_draft_len: 7
        speculative_model: /raid/common-models/kimi-k3-dspark
      stream_interval: 100
      tensor_parallel_size: 1
      trust_remote_code: true
      return_perf_metrics: false
frontend:
  type: dynamo
  enable_multiple_frontends: false
  placement:
    node: dedicated
  args:
    # Decode uses least-loaded; prefill advertises its own session-affine routing.
    router-mode: least-loaded
  env:
    ETCD_LEASE_TTL: '120'
    DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: '3600'
    DYN_TOKENIZER_CACHE_BYTES: '8589934592'
    DYN_REQUEST_PLANE: tcp
    DYN_FRONTEND_ENABLE_KV_EVENTS: '0'
benchmark:
  type: custom
  placement:
    node: dedicated
  env:
    # Emit realtime performance summaries with --ui simple every 30 seconds.
    AIPERF_UI_REALTIME_METRICS_ENABLED: 'true'
    # Keep individual session affinity without grouping sibling subagents.
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'false'
    AIPERF_REF: /home/rihuo/agentx-harness
    AIPERF_DATASET_MMAP_CACHE_DIR: /home/rihuo/aiperf_mmap
    AIPERF_DATASET_CONFIGURATION_TIMEOUT: '1800'
    AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT: '1800'
  command: |
    set -euo pipefail
    SERVER_METRICS_ARGS=()
    if [ -n "${AIPERF_SERVER_METRICS_URLS:-}" ]; then
      IFS=',' read -r -a SERVER_METRICS_URLS <<< "$AIPERF_SERVER_METRICS_URLS"
      SERVER_METRICS_ARGS+=(--server-metrics "${SERVER_METRICS_URLS[@]}")
    fi
    AIPERF_VENV="${TMPDIR:-/tmp}/agentx-aiperf-${SLURM_JOB_ID:-$$}"
    if [ ! -x "$AIPERF_VENV/bin/aiperf" ]; then
      python3 -m venv "$AIPERF_VENV"
      "$AIPERF_VENV/bin/pip" install -q --upgrade pip
      "$AIPERF_VENV/bin/pip" install -q "$AIPERF_REF" "datasets>=4.7.0" "huggingface_hub[cli]>=0.25.0"
    fi
    mkdir -p /logs/agentic/concurrency_42
    "$AIPERF_VENV/bin/aiperf" profile --scenario inferencex-agentx-mvp \
      --session-header X-Dynamo-Session-ID \
      --url http://$SRT_FRONTEND_HOST:$SRT_FRONTEND_PORT --endpoint /v1/chat/completions --endpoint-type chat --streaming \
      -m Kimi-K3 --tokenizer /model --tokenizer-trust-remote-code \
      --public-dataset semianalysis_cc_traces_weka_062126 \
      --max-context-length 996579 \
      --trajectory-start-min-ratio 0.25 --trajectory-start-max-ratio 0.75 \
      --trace-idle-gap-cap-seconds 300 --warmup-requests-per-lane 3 \
      --num-dataset-entries 393 --slice-duration 1.0 --stats-interval 30 \
      --use-server-token-count --no-gpu-telemetry --random-seed 42 \
      --failed-request-threshold 0.1 \
      "${SERVER_METRICS_ARGS[@]}" --server-metrics-formats json csv parquet jsonl \
      --benchmark-duration 3600 --concurrency 42 \
      --output-artifact-dir /logs/agentic/concurrency_42 --ui simple
