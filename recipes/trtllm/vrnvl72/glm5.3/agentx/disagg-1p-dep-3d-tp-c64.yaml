# GLM-5.3 AgentX benchmark on VRNVL72; source topology and tuning are preserved.
schema: 2
name: disagg-1p-dep-3d-tp-c64
model:
  path: /home/rihuo/GLM-5.3-NVFP4
  container: /home/rihuo/tensorrt-llm-release-arm64-f1bdd25-user_imant_glm5-rubin-30428.sqsh
  precision: nvfp4
resources:
  gpu_type: vrnvl72
  gpus_per_node: 4
  het_jobs: false
dynamo:
  install: true
  source:
    wheel: 1.6.0.dev20261007
frontend:
  type: dynamo
  placement:
    node: dedicated
  enable_multiple_frontends: false
  env:
    ETCD_LEASE_TTL: '120'
    DYN_ROUTER_TEMPERATURE: '0'
    DYN_TOKENIZER_CACHE: '1'
    DYN_TOKENIZER_CACHE_BYTES: '8000000000'
    DYN_TOKENIZER: fastokens
    DYN_TCP_REQUEST_TIMEOUT: '30'
    DYN_REQUEST_PLANE: tcp
    DYN_FRONTEND_ENABLE_KV_EVENTS: '0'
    DYN_LOGGING_JSONL: 'false'
    OTEL_EXPORT_ENABLED: 'false'
  args:
    router-mode: kv
    router-session-affinity-ttl-secs: '14400'
engine:
  type: trtllm
  served_model_name: GLM-5.3
  numa_memory_bind: true
  numa_cpu_bind: true
  publish_metrics: true
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 4
    args:
      iter_perf_stats_interval: 40
      backend: pytorch
      cache_transceiver_config:
        backend: NIXL
        kv_cache_bounce_size_mb: 5120
        kv_transfer_sender_future_timeout_ms: 20
        kv_transfer_timeout_ms: 600000
        max_tokens_in_buffer: 1048576
        transceiver_runtime: PYTHON
      speculative_config:
        decoding_type: MTP
        num_nextn_predict_layers: 5
      disable_overlap_scheduler: false
      enable_attention_dp: true
      kv_cache_config:
        iteration_stats_interval: 40
        enable_block_reuse: true
        host_cache_size: 257698037760
        dtype: fp8
        free_gpu_memory_fraction: 0.75
        event_buffer_max_size: 0
        tokens_per_block: 64
      enable_chunked_prefill: true
      attention_dp_config:
        enable_kv_cache_aware_routing: false
        kv_cache_routing_conversation_affinity: true
        kv_cache_routing_max_sessions: 65536
      max_batch_size: 256
      max_num_tokens: 8192
      max_seq_len: 1048576
      moe_config:
        backend: CUTEDSL
      moe_expert_parallel_size: 4
      num_postprocess_workers: 8
      pipeline_parallel_size: 1
      print_iter_log: true
      sparse_attention_config:
        algorithm: dsa
        enable_heuristic_topk: true
      scheduler_config:
        capacity_scheduler_policy: MAX_UTILIZATION
      perf_metrics_max_requests: 100000
      return_perf_metrics: false
      tensor_parallel_size: 4
      trust_remote_code: true
      cuda_graph_config:
      enable_iter_perf_stats: true
    env:
      CUDA_DISABLE_IOMMU_ACS_P2P_CAPABILITY_CHECK: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_HUB_OFFLINE: '1'
      MIMALLOC_PURGE_DELAY: '0'
      NCCL_GRAPH_MIXING_SUPPORT: '0'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TLLM_ADP_ROUTER_MATCH_RATE_THRESHOLD: '0.10'
      TLLM_ADP_TOKEN_AWARE_PLACEMENT: '1'
      TLLM_LOG_LEVEL: INFO
      TLLM_PREFIX_TOKEN_CACHE: '1'
      TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '2.61'
      TQDM_DISABLE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TRTLLM_DSA_INDEXER_BF16: '1'
      TRTLLM_DSA_KV_NORM_PACK: '1'
      TRTLLM_ENABLE_PDL: '1'
      TRTLLM_FUSED_DSA_METADATA: '1'
      TRTLLM_GVR_SPLIT4: '1'
      TRTLLM_KVCACHE_RECV_BUFFER_COUNT: '1'
      TRTLLM_KVCACHE_SEND_BUFFER_COUNT: '1'
      TRTLLM_KV_CACHE_TRANSFER_TIMEOUT_SEC: '600'
      TRTLLM_MLA_CTX_Q_GRID: '1'
      TRTLLM_SERVER_DISABLE_GC: '1'
      TRTLLM_SERVE_ENABLE_MSGSPEC: '1'
      TRTLLM_WORKER_DISABLE_GC: '1'
      UCX_CUDA_IPC_ENABLE_MNNVL: y
      UCX_NET_DEVICES: ^mlx5_9:1
      UCX_RNDV_SCHEME: put_zcopy
      UCX_TLS: cuda_ipc,cuda_copy,sm,self,tcp
      HF_HOME: /home/rihuo/hf_cache
      DYN_ENGINE_CONV_AFFINITY: '1'
      UCX_LOG_LEVEL: info
      OMPI_MCA_pml: ucx
      OMPI_MCA_coll: ^ucc,hcoll
      MPI_UCX_TLS: rc,ud,sm,self
      MPI_UCX_PROTO_INFO: y
      MPI_UCX_NET_DEVICES: mlx5_0:1,mlx5_6:1
  decode:
    nodes: 3
    workers: 3
    gpus: 4
    args:
      iter_perf_stats_interval: 40
      backend: pytorch
      cache_transceiver_config:
        backend: NIXL
        kv_cache_bounce_size_mb: 5120
        kv_transfer_timeout_ms: 600000
        max_tokens_in_buffer: 1048576
        transceiver_runtime: PYTHON
      cuda_graph_config:
        batch_sizes:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
        enable_padding: true
      speculative_config:
        decoding_type: MTP
        max_draft_len: 5
      enable_attention_dp: false
      kv_cache_config:
        iteration_stats_interval: 40
        enable_block_reuse: false
        host_cache_size: 0
        dtype: fp8
        free_gpu_memory_fraction: 0.9
        event_buffer_max_size: 0
        tokens_per_block: 64
      max_batch_size: 6
      max_num_tokens: 128
      max_seq_len: 1048576
      moe_config:
        backend: TRTLLM
        use_low_precision_moe_combine: true
      moe_expert_parallel_size: 1
      num_postprocess_workers: 4
      pipeline_parallel_size: 1
      print_iter_log: true
      sparse_attention_config:
        algorithm: dsa
        enable_heuristic_topk: true
        use_cute_dsl_paged_mqa_logits: true
      perf_metrics_max_requests: 100000
      return_perf_metrics: false
      scheduler_config:
        capacity_scheduler_policy: GUARANTEED_NO_EVICT
      stream_interval: 20
      tensor_parallel_size: 4
      trust_remote_code: true
      enable_iter_perf_stats: true
    env:
      CUDA_DISABLE_IOMMU_ACS_P2P_CAPABILITY_CHECK: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_HUB_OFFLINE: '1'
      MIMALLOC_PURGE_DELAY: '0'
      NCCL_GRAPH_MIXING_SUPPORT: '0'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TLLM_ADP_ROUTER_MATCH_RATE_THRESHOLD: '0.10'
      TLLM_LOG_LEVEL: INFO
      TLLM_PREFIX_TOKEN_CACHE: '1'
      TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '2.61'
      TQDM_DISABLE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TRTLLM_DSA_GROUP_REMAP_SORT: '1'
      TRTLLM_DSA_INDEXER_BF16: '1'
      TRTLLM_DSA_KV_NORM_PACK: '1'
      TRTLLM_DSA_LOGITS_FULL_QUERY: '1'
      TRTLLM_ENABLE_PDL: '1'
      TRTLLM_FUSED_DSA_METADATA: '1'
      TRTLLM_GVR_SPLIT4: '1'
      TRTLLM_KVCACHE_RECV_BUFFER_COUNT: '1'
      TRTLLM_KVCACHE_SEND_BUFFER_COUNT: '1'
      TRTLLM_KV_CACHE_TRANSFER_TIMEOUT_SEC: '600'
      TRTLLM_MLA_CTX_Q_GRID: '1'
      TRTLLM_MOE_FINALIZE_CTA1: '1'
      TRTLLM_SERVER_DISABLE_GC: '1'
      TRTLLM_SERVE_ENABLE_MSGSPEC: '1'
      TRTLLM_WORKER_DISABLE_GC: '1'
      UCX_CUDA_IPC_ENABLE_MNNVL: y
      UCX_NET_DEVICES: ^mlx5_9:1
      UCX_RNDV_SCHEME: put_zcopy
      UCX_TLS: cuda_ipc,cuda_copy,sm,self,tcp
      HF_HOME: /home/rihuo/hf_cache
      DYN_ENGINE_CONV_AFFINITY: '1'
      DYN_ROUTER_MODE: least-loaded
      UCX_LOG_LEVEL: info
      OMPI_MCA_pml: ucx
      OMPI_MCA_coll: ^ucc,hcoll
      MPI_UCX_TLS: rc,ud,sm,self
      MPI_UCX_PROTO_INFO: y
      MPI_UCX_NET_DEVICES: mlx5_0:1,mlx5_6:1
health_check:
  max_attempts: 270
  interval_seconds: 10
benchmark:
  type: custom
  env:
    MODEL: /model
    MODEL_PREFIX: glm5.3
    FRAMEWORK: dynamo-trt
    PRECISION: fp4
    CONC: '64'
    DURATION: '3600'
    INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
    RESULT_DIR: /logs/agentic
    RESULT_FILENAME: disagg-1p-dep-3d-tp-c64
    AGENTIC_OUTPUT_DIR: /logs/agentic
    EVAL_ONLY: 'false'
    IS_MULTINODE: 'true'
    KV_OFFLOADING: none
    AIPERF_MAX_CONTEXT_LENGTH: '1048576'
    AIPERF_TRACE_IDLE_GAP_CAP_SECONDS: '300'
    AIPERF_LIVE_FAILED_REQUEST_THRESHOLD: '0.1'
    AIPERF_FAILED_REQUEST_THRESHOLD: '0.1'
    AIPERF_WARMUP_REQUESTS_PER_LANE: '3'
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: trtllm_kv_cache_utilization
    AIPERF_DATASET_MMAP_CACHE_DIR: /aiperf_mmap_cache
    HF_HUB_CACHE: /hf_hub_cache
    SERVED_MODEL_NAME: GLM-5.3
    AIPERF_PYTHON_VERSION: '3.11'
    AGENTIC_WARMUP_GRACE_PERIOD: '1800'
    AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: '3600'
    AIPERF_EXPERIMENTAL_FAST: '0'
    AIPERF_UNSAFE_OVERRIDE: 'false'
    ENABLE_AGENTX_POWER: '1'
    REQUIRE_POWER: '0'
    DISAGG: 'true'
    RUNNER_TYPE: vrnvl72
    SPEC_DECODING: mtp
    KV_P2P_TRANSFER: nixl
    PREFILL_NUM_WORKERS: '1'
    PREFILL_TP: '4'
    PREFILL_EP: '4'
    PREFILL_DP_ATTN: 'true'
    PREFILL_HARDWARE: vrnvl72
    DECODE_NUM_WORKERS: '3'
    DECODE_TP: '4'
    DECODE_EP: '1'
    DECODE_HARDWARE: vrnvl72
  command: "bash /infmax-workspace/benchmarks/srt_agentic.sh"
  placement:
    node: dedicated
  colocate_with_frontend: true
