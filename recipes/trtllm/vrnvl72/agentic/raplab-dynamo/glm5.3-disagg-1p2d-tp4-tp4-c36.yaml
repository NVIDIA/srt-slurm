      TRTLLM_NO_FP64_NOAUX_TC: '1'
      TRTLLM_OPROJ_LAMPORT_PUBLISH: '1'
      TRTLLM_PACKED_STEP_INPUTS: '1'
      TRTLLM_PACKED_STEP_INPUTS_FAST: '1'
      TRTLLM_PRE_MOE_FP4_LINEAR_FUSION: '1'
      TRTLLM_ROUTER_EARLY_TRIGGER: '1'
      TRTLLM_ROUTER_PREFETCH: '1'
      TRTLLM_SERVER_DISABLE_GC: '1'
      TRTLLM_SERVE_ENABLE_MSGSPEC: '1'
      TRTLLM_SETUP_ATTN_METADATA_FAST: '1'
      TRTLLM_SPEC_SEQ_LENS_ASIDE: '1'
      TRTLLM_VERIFY_HEAD_DIRECT_SAMPLING: '1'
      TRTLLM_VERIFY_HEAD_FAST_SAMPLING: '1'
      TRTLLM_VERIFY_HEAD_FUSED_ACCEPT: '1'
      TRTLLM_WORKER_DISABLE_GC: '1'
