#
# GLM-5.3 Vera Rubin pareto02; adapted from the GLM-5.2 BTK e2e_pareto recipe.
# Dynamo from local wheels on the GLM-5.3 Rubin image and the local AgentX client.
# Model, image and wheel paths are explicit; configure cluster settings in srtslurm.yaml.
# MTP forced acceptance follows acceptance_length.json: AL(depth) - 1.

schema: 2
name: glm5.3-disagg-1p2d-tp4-tp4-c36
model:
  path: /home/rihuo/GLM-5.3-NVFP4
  container: /home/_shared/tensorrt-llm-release-arm64-f1bdd25-user_imant_glm5-rubin-30428.sqsh
  precision: nvfp4
resources:
  gpu_type: vrnvl72
  gpus_per_node: 4
  het_jobs: false
environment:
  # The image's /etc/environment points pip at urm.nvidia.com, which RapLab cannot resolve.
  PIP_CONFIG_FILE: /dev/null
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_EXTRA_INDEX_URL: https://pypi.nvidia.com
observability:
  enable_otel: false
setup_script: install_dynamo_wheel.sh
dynamo:
  install: false
  request_plane: tcp
  event_plane: zmq
frontend:
  type: dynamo
  placement:
    node: dedicated
  enable_multiple_frontends: false
  env:
    ETCD_LEASE_TTL: '120'
    DYN_TOKENIZER_CACHE_BYTES: '8000000000'
    DYN_TOKENIZER: fastokens
    DYN_TCP_REQUEST_TIMEOUT: '30'
    DYN_ROUTER_USE_KV_EVENTS: '0'
  args:
    router-mode: kv
    router-session-affinity-ttl-secs: '14400'
engine:
  type: trtllm
  served_model_name: GLM-5.3
  numa_memory_bind: local
  numa_cpu_bind: true
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 4
    env:
      DYN_ENGINE_CONV_AFFINITY: '1'
      DYN_TOOL_CALL_PARSER: glm47
      CUDA_DISABLE_IOMMU_ACS_P2P_CAPABILITY_CHECK: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_HUB_OFFLINE: '1'
      MIMALLOC_PURGE_DELAY: '0'
      NCCL_GRAPH_MIXING_SUPPORT: '0'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TLLM_ADP_ROUTER_MATCH_RATE_THRESHOLD: '0.10'
      TLLM_ADP_TOKEN_AWARE_PLACEMENT: '1'
      TLLM_LOG_LEVEL: INFO
      TLLM_PREFIX_TOKEN_CACHE: '1'
      TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '2.61'
      TQDM_DISABLE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TRTLLM_DSA_INDEXER_BF16: '1'
      TRTLLM_ENABLE_PDL: '1'
      TRTLLM_FUSED_DSA_METADATA: '1'
      TRTLLM_KVCACHE_RECV_BUFFER_COUNT: '1'
      TRTLLM_KVCACHE_SEND_BUFFER_COUNT: '1'
      TRTLLM_KV_CACHE_TRANSFER_TIMEOUT_SEC: '600'
      TRTLLM_SERVER_DISABLE_GC: '1'
      TRTLLM_SERVE_ENABLE_MSGSPEC: '1'
      TRTLLM_WORKER_DISABLE_GC: '1'
      UCX_CUDA_IPC_ENABLE_MNNVL: y
      UCX_LOG_LEVEL: info
      UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_5:1,mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_11:1
      UCX_PROTO_INFO: y
      MPI_UCX_TLS: rc,ud,sm,self
      MPI_UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_5:1,mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_11:1
      NCCL_IB_HCA: '=mlx5_0::0:0,mlx5_1::1:0,mlx5_2::2:0,mlx5_5::3:0,mlx5_6::0:1,mlx5_7::1:1,mlx5_8::2:1,mlx5_11::3:1'
      NCCL_NVLINK_UTIL_CENTRIC_SCHED_ENABLE: '0'
      UCX_RNDV_SCHEME: put_zcopy
      UCX_TLS: all
      PYTHONUNBUFFERED: '1'
      TLLM_EXECUTOR_BATCH_RESP_IN_AWAIT: '1'
      TLLM_EXECUTOR_USE_FILE_SOCKET: '1'
    args:
      enable_iter_perf_stats: true
      iter_perf_stats_interval: 40
      backend: pytorch
      cache_transceiver_config:
        backend: NIXL
        kv_cache_bounce_size_mb: 5120
        kv_transfer_timeout_ms: 600000
        max_tokens_in_buffer: 1048576
        transceiver_runtime: PYTHON
      speculative_config:
        decoding_type: MTP
        num_nextn_predict_layers: 5
      disable_overlap_scheduler: false
      enable_attention_dp: true
      kv_cache_config:
        iteration_stats_interval: 40
        enable_block_reuse: true
        host_cache_size: 257698037760
        dtype: fp8
        free_gpu_memory_fraction: 0.75
        tokens_per_block: 64
        event_buffer_max_size: 0
      enable_chunked_prefill: true
      attention_dp_config:
        enable_kv_cache_aware_routing: false
        kv_cache_routing_conversation_affinity: true
        kv_cache_routing_max_sessions: 65536
      max_batch_size: 256
      max_num_tokens: 8192
      max_seq_len: 1048576
      moe_config:
        backend: CUTEDSL
      moe_expert_parallel_size: 4
      pipeline_parallel_size: 1
      print_iter_log: true
      sparse_attention_config:
        algorithm: dsa
        enable_heuristic_topk: true
      tensor_parallel_size: 4
      trust_remote_code: true
      scheduler_config:
        capacity_scheduler_policy: MAX_UTILIZATION
      perf_metrics_max_requests: 100000
      return_perf_metrics: true
      cuda_graph_config: null
  decode:
    nodes: 2
    workers: 2
    gpus: 4
    env:
      DYN_TOOL_CALL_PARSER: glm47
      DYN_ROUTER_MODE: least-loaded
      CUDA_DISABLE_IOMMU_ACS_P2P_CAPABILITY_CHECK: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_HUB_OFFLINE: '1'
      MIMALLOC_PURGE_DELAY: '0'
      NCCL_GRAPH_MIXING_SUPPORT: '0'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TLLM_ADP_ROUTER_MATCH_RATE_THRESHOLD: '0.10'
      TLLM_LOG_LEVEL: INFO
      TLLM_PREFIX_TOKEN_CACHE: '1'
      TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '2.61'
      TQDM_DISABLE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TRTLLM_CPU_AFFINITY_BEFORE_CUDA: '1'
      TRTLLM_DENSE_PRE_MLP_FUSION: '1'
      TRTLLM_DRAFT_EHPROJ_AR_NORM: '1'
      TRTLLM_DRAFT_EHPROJ_LOWM: '1'
      TRTLLM_DRAFT_GLUE_FUSED: '1'
      TRTLLM_DRAFT_STEP0_GLUE: '1'
      TRTLLM_DRAFT_STEP0_ROW_SELECT: '1'
      TRTLLM_DSA_GROUP_REMAP_SORT: '1'
      TRTLLM_DSA_IDX_ABSORBED_Q: '1'
      TRTLLM_DSA_INDEXER_BF16: '1'
      TRTLLM_DSA_INDEXER_OVERLAP: '1'
      TRTLLM_DSA_LOGITS_EARLY: '1'
      TRTLLM_DSA_LOGITS_FULL_QUERY: '1'
      TRTLLM_DSA_PREPARE_FAST: '1'
      TRTLLM_DSA_PROLOGUE_KWRITE: '1'
      TRTLLM_DSA_PROLOGUE_PREWAIT: '1'
      TRTLLM_DSA_QTAIL_IN_WQB: '1'
      TRTLLM_DSA_SKIP_DEAD_SCHED: '1'
      TRTLLM_DSA_SKIP_SHARED_TOPK_COPY: '1'
      TRTLLM_DSA_WKWP_IN_FUSED_A: '1'
      TRTLLM_DSA_WQB_FROM_QA: '1'
      TRTLLM_ENABLE_PDL: '1'
      TRTLLM_EXECUTOR_CORE_PIN: '1'
      TRTLLM_FETCH_AFTER_LAUNCH: '1'
      TRTLLM_FOLD_GRAPH_COPIES: '1'
      TRTLLM_FUSED_A_MMA8: '3'
