      TRTLLM_HANG_DETECTOR_LITE: '1'
      TRTLLM_ITER_LOG_AFTER_LAUNCH: '1'
      TRTLLM_KVCACHE_RECV_BUFFER_COUNT: '1'
      TRTLLM_KVCACHE_SEND_BUFFER_COUNT: '1'
      TRTLLM_KV_CACHE_TRANSFER_TIMEOUT_SEC: '600'
      TRTLLM_KV_OFFSETS_INCREMENTAL: '1'
      TRTLLM_KV_TABLE_EARLY_COPY: '1'
      TRTLLM_KV_TRANSFER_CHECK_ON_DEMAND: '1'
      TRTLLM_LM_HEAD_ONE_WAVE: '1'
      TRTLLM_LOW_M_GEMM_BACKEND: splitk_default
      TRTLLM_MLA_ABSORB_K_B: '1'
      TRTLLM_MLA_KV_FUSED_APPEND: '1'
      TRTLLM_MLA_QB_NORM_FOLD: '1'
      TRTLLM_MLA_QB_ROPE_FP8: '1'
      TRTLLM_MLA_WEIGHT_PREFETCH: '1'
      TRTLLM_MNNVL_MAX_SHARED_CARVEOUT: '1'
      TRTLLM_MNNVL_MOE_FINALIZE_FUSION: '1'
      TRTLLM_MOE_FINALIZE_CTA1: '1'
      TRTLLM_MOE_FINALIZE_PREWAIT: '1'
      TRTLLM_MTP0_STASH_AUX: '1'
      TRTLLM_MTP_HOP_EARLY_TRIGGER: '1'
