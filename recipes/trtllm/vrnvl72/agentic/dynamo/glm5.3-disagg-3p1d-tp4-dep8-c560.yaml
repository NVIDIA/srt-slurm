# Resolve model/container aliases and cluster mounts in srtslurm.yaml; see README.md.
# MTP forced acceptance follows acceptance_length.json: AL(depth) - 1.

schema: 2
name: glm5.3-disagg-3p1d-tp4-dep8-c560
model:
  path: glm5.3
  container: trtllm-glm5.3-rubin
  precision: nvfp4
resources:
  gpu_type: vrnvl72
  gpus_per_node: 4
  het_jobs: false
dynamo:
  install: true
  source:
    wheel: 1.6.0.dev20261013
  request_plane: tcp
  event_plane: zmq
frontend:
  type: dynamo
  placement:
    node: dedicated
  enable_multiple_frontends: false
  args:
    router-mode: least-loaded
    trust-remote-code: true
engine:
  type: trtllm
  served_model_name: GLM-5.3
  numa_memory_bind: local
  numa_cpu_bind: true
roles:
  prefill:
    nodes: 3
    workers: 3
    gpus: 4
    env:
      DYN_TOOL_CALL_PARSER: glm47
      DYN_ROUTER_MODE: least-loaded
      CUDA_DISABLE_IOMMU_ACS_P2P_CAPABILITY_CHECK: '1'
      FLASHINFER_CACHE_DIR: /tmp/flashinfer-cache
