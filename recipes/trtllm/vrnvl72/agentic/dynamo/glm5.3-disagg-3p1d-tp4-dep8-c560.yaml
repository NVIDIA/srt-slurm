services:
- name: mooncake-master
  type: mooncake-master
  placement:
    node: head
  command:
  - mooncake_master
  - --rpc_port={master_port}
  - --metrics_port=8702
  - --default_kv_lease_ttl=60000
  - --eviction_ratio=0.02
  - --allocation_strategy=random
  env:
    GLOG_logtostderr: '1'
    GLOG_v: '0'
  options:
    store_config:
      device_name: mlx5_0,mlx5_1,mlx5_2,mlx5_5,mlx5_6,mlx5_7,mlx5_8,mlx5_11
      metadata_server: P2PHANDSHAKE
      protocol: rdma
      global_segment_size: 260GiB
      local_buffer_size: 1GiB
      transfer_batch_size: 512
      stage_through_host: true
      staging_buffer_bytes: 2GiB
      async_load: true
      async_load_workers: 2
      role: both
      model_key: GLM-5.3
  readiness:
    tcp:
      port: 8700
    timeout_seconds: 300
  metrics:
    port: 8702
- name: decode-mooncake-donor
  type: generic
  placement:
    node: decode
  start: after_frontend
  critical: true
  srun_options:
    mpi: none
  env:
    MC_MS_AUTO_DISC: '0'
    MC_TE_FILTERS: 'mlx5_0,mlx5_1,mlx5_2,mlx5_5,mlx5_6,mlx5_7,mlx5_8,mlx5_11'
    MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
    TLLM_LOG_LEVEL: INFO
    PYTHONUNBUFFERED: '1'
  preamble: |-
    for name in $(compgen -e); do
      case "$name" in
        PMIX_*|PMI_*|OMPI_*|SLURM_*|SLURMD_*|MPI_*|OPAL_*|PRTE_*|HYDRA_*|I_MPI_*) unset "$name" ;;
      esac
    done
  command:
  - bash
  - -c
  - |
    set -euo pipefail
    exec trtllm-serve mooncake_donor --config /logs/mooncake_store_config_prefill.json --segment_size 1100GiB --ready_file /logs/mooncake_donor_{index}.ready
  readiness:
    file:
      path: mooncake_donor_{index}.ready
    timeout_seconds: 300
extra_mount:
- /home/rihuo/:/home/rihuo/
benchmark:
  type: custom
  placement:
    node: dedicated
  command: |
    set -euo pipefail
    export OPENAI_API_KEY="${OPENAI_API_KEY:-EMPTY}"
    aiperf_venv=$(mktemp -d /tmp/srt-pareto-aiperf-XXXXXX)
    trap 'rm -rf "$aiperf_venv"' EXIT
    python3 -m venv "$aiperf_venv"
    "$aiperf_venv/bin/python" -m pip install \
      "/home/rihuo/agentx-harness"
    IFS=',' read -r -a worker_metrics_urls <<< "${AIPERF_SERVER_METRICS_URLS:?Worker metrics URLs were not provided}"
    ulimit -n 600000 2>/dev/null || ulimit -n 65536 2>/dev/null || true
    "$aiperf_venv/bin/aiperf" profile \
        --scenario inferencex-agentx-mvp \
        --server-metrics "${worker_metrics_urls[@]}" \
        --server-metrics-formats json csv parquet jsonl \
        --url "http://$SRT_FRONTEND_HOST:$SRT_FRONTEND_PORT" \
        --endpoint /v1/chat/completions \
        --endpoint-type chat \
        --model "$MODEL" \
        --tokenizer "${TOKENIZER:-/model}" \
        --streaming \
        --concurrency "$CONC" \
        --benchmark-duration 3600 \
        --public-dataset semianalysis_cc_traces_weka_062126 \
        --num-dataset-entries 393 \
        --failed-request-threshold 0.1 \
        --max-context-length 1048576 \
        --random-seed 42 \
        --trajectory-start-min-ratio 0.25 \
        --trajectory-start-max-ratio 0.75 \
        --use-server-token-count \
        --no-gpu-telemetry \
        --tokenizer-trust-remote-code \
        --slice-duration 1.0 \
        --warmup-requests-per-lane 10 \
        --warmup-grace-period 1800 \
        --stats-interval 30 \
        --trace-idle-gap-cap-seconds 300 \
        --output-artifact-dir /logs/agentic/aiperf_results
  env:
    MODEL: GLM-5.3
    TOKENIZER: /model
    AIPERF_DATASET_WEKA_LIVE_ASSISTANT_RESPONSES: '0'
    AIPERF_DATASET_CONFIGURATION_TIMEOUT: '1800'
    AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT: '1800'
    CONC: '560'
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
    AIPERF_HTTP_X_SESSION_ID_FROM_CORRELATION_ID: 'true'
    AIPERF_DATASET_MMAP_CACHE_DIR: /tmp/aiperf-mmap-cache
    HF_HUB_DISABLE_PROGRESS_BARS: '1'
    TQDM_DISABLE: '1'
