# GR100-NVL72 DeepSeek-R1 NVFP4 — disaggregated OFFLINE 1c2g via trtllm-serve
# Topology: 1 ctx (TP=EP=2, 2 GPU / 1 node) + 2 gen (TP=EP=8, 8 GPU / 2 nodes each)
# Total worker GPUs: 1×2 + 2×8 = 18 GPUs across 5 nodes (no infra node — trtllm-serve
# needs no etcd/NATS; saves 1 node vs the dynamo recipe).
# Source configs captured from sflow job 314667 (trtllm_disagg_perf_only):
#   prefill engine: point_offline_disagg_1c2g/server-ctx.yaml
#   decode  engine: point_offline_disagg_1c2g/server-gen-bs1024.yaml
#   worker  env:    point_offline_disagg_1c2g/{ctx,gen}-env.yaml (identical, no TLLM_LOG_LEVEL)
#   client config:  point_offline_disagg_1c2g/client_bs1024_360k.yaml
#   endpoint env:   point_offline_disagg_1c2g/endpoint_env.yaml
# NOTE: the bundle had NUM_FRONTEND_SERVERS=2; srt-slurm uses 1 (trtllm_serve requires
#   enable_multiple_frontends: false). Scale max_connections proportionally if needed.
# NOTE: gpu_type "gr100" is not yet in the numactl allowlist in trtllm.py:199.
#   Add "gr100" to the tuple if numactl NUMA binding is needed for GR100 nodes.

name: "dsr1-gr100-trtllm-serve-offline-1c2g"

model:
  path: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/rihuo/centml_DeepSeek-R1-NVFP4-v2-mlpinf"
  container: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/rihuo/tensorrtllm-release-1-3-0rc21-arm64.sqsh"
  precision: "fp4"

resources:
  gpu_type: "gb300"
  gpus_per_node: 4

  # CTX (prefill): TP=EP=2 → 2 GPUs per worker, 1 node per worker
  prefill_workers: 1
  prefill_nodes: 1
  gpus_per_prefill: 2

  # GEN (decode): TP=EP=8 → 8 GPUs per worker, 2 nodes per worker
  decode_workers: 2
  decode_nodes: 4
  gpus_per_decode: 8

backend:
  type: trtllm

  # Environment from point_offline_disagg_1c2g/{ctx,gen}-env.yaml (identical for both).
  # Note: no TLLM_LOG_LEVEL here — trtllm-serve does not require it for print_iter_log
  # (unlike dynamo.trtllm, which uses logger.info() and needs LOG_LEVEL=info to emit).
  prefill_environment:
    UCX_CUDA_IPC_ENABLE_MNNVL: "y"
    UCX_TLS: cuda_ipc,cuda_copy,sm,self,tcp
    TRTLLM_MOE_A2A_DISABLE_CFT_COUNTED_WRITES: "1"
    TRTLLM_MOE_ENABLE_ALLTOALL_WITHOUT_ALLGATHER: "1"
    TRTLLM_GEMM_ALLREDUCE_FUSION_ENABLED: "1"
    TLLM_NUMA_AWARE_WORKER_AFFINITY: "1"
    TRTLLM_ENABLE_PDL: "1"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    NCCL_GRAPH_MIXING_SUPPORT: "0"

  decode_environment:
    UCX_CUDA_IPC_ENABLE_MNNVL: "y"
    UCX_TLS: cuda_ipc,cuda_copy,sm,self,tcp
    TRTLLM_MOE_A2A_DISABLE_CFT_COUNTED_WRITES: "1"
    TRTLLM_MOE_ENABLE_ALLTOALL_WITHOUT_ALLGATHER: "1"
    TRTLLM_GEMM_ALLREDUCE_FUSION_ENABLED: "1"
    TLLM_NUMA_AWARE_WORKER_AFFINITY: "1"
    TRTLLM_ENABLE_PDL: "1"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    NCCL_GRAPH_MIXING_SUPPORT: "0"

  trtllm_config:
    # CTX engine: point_offline_disagg_1c2g/server-ctx.yaml
    prefill:
      backend: pytorch
      tensor_parallel_size: 2
      moe_expert_parallel_size: 2
      pipeline_parallel_size: 1
      enable_attention_dp: true
      attention_dp_config:
        enable_balance: false
        batching_wait_iters: 10
        timeout_iters: 500
      max_batch_size: 128
      max_num_tokens: 16384
      max_seq_len: 3200
      cuda_graph_config: null
      disable_overlap_scheduler: true
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.85
        dtype: fp8
      moe_config:
        backend: CUTEDSL
      nvfp4_gemm_config:
        allowed_backends: [cutlass, cublaslt, cuda_core]
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 36864
      scheduler_config:
        capacity_scheduler_policy: MAX_UTILIZATION
        context_chunking_policy: FIRST_COME_FIRST_SERVED
      speculative_config: null
      use_cute_dsl_bf16_bmm: true
      use_cute_dsl_bf16_gemm: true
      print_iter_log: true
      enable_iter_perf_stats: true

    # GEN engine: point_offline_disagg_1c2g/server-gen-bs1024.yaml
    decode:
      backend: pytorch
      tensor_parallel_size: 8
      moe_expert_parallel_size: 8
      pipeline_parallel_size: 1
      enable_attention_dp: true
      enable_lm_head_tp_in_adp: true
      attention_dp_config:
        enable_balance: false
        batching_wait_iters: 10
        timeout_iters: 500
      max_batch_size: 1024
      max_num_tokens: 8192
      max_seq_len: 23200
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.9
        dtype: fp8
      moe_config:
        backend: CUTEDSL
        use_low_precision_moe_combine: true
      nvfp4_gemm_config:
        allowed_backends: [cutlass, cublaslt, cutedsl, cuda_core]
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 36864
      num_postprocess_workers: 4
      cuda_graph_config:
        enable_padding: true
        batch_sizes: [1,2,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,72,80,88,96,104,112,120,128,160,192,224,256,288,320,352,384,416,448,480,512,544,576,608,640,672,704,736,768,800,832,864,896,928,960,992,1024]
      scheduler_config:
        capacity_scheduler_policy: MAX_UTILIZATION
        context_chunking_policy: FIRST_COME_FIRST_SERVED
      speculative_config: null
      print_iter_log: true
      enable_iter_perf_stats: true

benchmark:
  type: "custom"
  container_image: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/rihuo/endpoint_client_bbc86973_pr372.sqsh"
  env:
    PYTHONNOUSERSITE: "1"
    MODEL_DIR: "/model"
    # From point_offline_disagg_1c2g/endpoint_env.yaml — puts inference-endpoint
    # and PyYAML (needed by the resolver below) on PATH/PYTHONPATH.
    PATH: "/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    TIKTOKEN_RS_CACHE_DIR: "/work/.tiktoken_rs_cache"
    HF_HOME: "/work/.hf_cache"
  # Resolves client_bs1024_360k.yaml by injecting the trtllm-serve frontend URL
  # (http://localhost:8000). The bundle used 2 frontends and num_workers=16;
  # srt-slurm uses 1 frontend, so num_workers is halved to 8 to maintain the same
  # worker-per-frontend ratio. Adjust max_connections proportionally if needed.
  command: |
    set -euo pipefail
    CONFIG=/work/client_submission.yaml
    RESOLVED=/logs/endpoint_resolved.yaml
    mkdir -p /logs/report
    /opt/venv/bin/python3 - "$CONFIG" "$RESOLVED" << 'PYEOF'
    import yaml, sys, os
    cfg = yaml.safe_load(open(sys.argv[1]))
    cfg["endpoint_config"]["endpoints"] = ["http://localhost:8000"]
    cfg["model_params"]["tokenizer_name"] = os.environ.get("MODEL_DIR", "/model")
    cfg["model_params"]["name"] = "centml_DeepSeek-R1-NVFP4-v2-mlpinf"
    cfg["report_dir"] = "/logs/report"
    # halve num_workers for 1 frontend (bundle had 2)
    cfg.setdefault("settings", {}).setdefault("client", {})["num_workers"] = 8
    # Drop accuracy datasets: the scorer requires deepseek_eval_runner.py which is
    # not set up in the endpoint client container. Perf-only run doesn't need them.
    cfg["datasets"] = [d for d in cfg.get("datasets", []) if d.get("type") != "accuracy"]
    yaml.dump(cfg, open(sys.argv[2], "w"), default_flow_style=False)
    PYEOF
    echo "[endpoint-resolve] Wrote resolved config to $RESOLVED"
    /opt/venv/bin/inference-endpoint benchmark from-config -c "$RESOLVED" --mode perf

container_mounts:
  "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/rihuo/mlperf": "/work"
  "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/rihuo/endpoints-launch": "/endpoints-launch-mount"

frontend:
  # trtllm-serve disaggregated: builds ser.yaml from worker URLs and runs the
  # trtllm-serve orchestrator. No etcd/NATS required → saves 1 node vs dynamo.
  type: "trtllm_serve"
  enable_multiple_frontends: false

health_check:
  # gen dep8 with CUDA graph warmup (bs1024 list) can take up to 90 min.
  max_attempts: 540
  interval_seconds: 10
