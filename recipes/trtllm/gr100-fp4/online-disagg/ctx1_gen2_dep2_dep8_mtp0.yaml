# GR100-NVL72 DeepSeek-R1 NVFP4 — disaggregated ONLINE 1p2d via dynamo.trtllm
# Topology: 1 ctx (TP=EP=2, 2 GPU / 1 node) + 2 gen (TP=EP=8, 8 GPU / 2 nodes each)
# Total worker GPUs: 1×2 + 2×8 = 18 GPUs across 5 nodes (+ 1 infra node)
# NOTE: gpu_type "gr100" is not yet in the numactl allowlist in trtllm.py:199.
#   Add "gr100" to the tuple if numactl NUMA binding is needed for GR100 nodes.

name: "dsr1-gr100-dynamo-online-1p2d"

model:
  path: "/lustre/fsw/core_dlfw_ci/kmcgill/mlperfv6.1/models/models--centml--DeepSeek-R1-NVFP4-v2-mlpinf-flatten"
  # dynamo-trtllm container with nats-server, etcd, dynamo.frontend, dynamo.trtllm, trtllm-llmapi-launch
  container: "/lustre/fsw/core_dlfw_ci/rihuo/mlperf-inference-ttong-aarch64-mlperfrubin43654737adpfix-mlperfa4fc83a4-mlpinf.sqsh"
  precision: "fp4"

resources:
  gpu_type: "gr100"
  gpus_per_node: 4

  # CTX (prefill): TP=EP=2 → 2 GPUs per worker, 1 node per worker
  prefill_workers: 1
  prefill_nodes: 1
  gpus_per_prefill: 2

  # GEN (decode): TP=EP=8 → 8 GPUs per worker, 2 nodes per worker
  decode_workers: 2
  decode_nodes: 4
  gpus_per_decode: 8

backend:
  type: trtllm

  # CRITICAL: UCX_CUDA_IPC_ENABLE_MNNVL=y enables intra-rack cross-node KV over NVLink.
  #   Without this, ctx prefill stalls (73ms→307ms), TTFT ramps to 46s → INVALID results.
  # UCX_TLS ^posix + UCX_RNDV_SCHEME put_zcopy fix sm_107 disagg startup/KV-transfer hangs.
  prefill_environment:
    UCX_CUDA_IPC_ENABLE_MNNVL: "y"
    UCX_RNDV_SCHEME: "put_zcopy"
    UCX_TLS: "^posix"
    TRTLLM_MOE_A2A_DISABLE_CFT_COUNTED_WRITES: "1"
    TRTLLM_MOE_ENABLE_ALLTOALL_WITHOUT_ALLGATHER: "1"
    TRTLLM_GEMM_ALLREDUCE_FUSION_ENABLED: "1"
    TLLM_NUMA_AWARE_WORKER_AFFINITY: "1"
    TRTLLM_ENABLE_PDL: "1"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    # Required for print_iter_log to produce output — logger default is "error" which
    # silently discards per-iteration stats emitted via logger.info().
    TLLM_LOG_LEVEL: "info"

  decode_environment:
    UCX_CUDA_IPC_ENABLE_MNNVL: "y"
    UCX_RNDV_SCHEME: "put_zcopy"
    UCX_TLS: "^posix"
    TRTLLM_MOE_A2A_DISABLE_CFT_COUNTED_WRITES: "1"
    TRTLLM_MOE_ENABLE_ALLTOALL_WITHOUT_ALLGATHER: "1"
    TRTLLM_GEMM_ALLREDUCE_FUSION_ENABLED: "1"
    TLLM_NUMA_AWARE_WORKER_AFFINITY: "1"
    TRTLLM_ENABLE_PDL: "1"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TLLM_LOG_LEVEL: "info"

  trtllm_config:
    # CTX (prefill) engine: dep2 (TP=EP=2), ADP, MTP-0, bigbuf, UCX KV transport.
    # NOTE: cutedsl NOT in nvfp4_gemm_config.allowed_backends (prefill shapes → 8× regression).
    #       moe_config CUTEDSL and use_cute_dsl_bf16_* are safe on ctx.
    prefill:
      backend: pytorch
      tensor_parallel_size: 2
      moe_expert_parallel_size: 2
      pipeline_parallel_size: 1
      enable_attention_dp: true
      attention_dp_config:
        enable_balance: false
        batching_wait_iters: 10
        timeout_iters: 500
      max_batch_size: 128
      max_num_tokens: 16384
      max_seq_len: 3200
      cuda_graph_config: null
      disable_overlap_scheduler: true
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.85
        dtype: fp8
      moe_config:
        backend: CUTEDSL
      nvfp4_gemm_config:
        allowed_backends: [cutlass, cublaslt, cuda_core]
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 36864
      scheduler_config:
        capacity_scheduler_policy: MAX_UTILIZATION
        context_chunking_policy: FIRST_COME_FIRST_SERVED
      speculative_config: null
      use_cute_dsl_bf16_bmm: true
      use_cute_dsl_bf16_gemm: true
      print_iter_log: true
      enable_iter_perf_stats: true

    # GEN (decode) engine: dep8 (TP=EP=8), ADP, MTP-0, bs1024, UCX KV transport.
    decode:
      backend: pytorch
      tensor_parallel_size: 8
      moe_expert_parallel_size: 8
      pipeline_parallel_size: 1
      enable_attention_dp: true
      enable_lm_head_tp_in_adp: true
      attention_dp_config:
        enable_balance: false
        batching_wait_iters: 10
        timeout_iters: 500
      max_batch_size: 1024
      max_num_tokens: 8192
      max_seq_len: 23200
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.9
        dtype: fp8
      moe_config:
        backend: CUTEDSL
        use_low_precision_moe_combine: true
      nvfp4_gemm_config:
        allowed_backends: [cutlass, cublaslt, cutedsl, cuda_core]
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 36864
      num_postprocess_workers: 4
      cuda_graph_config:
        enable_padding: true
        batch_sizes: [1,2,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,72,80,88,96,104,112,120,128,160,192,224,256,288,320,352,384,416,448,480,512,544,576,608,640,672,704,736,768,800,832,864,896,928,960,992,1024]
      scheduler_config:
        capacity_scheduler_policy: MAX_UTILIZATION
        context_chunking_policy: FIRST_COME_FIRST_SERVED
      speculative_config: null
      print_iter_log: true
      enable_iter_perf_stats: true

benchmark:
  type: "custom"
  container_image: "/lustre/fsw/core_dlfw_ci/kmcgill/mlperfv6.1/images/endpoint_client_bbc86973_pr372.sqsh"
  env:
    PYTHONNOUSERSITE: "1"
    MODEL_DIR: "/model"
    PATH: "/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    TIKTOKEN_RS_CACHE_DIR: "/work/.tiktoken_rs_cache"
    HF_HOME: "/work/.hf_cache"
  command: |
    set -euo pipefail
    CONFIG=/work/client_submission-online.yaml
    RESOLVED=/logs/endpoint_resolved.yaml
    mkdir -p /logs/report
    /opt/venv/bin/python3 - "$CONFIG" "$RESOLVED" << 'PYEOF'
    import yaml, sys, os
    cfg = yaml.safe_load(open(sys.argv[1]))
    with open("/logs/frontend_urls.txt") as _f:
        _urls = [l.strip() for l in _f if l.strip()]
    cfg["endpoint_config"]["endpoints"] = _urls
    cfg["model_params"]["tokenizer_name"] = os.environ.get("MODEL_DIR", "/model")
    cfg["model_params"]["name"] = "models--centml--DeepSeek-R1-NVFP4-v2-mlpinf-flatten"
    cfg["report_dir"] = "/logs/report"
    cfg["datasets"] = [d for d in cfg.get("datasets", []) if d.get("type") != "accuracy"]
    cfg.setdefault("settings", {}).setdefault("drain", {})["performance_timeout_s"] = None
    yaml.dump(cfg, open(sys.argv[2], "w"), default_flow_style=False)
    PYEOF
    echo "[endpoint-resolve] Wrote resolved config to $RESOLVED"
    /opt/venv/bin/inference-endpoint benchmark from-config -c "$RESOLVED" --mode perf

container_mounts:
  "/lustre/fsw/core_dlfw_ci/rihuo/mlperf": "/work"
  "/lustre/fsw/core_dlfw_ci/rihuo/endpoints-launch": "/endpoints-launch-mount"

# Pin memory clocks on every allocated node before workers start.
sbatch_pre_sweep: |
  srun --overlap --jobid=$SLURM_JOB_ID --nodes=$SLURM_NNODES --ntasks-per-node=1 --cpu-bind=none \
    bash -c 'for i in 1 2 3 4 5 6; do sudo -n nvidia-smi -lmc 4752,4752 2>&1|head -1; sleep 5; done' || true

# Restore default memory clocks on EXIT (fires on success, failure, and cancellation).
sbatch_post_sweep: |
  srun --overlap --jobid=$SLURM_JOB_ID --nodes=$SLURM_NNODES --ntasks-per-node=1 --cpu-bind=none \
    bash -c 'for i in 1 2 3; do sudo -n nvidia-smi -lmc 3186,4752 2>&1|head -1; sleep 3; done' || true

frontend:
  type: "dynamo"
  enable_multiple_frontends: true
  use_nginx: false
  num_additional_frontends: 7  # 8 total; round-robin across worker nodes with per-node port offsets (8000, 8001, …)
  args:
    admission-control: "none"
  env:
    ETCD_LEASE_TTL: '120'
    DYN_TOKENIZER: "fastokens"

setup_script: "install_dynamo_wheel.sh"

extra_mount:
  - /lustre/fsw/core_dlfw_ci/rihuo/dynamo_wheels:/dynamo_wheels

health_check:
  max_attempts: 540
  interval_seconds: 10

dynamo:
  install: false

infra:
  etcd_nats_dedicated_node: false
