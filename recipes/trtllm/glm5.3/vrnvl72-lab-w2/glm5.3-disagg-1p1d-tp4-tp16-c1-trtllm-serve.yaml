#
# GLM-5.3 Vera Rubin pareto01 on native trtllm-serve; adapted from the GLM-5.2 BTK e2e_pareto recipe (wave 2).
# Same workers as glm5.3-disagg-1p1d-tp4-tp16-c1.yaml, fronted by `trtllm-serve disaggregated`
# with BTK's conversation routers and server_config instead of Dynamo.
# Model and image paths are explicit; configure cluster settings in srtslurm.yaml.
# MTP forced acceptance follows acceptance_length.json: AL(depth) - 1.

schema: 2
name: glm5.3-disagg-1p1d-tp4-tp16-c1-trtllm-serve
model:
  path: /home/rihuo/GLM-5.3-NVFP4
  container: /home/rihuo/tensorrt-llm-arm64-rubin-glm5-4bad965-feat_rubin-glm5-mega-30454-mooncake-cuda13-0.3.14.dev20261021-glm53mk.sqsh
  precision: nvfp4
resources:
  gpu_type: vrnvl72
  gpus_per_node: 4
  het_jobs: false
environment:
  # The image's /etc/environment points pip at urm.nvidia.com, which RapLab cannot resolve.
  PIP_CONFIG_FILE: /dev/null
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_EXTRA_INDEX_URL: https://pypi.nvidia.com
observability:
  enable_otel: false
reuse_container: true
frontend:
  type: trtllm_serve
  placement:
    node: dedicated
  enable_multiple_frontends: false
  # BTK trtllm_disagg: server_timeout 45 min (-t is seconds), request_timeout 3600 s.
  args:
    server_start_timeout: 2700
    request_timeout: 3600
  ctx_router:
    type: conversation
  gen_router:
    type: conversation
  server_config_extra:
    backend: pytorch
    gen_strip_message_history: true
    gen_tokids_ctxbytes: true
    perf_metrics_max_requests: 100000
    return_perf_metrics: true
    server_keep_alive_timeout: 3600
engine:
  type: trtllm
  served_model_name: GLM-5.3
  numa_memory_bind: local
  numa_cpu_bind: true
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 4
    env:
      FLASHINFER_CACHE_DIR: /home/rihuo/flashinfer-1016
      FLASHINFER_WORKSPACE_BASE: /home/rihuo/flashinfer-1016
      CUDA_DISABLE_IOMMU_ACS_P2P_CAPABILITY_CHECK: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_HUB_OFFLINE: '1'
      MIMALLOC_PURGE_DELAY: '0'
      NCCL_GRAPH_MIXING_SUPPORT: '0'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TLLM_ADP_ROUTER_MATCH_RATE_THRESHOLD: '0.10'
      TLLM_ADP_TOKEN_AWARE_PLACEMENT: '1'
      TLLM_LOG_LEVEL: INFO
      TLLM_PREFIX_TOKEN_CACHE: '1'
      TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '2.91'
      TQDM_DISABLE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TRTLLM_DSA_INDEXER_BF16: '1'
      TRTLLM_DSA_KV_NORM_PACK: '1'
      TRTLLM_ENABLE_PDL: '1'
      TRTLLM_FUSED_DSA_METADATA: '1'
      TRTLLM_KVCACHE_RECV_BUFFER_COUNT: '1'
      TRTLLM_KVCACHE_SEND_BUFFER_COUNT: '1'
      TRTLLM_KV_CACHE_TRANSFER_TIMEOUT_SEC: '600'
      TRTLLM_MLA_CTX_Q_GRID: '1'
      TRTLLM_SERVER_DISABLE_GC: '1'
      TRTLLM_WORKER_DISABLE_GC: '1'
      UCX_CUDA_IPC_ENABLE_MNNVL: y
      UCX_LOG_LEVEL: info
      UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_5:1,mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_11:1
      UCX_PROTO_INFO: y
      MPI_UCX_TLS: rc,ud,sm,self
      MPI_UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_5:1,mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_11:1
      NCCL_IB_HCA: '=mlx5_0::0:0,mlx5_1::1:0,mlx5_2::2:0,mlx5_5::3:0,mlx5_6::0:1,mlx5_7::1:1,mlx5_8::2:1,mlx5_11::3:1'
      NCCL_NVLINK_UTIL_CENTRIC_SCHED_ENABLE: '0'
      UCX_RNDV_SCHEME: put_zcopy
      UCX_TLS: all
      PYTHONUNBUFFERED: '1'
      TLLM_EXECUTOR_BATCH_RESP_IN_AWAIT: '1'
      TLLM_EXECUTOR_USE_FILE_SOCKET: '1'
    extra_args: ["--tool_parser", "glm47"]
    args:
      enable_iter_perf_stats: true
      iter_perf_stats_interval: 40
      backend: pytorch
      cache_transceiver_config:
        backend: NIXL
        kv_cache_bounce_size_mb: 5120
        kv_transfer_timeout_ms: 600000
        max_tokens_in_buffer: 1048576
        transceiver_runtime: PYTHON
      speculative_config:
        decoding_type: MTP
        num_nextn_predict_layers: 7
      disable_overlap_scheduler: false
      enable_attention_dp: true
      kv_cache_config:
        iteration_stats_interval: 40
        enable_block_reuse: true
        host_cache_size: 257698037760
        dtype: fp8
        free_gpu_memory_fraction: 0.75
        tokens_per_block: 64
        event_buffer_max_size: 0
      enable_chunked_prefill: true
      attention_dp_config:
        enable_kv_cache_aware_routing: false
        kv_cache_routing_conversation_affinity: true
        kv_cache_routing_max_sessions: 65536
      max_batch_size: 256
      max_num_tokens: 8192
      num_postprocess_workers: 8
      max_seq_len: 1048576
      moe_config:
        backend: CUTEDSL
      moe_expert_parallel_size: 4
      pipeline_parallel_size: 1
      print_iter_log: true
      sparse_attention_config:
        algorithm: dsa
        enable_heuristic_topk: true
      tensor_parallel_size: 4
      trust_remote_code: true
      scheduler_config:
        capacity_scheduler_policy: MAX_UTILIZATION
      perf_metrics_max_requests: 100000
      return_perf_metrics: true
      cuda_graph_config: null
  decode:
    nodes: 4
    workers: 1
    gpus: 16
    env:
      FLASHINFER_CACHE_DIR: /home/rihuo/flashinfer-1016
      FLASHINFER_WORKSPACE_BASE: /home/rihuo/flashinfer-1016
      CUDA_DISABLE_IOMMU_ACS_P2P_CAPABILITY_CHECK: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_HUB_OFFLINE: '1'
      MIMALLOC_PURGE_DELAY: '0'
      NCCL_GRAPH_MIXING_SUPPORT: '0'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TLLM_ADP_ROUTER_MATCH_RATE_THRESHOLD: '0.10'
      TLLM_LOG_LEVEL: INFO
      TLLM_PREFIX_TOKEN_CACHE: '1'
      TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '2.91'
      TQDM_DISABLE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TRTLLM_DSA_INDEXER_BF16: '1'
      TRTLLM_DSA_KV_NORM_PACK: '1'
      TRTLLM_DSA_LOGITS_FULL_QUERY: '1'
      TRTLLM_ENABLE_PDL: '1'
      TRTLLM_FUSED_DSA_METADATA: '1'
      TRTLLM_GLM5_MEGAKERNEL: '1'
      TRTLLM_KVCACHE_RECV_BUFFER_COUNT: '1'
      TRTLLM_KVCACHE_SEND_BUFFER_COUNT: '1'
      TRTLLM_KV_CACHE_TRANSFER_TIMEOUT_SEC: '600'
      TRTLLM_LOW_M_GEMM_BACKEND: splitk_default
      TRTLLM_MLA_CTX_Q_GRID: '1'
      TRTLLM_MOE_FINALIZE_CTA1: '1'
      TRTLLM_PRE_MOE_FP4_LINEAR_FUSION: '1'
      TRTLLM_SERVER_DISABLE_GC: '1'
      TRTLLM_WORKER_DISABLE_GC: '1'
      UCX_CUDA_IPC_ENABLE_MNNVL: y
      UCX_LOG_LEVEL: info
      UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_5:1,mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_11:1
      UCX_PROTO_INFO: y
      MPI_UCX_TLS: rc,ud,sm,self
      MPI_UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_5:1,mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_11:1
      NCCL_IB_HCA: '=mlx5_0::0:0,mlx5_1::1:0,mlx5_2::2:0,mlx5_5::3:0,mlx5_6::0:1,mlx5_7::1:1,mlx5_8::2:1,mlx5_11::3:1'
      NCCL_NVLINK_UTIL_CENTRIC_SCHED_ENABLE: '0'
      UCX_RNDV_SCHEME: put_zcopy
      UCX_TLS: all
      PYTHONUNBUFFERED: '1'
      TLLM_EXECUTOR_BATCH_RESP_IN_AWAIT: '1'
      TLLM_EXECUTOR_USE_FILE_SOCKET: '1'
    extra_args: ["--tool_parser", "glm47"]
    args:
      enable_iter_perf_stats: true
      iter_perf_stats_interval: 40
      backend: pytorch
      cache_transceiver_config:
        backend: NIXL
        kv_cache_bounce_size_mb: 5120
        kv_transfer_timeout_ms: 600000
        max_tokens_in_buffer: 1048576
        transceiver_runtime: PYTHON
      cuda_graph_config:
        batch_sizes:
        - 1
        enable_padding: true
      speculative_config:
        decoding_type: MTP
        max_draft_len: 7
      enable_attention_dp: false
      kv_cache_config:
        iteration_stats_interval: 40
        enable_block_reuse: false
        host_cache_size: 0
        dtype: fp8
        free_gpu_memory_fraction: 0.8
        tokens_per_block: 64
        event_buffer_max_size: 0
      max_batch_size: 1
      max_num_tokens: 128
      num_postprocess_workers: 4
      max_seq_len: 1048576
      moe_config:
        backend: TRTLLM
        use_low_precision_moe_combine: true
      moe_expert_parallel_size: 1
      pipeline_parallel_size: 1
      print_iter_log: true
      sparse_attention_config:
        algorithm: dsa
        enable_heuristic_topk: true
        use_cute_dsl_paged_mqa_logits: true
      stream_interval: 20
      tensor_parallel_size: 16
      trust_remote_code: true
      perf_metrics_max_requests: 100000
      return_perf_metrics: true
      scheduler_config:
        capacity_scheduler_policy: GUARANTEED_NO_EVICT
services:
- name: otel-collector
  type: otel-collector
  enabled: false
extra_mount:
- /home/rihuo/:/home/rihuo/
benchmark:
  type: custom
  placement:
    node: dedicated
  command: |
    set -euo pipefail
    export OPENAI_API_KEY="${OPENAI_API_KEY:-EMPTY}"
    aiperf_venv=$(mktemp -d /tmp/srt-pareto-aiperf-XXXXXX)
    trap 'rm -rf "$aiperf_venv"' EXIT
    python3 -m venv "$aiperf_venv"
    "$aiperf_venv/bin/python" -m pip install \
      "/home/rihuo/agentx-harness"
    IFS=',' read -r -a worker_metrics_urls <<< "${AIPERF_SERVER_METRICS_URLS:?Worker metrics URLs were not provided}"
    ulimit -n 600000 2>/dev/null || ulimit -n 65536 2>/dev/null || true
    "$aiperf_venv/bin/aiperf" profile \
        --scenario inferencex-agentx-mvp \
        --server-metrics "${worker_metrics_urls[@]}" \
        --server-metrics-formats json csv parquet jsonl \
        --url "http://$SRT_FRONTEND_HOST:$SRT_FRONTEND_PORT" \
        --endpoint /v1/chat/completions \
        --endpoint-type chat \
        --model "$MODEL" \
        --tokenizer "${TOKENIZER:-/model}" \
        --streaming \
        --concurrency "$CONC" \
        --benchmark-duration 3600 \
        --public-dataset semianalysis_cc_traces_weka_062126 \
        --num-dataset-entries 393 \
        --failed-request-threshold 0.1 \
        --max-context-length 1048576 \
        --random-seed 42 \
        --trajectory-start-min-ratio 0.25 \
        --trajectory-start-max-ratio 0.75 \
        --use-server-token-count \
        --no-gpu-telemetry \
        --tokenizer-trust-remote-code \
        --slice-duration 1.0 \
        --warmup-requests-per-lane 10 \
        --warmup-grace-period 1800 \
        --stats-interval 30 \
        --trace-idle-gap-cap-seconds 300 \
        --output-artifact-dir /logs/agentic/aiperf_results
  env:
    MODEL: GLM-5.3
    TOKENIZER: /model
    AIPERF_DATASET_WEKA_LIVE_ASSISTANT_RESPONSES: '0'
    AIPERF_DATASET_CONFIGURATION_TIMEOUT: '1800'
    AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT: '1800'
    CONC: '1'
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
    AIPERF_HTTP_X_SESSION_ID_FROM_CORRELATION_ID: 'true'
    AIPERF_DATASET_MMAP_CACHE_DIR: /tmp/aiperf-mmap-cache
    AIPERF_UI_REALTIME_METRICS_ENABLED: 'true'
    HF_HUB_DISABLE_PROGRESS_BARS: '1'
    TQDM_DISABLE: '1'
