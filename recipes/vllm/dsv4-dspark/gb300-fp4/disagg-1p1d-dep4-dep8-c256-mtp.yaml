schema: 2
name: "svf-vllm-disagg-gb300-1p1d-dep4-dep8-c256-mtp-agentic"

# GB300 AgentX MTP3 topology: one DEP4 prefill worker feeds one
# DEP8 decode worker at concurrency 256.

model:
  path: "/lustre/fsw/coreai_comparch_inferencex/rihuo/DeepSeek-V4-Pro-0813"
  container: "/lustre/fsw/coreai_comparch_inferencex/rihuo/vllm-openai-nightly-dev-arm64-cu13.0.1-591bb95.sqsh"
  precision: "fp4"

identity:
  model:
    repo: "deepseek-ai/DeepSeek-V4-Pro-0813"
  container:
    image: "/lustre/fsw/coreai_comparch_inferencex/rihuo/vllm-openai-nightly-dev-arm64-cu13.0.1-591bb95.sqsh"
  frameworks:
    dynamo: "1.5.0"

dynamo:
  install: false

extra_mount:
  - "/lustre:/lustre"
  - "/lustre/fsw/coreai_comparch_inferencex/rihuo/dynamo_wheels:/dynamo_wheels"
setup_script: vllm-container-deps-dynamo-wheel-and-fullgraph-patch.sh

slurm:
  time_limit: "4:00:00"

health_check:
  max_attempts: 2160
  interval_seconds: 10

resources:
  gpu_type: "gb300"
  gpus_per_node: 4
  het_jobs: false
  spread_workers: false
services:
  - name: etcd
    type: etcd
    placement:
      node: dedicated
  - name: mooncake-master
    type: mooncake-master
    options:
      store_config:
        metadata_server: "P2PHANDSHAKE"
        global_segment_size: "140GB"
        local_buffer_size: "4GB"
        protocol: "rdma"
        device_name: "mlx5_0,mlx5_1,mlx5_2,mlx5_3"
        mode: "embedded"
        enable_offload: false
environment:
  # Mooncake prefix-block hashes must match across processes and nodes.
  PYTHONHASHSEED: "0"
  WITH_NVIDIA_PEERMEM: "0"

frontend:
  type: dynamo
  placement:
    node: dedicated
  enable_multiple_frontends: false
  env:
    ETCD_LEASE_TTL: '120'
    DYN_ROUTER_TEMPERATURE: '0'
    DYN_ROUTER_QUEUE_THRESHOLD: None
    DYN_TOKENIZER_CACHE: '1'
    DYN_TOKENIZER_CACHE_BYTES: '8000000000'
    DYN_TOKENIZER: fastokens
    DYN_TCP_REQUEST_TIMEOUT: '30'
    DYN_REQUEST_PLANE: tcp
    DYN_FRONTEND_ENABLE_KV_EVENTS: '0'
    DYN_LOGGING_JSONL: 'false'
    OTEL_EXPORT_ENABLED: 'false'
  args:
    router-mode: kv
    router-session-affinity-ttl-secs: '14400'
    active-decode-blocks-threshold: None
    active-prefill-tokens-threshold: None
    active-prefill-tokens-threshold-frac: None
engine:
  type: vllm
  connector:
  dp_launch_mode: per_node
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 4
    env:
      HF_HUB_CACHE: "/lustre/fsw/coreai_comparch_inferencex/rihuo/hf_cache"
      HUGGINGFACE_HUB_CACHE: "/lustre/fsw/coreai_comparch_inferencex/rihuo/hf_cache"
      TRANSFORMERS_CACHE: "/lustre/fsw/coreai_comparch_inferencex/rihuo/hf_cache"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      VLLM_RPC_TIMEOUT: "600000"
      VLLM_LOG_STATS_INTERVAL: "1"
      VLLM_FLOAT32_MATMUL_PRECISION: "high"
      VLLM_V2_WARMUP_MAX_NUM_SEQS: "20"
      VLLM_SERVER_DEV_MODE: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_MOONCAKE_LOAD_RECV_THREADS: "20"
      VLLM_MOONCAKE_STORE_SEND_THREADS: "8"
      VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
      UCX_MEMTYPE_CACHE: "n"
      UCX_NET_DEVICES: "mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1"
      UCX_TLS: "rc,cuda_copy"
      NCCL_CUMEM_ENABLE: "1"
      NCCL_MNNVL_ENABLE: "1"
      NCCL_NVLS_ENABLE: "1"
      NCCL_IB_HCA: "mlx5_0,mlx5_1,mlx5_2,mlx5_3"
      VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "32768"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
      VLLM_CONNECTOR_PREFETCH_DEPTH: "0"
      VLLM_DSV4_MEGA_FP8_COMBINE: "1"
      DG_JIT_CACHE_DIR: "/tmp/dg-cache-dsv4-gb300-1p1d-dep4-prefill-c256-{job_id}"
      MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
      MC_SLICE_SIZE: "1048576"
      MC_WORKERS_PER_CTX: "4"
      MC_STORE_CLIENT_METRIC: "1"
      MC_STORE_CLIENT_METRIC_INTERVAL: "5"
      MC_TE_METRIC: "0"
    args:
      kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
      served-model-name: "DeepSeek-V4-Pro-0813"
      safetensors-load-strategy: "lazy"
      kv-cache-dtype: "fp8"
      tensor-parallel-size: 1
      pipeline-parallel-size: 1
      data-parallel-size: 4
      data-parallel-rpc-port: 13345
      enable-cumem-allocator: true
      enable-expert-parallel: true
      enable-ep-weight-filter: true
      max-model-len: 1048576
      max-num-seqs: 64
      max-num-batched-tokens: 8192
      long-prefill-token-threshold: 1024
      trust-remote-code: true
      no-enable-flashinfer-autotune: true
      block-size: 256
      gpu-memory-utilization: 0.90
      no-disable-hybrid-kv-cache-manager: true
      tokenizer-mode: "deepseek_v4"
      attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"indexer_kv_dtype":"mxfp4"}'
      speculative-config: '{"method":"dspark","num_speculative_tokens":6,"draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":3.77}'
      moe-backend: "deep_gemm_amxf4_mega_moe"
      numa-bind: true
      numa-bind-nodes: [0, 0, 1, 1]
  decode:
    nodes: 2
    workers: 1
    gpus: 8

    env:
      HF_HUB_CACHE: "/lustre/fsw/coreai_comparch_inferencex/rihuo/hf_cache"
      HUGGINGFACE_HUB_CACHE: "/lustre/fsw/coreai_comparch_inferencex/rihuo/hf_cache"
      TRANSFORMERS_CACHE: "/lustre/fsw/coreai_comparch_inferencex/rihuo/hf_cache"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      VLLM_RPC_TIMEOUT: "600000"
      VLLM_LOG_STATS_INTERVAL: "1"
      VLLM_FLOAT32_MATMUL_PRECISION: "high"
      VLLM_V2_WARMUP_MAX_NUM_SEQS: "64"
      VLLM_SERVER_DEV_MODE: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_MOONCAKE_LOAD_RECV_THREADS: "20"
      VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
      UCX_MEMTYPE_CACHE: "n"
      UCX_NET_DEVICES: "mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1"
      UCX_TLS: "rc,cuda_copy"
      NCCL_CUMEM_ENABLE: "1"
      NCCL_MNNVL_ENABLE: "1"
      NCCL_NVLS_ENABLE: "1"
      NCCL_IB_HCA: "mlx5_0,mlx5_1,mlx5_2,mlx5_3"
      VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "0"
      VLLM_DSV4_MEGA_FP8_COMBINE: "1"
      DG_JIT_CACHE_DIR: "/tmp/dg-cache-dsv4-gb300-1p1d-dep8-decode-c256-{job_id}"
      MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
      MC_SLICE_SIZE: "1048576"
      MC_WORKERS_PER_CTX: "4"
      MC_STORE_CLIENT_METRIC: "1"
      MC_STORE_CLIENT_METRIC_INTERVAL: "5"
      MC_TE_METRIC: "0"

    args:
      router-mode: least-loaded
      kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"load_async":true,"lookup_async":false,"enable_lookup":false,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
      served-model-name: "DeepSeek-V4-Pro-0813"
      safetensors-load-strategy: "lazy"
      kv-cache-dtype: "fp8"
      tensor-parallel-size: 1
      pipeline-parallel-size: 1
      data-parallel-size: 8
      data-parallel-rpc-port: 13345
      enable-cumem-allocator: true
      enable-expert-parallel: true
      enable-ep-weight-filter: true
      max-model-len: 1048576
      max-num-seqs: 64
      max-num-batched-tokens: 448
      trust-remote-code: true
      no-enable-flashinfer-autotune: true
      block-size: 256
      compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[7,14,21,28,35,42,49,56,63,70,77,84,91,98,105,112,119,126,133,140,147,154,161,168,175,182,189,196,203,210,217,224,231,238,245,252,259,266,273,280,287,294,301,308,315,322,329,336,343,350,357,364,371,378,385,392,399,406,413,420,427,434,441,448],"mode":0}'
      max-cudagraph-capture-size: 448
      gpu-memory-utilization: 0.90
      stream-interval: 32
      no-disable-hybrid-kv-cache-manager: true
      tokenizer-mode: "deepseek_v4"
      attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"indexer_kv_dtype":"mxfp4"}'
      speculative-config: '{"method":"dspark","num_speculative_tokens":6,"draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":3.77}'
      moe-backend: "deep_gemm_amxf4_mega_moe"
      numa-bind: true
      numa-bind-nodes: [0, 0, 1, 1]
sbatch_directives:
  mem: "0"

srun_options:
  container-remap-root: ""
  cpu-bind: "none"

benchmark:
  type: custom
  client_placement: last_decode
  env:
    AIPERF_REF: file:///lustre/fsw/coreai_comparch_inferencex/rihuo/agentx-harness
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
    AIPERF_DATASET_MMAP_CACHE_DIR: /lustre/fsw/coreai_comparch_inferencex/rihuo/aiperf_mmap_cache
    AIPERF_DATASET_CONFIGURATION_TIMEOUT: '1800'
    AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT: '1800'
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
    HF_HUB_CACHE: "/lustre/fsw/coreai_comparch_inferencex/rihuo/hf_cache"
  command: |
    set -euo pipefail
    AIPERF_VENV="${TMPDIR:-/tmp}/agentx-aiperf-${SLURM_JOB_ID:-$$}"
    if [ ! -x "$AIPERF_VENV/bin/aiperf" ]; then
      python3 -m venv "$AIPERF_VENV"
      "$AIPERF_VENV/bin/pip" install -q --upgrade pip
      "$AIPERF_VENV/bin/pip" install -q "aiperf @ $AIPERF_REF" "datasets>=4.7.0" "huggingface_hub[cli]>=0.25.0"
    fi
    ARTIFACT_DIR="/logs/agentic/conc_256/aiperf_artifacts"
    mkdir -p "$ARTIFACT_DIR"
    "$AIPERF_VENV/bin/aiperf" profile --scenario inferencex-agentx-mvp \
      --url "http://$SRT_FRONTEND_HOST:$SRT_FRONTEND_PORT" \
      --endpoint /v1/chat/completions --endpoint-type chat --streaming \
      -m DeepSeek-V4-Pro-0813 --tokenizer-trust-remote-code \
      --tokenizer /model \
      --public-dataset semianalysis_cc_traces_weka_062126 \
      --trajectory-start-min-ratio 0.25 --trajectory-start-max-ratio 0.75 \
      --trace-idle-gap-cap-seconds 300 --warmup-requests-per-lane 10 \
      --warmup-grace-period 1800 --num-dataset-entries 393 \
      --slice-duration 1.0 --stats-interval 30 --use-server-token-count \
      --no-gpu-telemetry --random-seed 42 --failed-request-threshold 0.1 \
      --benchmark-duration 3600 --concurrency 256 \
      --output-artifact-dir "$ARTIFACT_DIR"
