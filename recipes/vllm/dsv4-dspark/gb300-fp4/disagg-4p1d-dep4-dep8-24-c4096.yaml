schema: 2
name: "svf-vllm-disagg-gb300-4p1d-dep4-dep8-24-c4096-agentic"

# Agentic-coding variant of dsv4/vllm/gb300-fp4/8k1k/disagg-4p1d-dep4-dep8-24-c4096-stp.yaml.
# Max-throughput shape: 4 prefill (DEP=4 each) + 1 decode (DEP=8). 6 GB300
# nodes (4P + 2D = 24 GPUs at 4 GPUs/node) plus a dedicated NATS/etcd infra
# node. Sized for concurrency 4096 with deep_gemm_mega_moe on both workers.
#
# Divergence vs the 8k1k sibling:
#   - benchmark.type:        sa-bench -> custom (hands off to agentic_srt.sh)
#   - max-model-len:         removed (let vLLM derive from model config; agentic
#                              trajectories blow past any small explicit cap)
#   - no-enable-prefix-caching: dropped (prefix caching MUST be on for
#                              trajectory reuse — entire point of agentic)
# Note: --enable-auto-tool-choice / --tool-call-parser / --reasoning-parser
# are NOT set on the worker. The dynamo-vllm worker entrypoint doesn't
# accept them (different arg parser than `vllm serve`). In disagg, chat
# parsing happens at the dynamo frontend, not at the worker.

model:
  path: "/lustre/fsw/coreai_comparch_inferencex/rihuo/DeepSeek-V4-Pro-0813"
  container: "/lustre/fsw/coreai_comparch_inferencex/rihuo/vllm-openai-nightly-dev-arm64-cu13.0.1-591bb95.sqsh"
  precision: "fp4"

dynamo:
  install: false

extra_mount:
  - "/lustre:/lustre"
  - "/lustre/fsw/coreai_comparch_inferencex/rihuo/dynamo_wheels:/dynamo_wheels"
setup_script: vllm-container-deps-and-dynamo-wheel.sh

slurm:
  time_limit: "4:00:00"

health_check:
  max_attempts: 1440
  interval_seconds: 10

resources:
  gpu_type: "gb300"
  gpus_per_node: 4
services:
  - name: etcd
    type: etcd
    placement:
      node: dedicated
  - name: nats
    type: nats
    placement:
      node: dedicated
    options:
      max_payload_mb: 32
frontend:
  type: dynamo
  enable_multiple_frontends: false
  env:
    ETCD_LEASE_TTL: '120'
    DYN_ROUTER_TEMPERATURE: '0'
    DYN_ROUTER_QUEUE_THRESHOLD: None
    DYN_TOKENIZER_CACHE: '1'
    DYN_TOKENIZER_CACHE_BYTES: '8000000000'
    DYN_TOKENIZER: fastokens
    DYN_TCP_REQUEST_TIMEOUT: '30'
    DYN_REQUEST_PLANE: tcp
    DYN_FRONTEND_ENABLE_KV_EVENTS: '0'
    DYN_LOGGING_JSONL: 'false'
    OTEL_EXPORT_ENABLED: 'false'
  args:
    router-mode: kv
    router-session-affinity-ttl-secs: '14400'
    active-decode-blocks-threshold: None
    active-prefill-tokens-threshold: None
    active-prefill-tokens-threshold-frac: None
engine:
  type: vllm
  connector:

roles:
  prefill:
    nodes: 4
    workers: 4
    gpus: 4
    env:
      TILELANG_CLEANUP_TEMP_FILES: "1"
      VLLM_LOG_STATS_INTERVAL: "1"
      VLLM_USE_NCCL_SYMM_MEM: "1"
      NCCL_CUMEM_ENABLE: "1"
      NCCL_MNNVL_ENABLE: "1"
      NCCL_NVLS_ENABLE: "1"
      TORCH_SYMMMEM: "NVSHMEM"

    args:
      kv-transfer-config: '{"kv_connector": "NixlConnector", "kv_role": "kv_both"}'
      served-model-name: "DeepSeek-V4-Pro-0813"
      kv-cache-dtype: "fp8"
      tensor-parallel-size: 1
      pipeline-parallel-size: 1
      data-parallel-size: 4
      data-parallel-rpc-port: 13345
      enable-expert-parallel: true
      # enforce-eager: true
      # Inherited from fixed-sequence recipes; let vLLM select the scheduler
      # sequence limit until this is tuned explicitly for the agentic trace.
      # max-num-seqs: 16
      max-num-batched-tokens: 16384
      trust-remote-code: true
      no-enable-flashinfer-autotune: true
      safetensors-load-strategy: "prefetch"
      block-size: 256
      gpu-memory-utilization: 0.9
      no-disable-hybrid-kv-cache-manager: true
      tokenizer-mode: deepseek_v4
      enable-ep-weight-filter: true
      enable-sleep-mode: true
      moe-backend: "deep_gemm_mega_moe"

  decode:
    nodes: 2
    workers: 1
    gpus: 8

    env:
      TILELANG_CLEANUP_TEMP_FILES: "1"
      VLLM_LOG_STATS_INTERVAL: "1"
      VLLM_USE_NCCL_SYMM_MEM: "1"
      NCCL_CUMEM_ENABLE: "1"
      NCCL_MNNVL_ENABLE: "1"
      NCCL_NVLS_ENABLE: "1"
      TORCH_SYMMMEM: "NVSHMEM"

    args:
      kv-transfer-config: '{"kv_connector": "NixlConnector", "kv_role": "kv_both"}'
      served-model-name: "DeepSeek-V4-Pro-0813"
      kv-cache-dtype: "fp8"
      tensor-parallel-size: 1
      pipeline-parallel-size: 1
      data-parallel-size: 8
      data-parallel-rpc-port: 13345
      enable-expert-parallel: true
      # max-num-seqs: 512
      trust-remote-code: true
      block-size: 256
      compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","mode":0}'
      gpu-memory-utilization: 0.9
      stream-interval: 10
      no-disable-hybrid-kv-cache-manager: true
      tokenizer-mode: deepseek_v4
      enable-ep-weight-filter: true
      enable-sleep-mode: true
      moe-backend: "deep_gemm_mega_moe"

# sbatch + srun resource grants for clusters without per-GPU defaults.
#
# mem=0: allocate all available node memory (~868 GB on CW gb300). Without
# this, sbatch only requests ntasks × DefMemPerCPU = 8 × 4 GB = 32 GB for
# the whole job and worker cgroups OOM-kill mid model load (R7-R11 hit
# this; sacct showed AllocTRES mem=4G per step).
#
# cpus-per-task=72: give each task one CW gb300 NUMA socket (144 cores
# split 2 × 72). Critical for the *infra step* (etcd + nats) which
# srtctl spawns without --gres=gpu — on CW that means DefMemPerCPU
# applies and the step gets 1 CPU by default. With 24 dynamo DP ranks
# all hammering etcd for lease keep-alives, single-CPU etcd can't keep
# up and dies (R12 hit this; etcd reported max-cpu-set=1, leases
# deadline-exceeded, infra SIGKILL'd at 16:35:49). 72 CPUs is plenty
# for both etcd + nats AND for vLLM worker auxiliary threads.
#
# nv gb300 doesn't need this because cluster default DefCpuPerGPU=35
# auto-allocates 4*35=140 CPUs per GPU-bearing task; cw has no per-GPU
# default. Setting it here is safe on both because the value is ≤ node
# CPU count.
#
# srun_options.mem=0 forces each srun step to use the full node memory
# (without it, srun steps default back to cpus_per_task × DefMemPerCPU).
# Docs: docs/config-reference.md#sbatch_directives + #srun_options.
sbatch_directives:
  mem: "0"
  cpus-per-task: "72"
srun_options:
  mem: "0"
  # gb300-nv: pyxis maps the calling user (sa-shared) into the container as
  # uid 345200007. dpkg refuses to run without EUID 0 even though
  # ENROOT_ROOTFS_WRITABLE=1 makes the rootfs writable, so the agentic_srt
  # apt-get install git step fails. --container-remap-root asks pyxis to
  # remap us to uid 0 inside the container. srt-slurm renders empty-string
  # values as flag-only srun args (see core/slurm.py:250).
  container-remap-root: ""

benchmark:
  type: custom
  client_placement: last_decode
  env:
    AIPERF_REF: file:///lustre/fsw/coreai_comparch_inferencex/rihuo/agentx-harness
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
    AIPERF_DATASET_MMAP_CACHE_DIR: /lustre/fsw/coreai_comparch_inferencex/rihuo/aiperf_mmap_cache
    AIPERF_DATASET_CONFIGURATION_TIMEOUT: '1800'
    AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT: '1800'
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
    HF_HUB_CACHE: "/lustre/fsw/coreai_comparch_inferencex/rihuo/hf_cache"
  command: |
    set -euo pipefail
    AIPERF_VENV="${TMPDIR:-/tmp}/agentx-aiperf-${SLURM_JOB_ID:-$$}"
    if [ ! -x "$AIPERF_VENV/bin/aiperf" ]; then
      python3 -m venv "$AIPERF_VENV"
      "$AIPERF_VENV/bin/pip" install -q --upgrade pip
      "$AIPERF_VENV/bin/pip" install -q "aiperf @ $AIPERF_REF" "datasets>=4.7.0" "huggingface_hub[cli]>=0.25.0"
    fi
    ARTIFACT_DIR="/logs/agentic/conc_4096/aiperf_artifacts"
    mkdir -p "$ARTIFACT_DIR"
    "$AIPERF_VENV/bin/aiperf" profile --scenario inferencex-agentx-mvp \
      --url "http://$SRT_FRONTEND_HOST:$SRT_FRONTEND_PORT" \
      --endpoint /v1/chat/completions --endpoint-type chat --streaming \
      -m DeepSeek-V4-Pro-0813 --tokenizer-trust-remote-code \
      --tokenizer /model \
      --public-dataset semianalysis_cc_traces_weka_062126 \
      --trajectory-start-min-ratio 0.25 --trajectory-start-max-ratio 0.75 \
      --trace-idle-gap-cap-seconds 300 --warmup-requests-per-lane 10 \
      --warmup-grace-period 1800 --num-dataset-entries 393 \
      --slice-duration 1.0 --stats-interval 30 --use-server-token-count \
      --no-gpu-telemetry --random-seed 42 --failed-request-threshold 0.1 \
      --benchmark-duration 3600 --concurrency 4096 \
      --output-artifact-dir "$ARTIFACT_DIR"
