base:
  name: gb300-fp4-glm5.2-agentx
  model:
    path: glm-5.2-fp4
    container: nightly-20260805
    precision: fp4
  identity:
    model:
      repo: nvidia/GLM-5.2-NVFP4
      revision: main
    frameworks:
      dynamo: 1.2.1
      sglang: nightly-dev-cu13-20260703-75cdaf43
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  frontend:
    type: dynamo
    nginx_session_affinity: true
    nginx_session_affinity_header: X-Dynamo-Session-ID
    enable_multiple_frontends: true
    env:
      PIP_BREAK_SYSTEM_PACKAGES: '1'
    args:
      router-mode: kv
      router-session-affinity-ttl-secs: '3600'
      active-decode-blocks-threshold: None
      active-prefill-tokens-threshold: None
      active-prefill-tokens-threshold-frac: None
  dynamo:
    hash: 71eb001e17fa73c742f0afe1a6ed96836cb135fd
    install: true
  backend:
    type: sglang
    prefill_environment:
      TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '1800'
      PYTHONUNBUFFERED: '1'
      DYN_SKIP_SGLANG_LOG_FORMATTING: '1'
      SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: '100000'
      SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '100000'
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '100000'
      MC_TE_METRIC: 'true'
      MC_FORCE_MNNVL: '1'
      NCCL_MNNVL_ENABLE: '1'
      NCCL_CUMEM_ENABLE: '1'
      SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
      SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: '0'
      SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: '1'
      SGLANG_ENABLE_THINKING: '1'
      SGLANG_ENABLE_UNIFIED_RADIX_TREE: '1'
      SGLANG_HICACHE_DEBUG_LOG: '1'
      SGLANG_HICACHE_DEBUG_SAMPLE_RATE: '16384'
      SGLANG_REASONING_EFFORT: max
      PIP_BREAK_SYSTEM_PACKAGES: '1'
      UCX_TLS: cuda_copy,cuda_ipc,sm,self,tcp
      NVSHMEM_REMOTE_TRANSPORT: none
      SGLANG_DG_CACHE_DIR: /deepgemm_cache
      FLASHINFER_WORKSPACE_BASE: /flashinfer_cache
      SGLANG_SIMULATE_ACC_LEN: '2.5'
    decode_environment:
      TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: '1800'
      PYTHONUNBUFFERED: '1'
      DYN_SKIP_SGLANG_LOG_FORMATTING: '1'
      SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: '100000'
      SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '100000'
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '100000'
      MC_TE_METRIC: 'true'
      MC_FORCE_MNNVL: '1'
      NCCL_MNNVL_ENABLE: '1'
      NCCL_CUMEM_ENABLE: '1'
      SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
      SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: '0'
      SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: '1'
      SGLANG_DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK: '512'
      SGLANG_MOE_NVFP4_DISPATCH: '1'
      SGLANG_NVFP4_CKPT_FP8_NEXTN_MOE: '1'
      SGLANG_ENABLE_THINKING: '1'
      SGLANG_CLIP_MAX_NEW_TOKENS_ESTIMATION: '8'
      SGLANG_REASONING_EFFORT: max
      PIP_BREAK_SYSTEM_PACKAGES: '1'
      UCX_TLS: cuda_copy,cuda_ipc,sm,self,tcp
      NVSHMEM_REMOTE_TRANSPORT: none
      SGLANG_DG_CACHE_DIR: /deepgemm_cache
      FLASHINFER_WORKSPACE_BASE: /flashinfer_cache
      SGLANG_SIMULATE_ACC_LEN: '2.5'
      SGLANG_SIMULATE_ACC_METHOD: match-expected
      SGLANG_SIMULATE_ACC_TOKEN_MODE: real-draft-token
    sglang_config:
      prefill:
        served-model-name: GLM-5.2-FP4
        trust-remote-code: true
        quantization: modelopt_fp4
        kv-cache-dtype: fp8_e4m3
        disaggregation-mode: prefill
        disaggregation-transfer-backend: nixl
        tensor-parallel-size: 4
        data-parallel-size: 4
        expert-parallel-size: 4
        enable-dp-attention: true
        enable-dp-lm-head: true
        load-balance-method: total_tokens
        chunked-prefill-size: 65536
        max-prefill-tokens: 16384
        max-running-requests: 16
        cuda-graph-max-bs: 16
        disable-cuda-graph: true
        nsa-prefill-backend: trtllm
        nsa-decode-backend: trtllm
        moe-runner-backend: flashinfer_cutlass
        fp4-gemm-backend: flashinfer_cutlass
        enable-flashinfer-allreduce-fusion: true
        weight-loader-prefetch-checkpoints: true
        model-loader-extra-config: '{"enable_multithread_load": true}'
        mem-fraction-static: 0.8
        context-length: 1048576
        enable-hierarchical-cache: true
        hicache-write-policy: write_back
        hicache-size: 135
        hicache-io-backend: direct
        speculative-algorithm: EAGLE
        speculative-num-steps: 1
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 2
        enable-metrics: true
        enable-cache-report: true
      decode:
        served-model-name: GLM-5.2-FP4
        trust-remote-code: true
        quantization: modelopt_fp4
        kv-cache-dtype: fp8_e4m3
        disaggregation-mode: decode
        disaggregation-transfer-backend: nixl
        disable-radix-cache: true
        speculative-algorithm: EAGLE
        speculative-num-steps: 2
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 3
        tensor-parallel-size: 4
        data-parallel-size: 1
        expert-parallel-size: 1
        enable-dp-attention: false
        enable-dp-lm-head: false
        max-running-requests: 16
        cuda-graph-max-bs: 16
        chunked-prefill-size: 64
        context-length: 1048576
        nsa-prefill-backend: trtllm
        nsa-decode-backend: trtllm
        moe-runner-backend: flashinfer_trtllm
        fp4-gemm-backend: flashinfer_cutlass
        skip-tokenizer-init: true
        stream-interval: 30
        enable-flashinfer-allreduce-fusion: true
        weight-loader-prefetch-checkpoints: true
        model-loader-extra-config: '{"enable_multithread_load": true}'
        mem-fraction-static: 0.9
        disaggregation-decode-extra-slots: 0
        enable-metrics: true
        enable-cache-report: true
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  benchmark:
    type: custom
    env:
      CONCURRENCY: '48'
      DURATION: '3600'
      AIPERF_HF_HOME: /hf_home
      HF_HOME: /hf_home
      HF_HUB_CACHE: /hf_home/hub
      HF_DATASETS_CACHE: /hf_home/datasets
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      HF_HUB_DISABLE_XET: '1'
      XDG_CACHE_HOME: /tmp/cache
      AIPERF_DATASET_MMAP_CACHE_DIR: /hf_home/mmap_cache
      AIPERF_DATASET_CONFIGURATION_TIMEOUT: '1800'
      AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT: '1800'
      AIPERF_FAILED_REQUEST_THRESHOLD: '0.1'
      AIPERF_RECORD_STRIP_PAYLOAD_BYTES: 'true'
      AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: 'true'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
    command: "set -euo pipefail\nexport HF_HOME=\"${AIPERF_HF_HOME:-/hf_home}\"\nexport HF_HUB_CACHE=\"${HF_HOME}/hub\"\nexport HF_DATASETS_CACHE=\"${HF_HOME}/datasets\"\nmkdir -p \"${XDG_CACHE_HOME}\" \"${AIPERF_DATASET_MMAP_CACHE_DIR}\" /logs/aiperf\n/aiperf-venv/bin/aiperf profile \\\n        --scenario inferencex-agentx-mvp \\\n        --url http://localhost:8000 \\\n        --endpoint /v1/chat/completions \\\n        --endpoint-type chat \\\n        --streaming \\\n        --model GLM-5.2-FP4 \\\n        --tokenizer /model \\\n        --tokenizer-trust-remote-code \\\n        --concurrency \"${CONCURRENCY}\" \\\n        --benchmark-duration \"${DURATION}\" \\\n        --random-seed 42 \\\n        --failed-request-threshold \"${AIPERF_FAILED_REQUEST_THRESHOLD}\" \\\n        --stats-interval 30 \\\n        --warmup-requests-per-lane 10 \\\n        --warmup-grace-period 1800 \\\n        --trajectory-start-min-ratio 0.25 \\\n        --trajectory-start-max-ratio 0.75 \\\n        --use-server-token-count \\\n        --no-gpu-telemetry \\\n        --num-dataset-entries 393 \\\n        --slice-duration 1.0 \\\n        --public-dataset semianalysis_cc_traces_weka_062126 \\\n        --trace-idle-gap-cap-seconds 300 \\\n        --unsafe-override \\\n        --ui simple \\\n        --server-metrics-formats json \\\n        --output-artifact-dir /logs/aiperf\nrm -f /logs/aiperf/inputs.json\n"
  infra:
    etcd_nats_dedicated_node: false
    nats_max_payload_mb: 64
  sbatch_directives:
    mem: '0'
    cpus-per-task: '144'
  srun_options:
    mem: '0'
    container-remap-root: ''
# ################# agentx #################
zip_override_mtp_agentx_hightpt:
  name: [agentx-2p1d_dep16-c182]
  backend:
    sglang_config:
      decode:
        cuda-graph-max-bs: 144
        data-parallel-size: 16
        deepep-config: /configs/deepep_config.json
        deepep-mode: low_latency
        enable-dp-attention: true
        enable-dp-lm-head: true
        ep-dispatch-algorithm: static
        ep-num-redundant-experts: 0
        expert-parallel-size: 16
        max-running-requests: 144
        mem-fraction-static: 0.85
        moe-a2a-backend: deepep
        moe-dense-tp-size: 1
        moe-runner-backend: flashinfer_cutedsl
        speculative-moe-a2a-backend: deepep
        speculative-moe-runner-backend: deep_gemm
        tensor-parallel-size: 16
      prefill:
        data-parallel-size: 8
        expert-parallel-size: 8
        max-prefill-tokens: 8192
        tensor-parallel-size: 8
  benchmark:
    env:
      CONCURRENCY: '182'
  resources:
