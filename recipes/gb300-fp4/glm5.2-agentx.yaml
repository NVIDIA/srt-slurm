    prefill_workers: 2
zip_override_mtp_agentx_lowlat:
  name: [agentx-1p2d_tp4-c42, agentx-1p4d_tp4-c42, agentx-1p6d_tp4-c42]
  benchmark:
    env:
      CONCURRENCY: ['42', '42', '42']
  resources:
    decode_nodes: [2, 4, 6]
    decode_workers: [2, 4, 6]
    gpus_per_decode: 4
    gpus_per_prefill: 4
    prefill_nodes: 1
    prefill_workers: 1
