# Arm 1: raw experimental SGL router over two aggregate SGLang workers.
#
# The router owns tokenization, the radix cache, and the `cache_aware_zmq`
# policy. It learns each worker's ZMQ KV-event publisher from that worker's
# /server_info, so `backend.kv_events_config` is the whole event wiring.
# No Dynamo runtime is involved on this arm.
#
#   export ROUTER_ARM_MODEL_PATH=/absolute/path/to/Qwen3-32B-FP8
#   export ROUTER_ARM_SGLANG_SOURCE=/absolute/path/to/sglang
#   export ROUTER_ARM_TRACE=/absolute/path/to/agentx_trace.jsonl

name: router-arm1-sgl-router

model:
  path: $ROUTER_ARM_MODEL_PATH
  container: lmsysorg/sglang:dev
  precision: fp8

resources:
  gpu_type: h100
  gpus_per_node: 8
  agg_nodes: 1
  agg_workers: 2
  gpus_per_agg: 4

environment:
  SRTCTL_LOCAL_CONTAINER_IMAGE: lmsysorg/sglang:dev
  SRTCTL_SGLANG_SOURCE: $ROUTER_ARM_SGLANG_SOURCE
  SRTCTL_ETCD_PORT: "23379"
  SRTCTL_ETCD_PEER_PORT: "23380"
  SRTCTL_NATS_PORT: "25222"

# No Dynamo runtime on this arm.
dynamo:
  install: false

frontend:
  type: sgl-router
  enable_multiple_frontends: false
  # Built from source by both lifecycles; never a prebuilt binary.
  source: $ROUTER_ARM_SGLANG_SOURCE/experimental/sgl-router
  args:
    policy: cache_aware_zmq

backend:
  type: sglang
  kv_events_config:
    aggregated: true
  sglang_config:
    aggregated:
      served-model-name: Qwen/Qwen3-32B-FP8
      tensor-parallel-size: 4
      page-size: 64
      trust-remote-code: true
      mem-fraction-static: 0.85
      context-length: 40960
      max-running-requests: 64
      enable-metrics: true
      disable-piecewise-cuda-graph: true
      fp8-gemm-backend: triton

observability:
  # Dynamo request traces and spans have no source on this arm; observability
  # here is the router's and the workers' own /metrics, scraped by Tachometer.
  enabled: true
  tachometer:
    enabled: true

benchmark:
  type: custom
  command: |
    "$SRTCTL_RUTER_PYTHON" -m aiperf profile \
      --model Qwen/Qwen3-32B-FP8 \
      --tokenizer Qwen/Qwen3-32B-FP8 \
      --tokenizer-trust-remote-code \
      --url "$SRT_FRONTEND_URL" \
      --endpoint-type chat \
      --streaming \
      --input-file "$ROUTER_ARM_TRACE" \
      --custom-dataset-type mooncake_trace \
      --fixed-schedule \
      --fixed-schedule-auto-offset \
      --extra-inputs ignore_eos:true \
      --use-legacy-max-tokens \
      --request-timeout-seconds 900 \
      --output-artifact-dir "$AIPERF_ARTIFACT_DIR" \
      --profile-export-prefix agentx \
      --ui none \
      --no-server-metrics
