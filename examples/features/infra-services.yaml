# The discovery plane and the metrics exporters as services.
#
# Under the Dynamo frontend, etcd and NATS are implied: the job runs them on the
# infra node without a word in the recipe. With tachometer on (the default), the
# DCGM and node exporters it scrapes are implied on every worker node. Declaring
# a service by the implied name takes it over: here etcd and NATS move to a
# dedicated node (the job asks Slurm for one more) and NATS raises its payload
# limit. `srtctl dry-run` lists every service, marking the implied ones.
#
# Aliases (`qwen3-0.6b`, `sglang`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-infra-services"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "sglang"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
dynamo:
  source:
    pypi: "1.4.2"

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "kv"

engine: sglang
roles:
  agg:
    nodes: 1
    workers: 2
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      mem-fraction-static: 0.5
      context-length: 4096
      disable-piecewise-cuda-graph: true

services:
  - name: etcd
    type: etcd
    placement:
      node: dedicated       # reserve a node for the discovery plane (v1: infra.etcd_nats_dedicated_node)
  - name: nats
    type: nats
    placement:
      node: dedicated       # etcd and nats share the infra node, so both say dedicated
    options:
      max_payload_mb: 24    # v1: infra.nats_max_payload_mb
  # Point at a discovery plane that is already running instead of launching one:
  # - name: etcd
  #   type: etcd
  #   external: http://etcd.shared.example:2379
  #
  # Air-gapped cluster: pull the exporter images from a mirror (an alias from
  # srtslurm.yaml works here too), or switch one off.
  # - name: dcgm-exporter
  #   type: dcgm-exporter
  #   container: registry.local/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04
  # - name: node-exporter
  #   type: node-exporter
  #   enabled: false

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
