# Parameter sweep: one file, several jobs.
#
# `sweep:` lists values per parameter; every `{placeholder}` in the config is
# substituted and one job is submitted per combination (Cartesian product).
# This sweeps two concurrencies by two `max-running-requests` values = 4 jobs on
# the SGLang-router aggregated topology. Sweep mode is auto-detected.
#
#   srtctl dry-run -f examples/features/sweep.yaml   # preview all 4 jobs
#   srtctl apply   -f examples/features/sweep.yaml   # submit all 4 jobs
#
# Aliases (`qwen3-0.6b`, `sglang`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-sweep"

sweep:
  concurrency: [4, 8]
  max_running_requests: [16, 64]

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "sglang"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
frontend:
  type: sglang
  enable_multiple_frontends: false
  args:
    policy: "cache_aware"

engine: sglang
roles:
  agg:
    nodes: 1
    workers: 2
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      mem-fraction-static: 0.5
      context-length: 4096
      disable-piecewise-cuda-graph: true
      max-running-requests: "{max_running_requests}"

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "{concurrency}"
