# 1xTP2 prefill + 3xTP2 decode on two 4-GPU nodes.
# node1: prefill_0 on GPUs 0,1; decode_0 on GPUs 2,3.
# node2: decode_1 on GPUs 0,1; decode_2 on GPUs 2,3.
# The same resources setting works with every engine.
# Aliases resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: qwen3-0.6b-disagg-packing
slurm:
  time_limit: 00:30:00
model:
  path: qwen3-0.6b
  container: sglang
  precision: bf16
resources:
  gpu_type: gb300
  gpus_per_node: 4
  pack_prefill_decode: true
frontend:
  type: sglang-router
  enable_multiple_frontends: false
  args:
    policy: cache_aware
engine: sglang
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 2
    env:
      PYTHONUNBUFFERED: '1'
    args:
      served-model-name: Qwen/Qwen3-0.6B
      tensor-parallel-size: 2
      mem-fraction-static: 0.5
      context-length: 4096
      disable-piecewise-cuda-graph: true
  decode:
    nodes: 2
    workers: 3
    gpus: 2
    env:
      PYTHONUNBUFFERED: '1'
    args:
      served-model-name: Qwen/Qwen3-0.6B
      tensor-parallel-size: 2
      mem-fraction-static: 0.5
      context-length: 4096
      disable-piecewise-cuda-graph: true
benchmark:
  type: sa-bench
  isl: 128
  osl: 128
  concurrencies: 4x8
