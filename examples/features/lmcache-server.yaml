# An LMCache DRAM tier next to aggregated vLLM workers.
#
# `type: lmcache-server` runs the LMCache multiprocess server on every worker node
# before the workers start, on the ports srtctl owns (8750 RPC, 8751 HTTP), and holds
# the job until `GET /healthcheck` answers. `connector: lmcache-mp` points each vLLM
# worker's LMCacheMPConnector at the server on its own node. Everything after the
# ports is LMCache's own CLI: put `lmcache server --help` flags under `args`.
#
# The vLLM image must ship LMCache (the connector is imported inside the worker), so
# this uses a `vllm-lmcache` alias. Aliases (`qwen3-0.6b`, `vllm-lmcache`) resolve
# through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-vllm-lmcache-agg"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "vllm-lmcache"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
dynamo:
  source:
    pypi: "1.4.2"

environment:
  PYTHONHASHSEED: "0"        # chunk hashes must agree across the server and every rank

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "kv"

engine:
  type: vllm
  connector: lmcache-mp      # every role; or per role under roles.<role>.args.connector
roles:
  agg:
    nodes: 1
    workers: 2
    gpus: 1
    env:
      DYN_HEALTH_CHECK_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      gpu-memory-utilization: 0.5
      max-model-len: 4096

services:
  - name: lmcache
    type: lmcache-server
    # placement.node: workers (default) — one instance per worker node.
    # start: before_workers, critical: true (defaults): a dead server fails the run.
    args:                    # appended to `lmcache server --host ... --port 8750 --http-host ... --http-port 8751`
      - --l1-size-gb
      - "16"
      - --chunk-size
      - "256"
      - --max-workers
      - "2"
      - --eviction-policy
      - LRU
    preamble: |
      ulimit -l unlimited

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
