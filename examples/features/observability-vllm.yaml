# The observability preset on a vLLM worker behind the Dynamo frontend.
#
# `observability.enabled: true` wraps the frontend and every worker in nsys for the
# measured window, scrapes them with tachometer, and runs the DCGM, node and process
# exporters. On vLLM workers the preset sets VLLM_NVTX_SCOPES_FOR_PROFILING=1 (the
# scheduler's `schedule: *` and the model runner's `gpu_model_runner: *` ranges) and
# VLLM_WORKER_MULTIPROC_METHOD=spawn, so nsys follows the EngineCore and the two TP
# Worker processes. process-exporter groups those processes as vllm_engine_core and
# vllm_worker. See docs/profiling.md#observability-capture.
#
# Aliases (`qwen3-0.6b`, `vllm`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-vllm-observability"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "vllm"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
dynamo:
  source:
    pypi: "1.4.2"

observability:
  enabled: true

frontend:
  type: dynamo
  enable_multiple_frontends: false

engine: vllm
roles:
  agg:
    nodes: 1
    workers: 1
    gpus: 2
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 2
      gpu-memory-utilization: 0.5
      max-model-len: 4096

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
