# One aggregate SGLang attention-DP worker across two physical nodes.
# Node 0 serves inference; node 1's telemetry-only sidecar relays local KV events.
# Dynamo selects each sidecar's mode from its local engine metadata.
# The Dynamo KV router can select either global DP rank through the same worker.
#
# Restart all engines and sidecars together after failure. Independent sidecar
# restart/replay recovery is unsupported.

schema: 2
name: "qwen3-0.6b-sglang-sidecar-multinode-dp"

slurm:
  time_limit: "00:30:00"

model:
  path: "hf:Qwen/Qwen3-0.6B"
  container: "/path/to/sglang-dynamo-multinode-sidecar.sqsh"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 1

dynamo:
  install: false  # Dynamo is preinstalled in the image.
  request_plane: "nats"
  event_plane: "nats"

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "kv"

engine: sglang
roles:
  agg:
    nodes: 2
    workers: 1
    gpus: 2  # Global GPU count for this one distributed worker.
    sidecar: true
    kv_events: true
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 2
      data-parallel-size: 2
      enable-dp-attention: true
      page-size: 64
      context-length: 2048
      max-running-requests: 8
      mem-fraction-static: 0.3
      disable-cuda-graph: true

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 64
  concurrencies: "4"
