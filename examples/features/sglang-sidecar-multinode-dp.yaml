# One aggregate SGLang attention-DP worker across two physical nodes.
# Node 0 serves inference; node 1's telemetry-only sidecar relays local KV events.
# The Dynamo KV router can select either global DP rank through the same worker.
#
# Replace model.container with a custom image containing BOTH source fixes:
#   https://github.com/ai-dynamo/dynamo/pull/14908
#   Dynamo: 12ed73f0277d2c4d9c5a75d738dfcf2c4e101d36
#   https://github.com/sgl-project/sglang/pull/39659
#   SGLang: c50b251da8e455dfbb594f8c3b7ccae6eca72129
# Build/install the Dynamo runtime and SGLang native gRPC extension as well as
# their Python packages. A Python-only overlay is insufficient; srtctl defaults
# SGLANG_RUST_BUILD_MODE=never and loads the installed extension.
#
# Restart all engines and sidecars together after failure. Independent sidecar
# restart/replay recovery is unsupported.

schema: 2
name: "qwen3-0.6b-sglang-sidecar-multinode-dp"

slurm:
  time_limit: "00:30:00"

model:
  path: "hf:Qwen/Qwen3-0.6B"
  container: "/path/to/sglang-dynamo-multinode-sidecar.sqsh"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 1

dynamo:
  install: false  # The custom image supplies the pinned native and Python builds.
  request_plane: "nats"
  event_plane: "nats"

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "kv"

engine: sglang
roles:
  agg:
    nodes: 2
    workers: 1
    gpus: 2  # Global GPU count for this one distributed worker.
    sidecar: true
    kv_events: true
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 2
      data-parallel-size: 2
      enable-dp-attention: true
      page-size: 64
      context-length: 2048
      max-running-requests: 8
      mem-fraction-static: 0.3
      disable-cuda-graph: true

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 64
  concurrencies: "4"
