# Config overrides: one base config plus named variants in a single file.
#
#   override_*      one variant; its fields are deep-merged over `base`
#   zip_override_*  N variants; list-valued leaves are zipped in parallel
#
#   srtctl apply -f examples/features/override.yaml                        # every variant (base excluded)
#   srtctl apply -f examples/features/override.yaml:base                   # base only
#   srtctl apply -f examples/features/override.yaml:override_tp2           # one variant
#   srtctl apply -f examples/features/override.yaml:zip_override_context   # both zipped variants
#   srtctl apply -f examples/features/override.yaml:zip_override_context[1]
#   srtctl dry-run -f examples/features/override.yaml
#
# Aliases (`qwen3-0.6b`, `sglang`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
base:
  name: "qwen3-0.6b-override"

  slurm:
    time_limit: "00:30:00"

  model:
    path: "qwen3-0.6b"
    container: "sglang"
    precision: "bf16"

  resources:
    gpu_type: "h100"
    gpus_per_node: 8
  frontend:
    type: sglang-router
    enable_multiple_frontends: false
    args:
      policy: "cache_aware"

  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 2
      gpus: 1

      env:
        PYTHONUNBUFFERED: "1"
      args:
        served-model-name: "Qwen/Qwen3-0.6B"
        tensor-parallel-size: 1
        mem-fraction-static: 0.5
        context-length: 4096
        disable-piecewise-cuda-graph: true

  benchmark:
    type: "sa-bench"
    isl: 128
    osl: 128
    concurrencies: "4x8"

# One TP2 worker instead of two TP1 workers. Only the changed leaves are listed.
override_tp2:
  resources: {}
  roles:
    agg:
      workers: 1
      gpus: 2
      args:
        tensor-parallel-size: 2

# Two variants zipped in parallel: the i-th element of every list goes to variant i.
# A length-1 list broadcasts; a list of lists gives each variant a literal list.
zip_override_context:
  name:
    - "qwen3-0.6b-override-ctx2k"
    - "qwen3-0.6b-override-ctx8k"
  roles:
    agg:
      args:
        context-length: [2048, 8192]
        mem-fraction-static: [0.5]
  benchmark:
    concurrencies: [["4"], ["4", "8"]]
