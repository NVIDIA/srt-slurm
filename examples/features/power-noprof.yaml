# Configure the stock dcgm-exporter container alias in srtslurm.yaml.
# See docs/power-telemetry.md for the missing profiling metrics and validation.

schema: 2
name: "qwen3-0.6b-power-noprof"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "vllm"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
frontend:
  type: vllm
  enable_multiple_frontends: false

engine: vllm
roles:
  agg:
    nodes: 1
    workers: 1
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      gpu-memory-utilization: 0.5
      max-model-len: 4096

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: [4]
  client_placement: head

telemetry:
  enabled: true
  required: true
  collect_interval_ms: 1000
  request_timeout_seconds: 2
  dcgm_exporter:
    container_image: dcgm-exporter
    port: 9401
    command: >-
      dcgm-exporter --collect-interval=100 --address :{port}
      --collectors /configs/dcgm-counters-noprof.csv
