# Torch profiling of an aggregated SGLang worker.
#
# `profiling:` captures a torch profile between `start_step` and `stop_step` for
# each worker role while the configured benchmark drives traffic. Traces land
# under `<log_dir>/profiles/<role>/`. `type` may be `torch`, `nsys`, or
# `nsys-time`; see docs/profiling.md.
#
# Aliases (`qwen3-0.6b`, `sglang`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-profiling"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "sglang"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
profiling:
  type: "torch"
  aggregated:
    start_step: 0
    stop_step: 20

frontend:
  type: sglang
  enable_multiple_frontends: false

backend:
  type: sglang
roles:
  agg:
    nodes: 1
    workers: 1
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      mem-fraction-static: 0.5
      context-length: 4096
      disable-piecewise-cuda-graph: true

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4"
