# torchrun across a pool: a two-node service forms its own cluster from placeholders.
#
# The `train` service owns two nodes. Each instance runs one torchrun with one
# process per GPU; instance 0 of the pool is the rendezvous ({pool_ip}), and every
# rank runs examples/features/torchrun-pool/train.py, mounted at /demo. The
# benchmark step waits until every rank has reported in and prints the result.
#
#   srtctl dry-run -f examples/features/torchrun-pool.yaml
schema: 2
name: "torchrun-pool"

slurm:
  time_limit: "00:20:00"

model:
  path: "hf:Qwen/Qwen3-0.6B"                 # unused by the run; the schema requires a model
  container: "nvcr.io/nvidia/pytorch:25.06-py3"
  precision: "bf16"

resources:
  gpu_type: "b200"
  gpus_per_node: 8

frontend:
  type: none

services:
  - name: train
    type: generic
    nodes: 2
    command:
      - torchrun
      - --nnodes={pool_node_count}
      - --nproc-per-node={gpus_per_node}
      - --node-rank={index}
      - --master-addr={pool_ip}
      - --master-port=29500
      - /demo/train.py
    env:
      NCCL_SOCKET_IFNAME: bond0
      GLOO_SOCKET_IFNAME: bond0
    # No readiness probe: instances launch back to back, and a static torchrun
    # rendezvous only completes once every node has joined.

# Waits for pool_node_count * gpus_per_node "hello" lines in the service logs
# (mounted at /logs), prints them in rank order, and exits non-zero on a timeout.
benchmark:
  type: custom
  command: >-
    bash -c 'want=$((SRT_SERVICE_TRAIN_NODE_COUNT * SRT_GPUS_PER_NODE)); n=0;
    for i in $(seq 1 120); do n=$(cat /logs/service_train_*.out 2>/dev/null | grep -c "better kubernetes");
    [ "$n" -ge "$want" ] && break; sleep 5; done;
    grep -h "better kubernetes" /logs/service_train_*.out | sort -t" " -k3 -n;
    echo "$n/$want workers reported"; [ "$n" -ge "$want" ]'

extra_mount:
  - "$SRTCTL_SOURCE_DIR/examples/features/torchrun-pool:/demo"

observability:
  tachometer:
    enabled: false
