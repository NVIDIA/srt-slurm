# Torch profiling of an aggregated SGLang worker.
#
# `profiling:` captures a torch profile between `start_step` and `stop_step` for
# each worker role while the configured benchmark drives traffic. Traces land
# under `<log_dir>/profiles/<role>/`. `type` may be `torch`, `nsys`, or
# `nsys-time`; see docs/profiling.md.
#
# Aliases (`qwen3-0.6b`, `sglang`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-profiling"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "vllm/vllm-openai:v0.20.1-ubuntu2404"
  precision: "bf16"

resources:
  gpu_type: "gb200"
  gpus_per_node: 4

services:
  - name: etcd
    type: etcd
    placement:
      node: dedicated
  - name: nats
    type: nats
    placement:
      node: dedicated

dynamo:
  install: true
  source:
    wheel: "1.2.0.dev20260426"

profiling:
  type: "torch"
  aggregated:
    start_step: 0
    stop_step: 2

frontend:
  type: dynamo
  enable_multiple_frontends: false

engine:
  type: vllm
  set_cuda_visible_devices: true
roles:
  agg:
    nodes: 1
    workers: 1
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      gpu-memory-utilization: 0.5
      max-model-len: 4096
      enforce-eager: true

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4"
