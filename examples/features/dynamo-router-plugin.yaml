# Custom Dynamo routing strategy: build the frontend with your own router plugin crate.
#
# `dynamo.source.router_plugin_crate` names a Rust crate of worker-selection policies.
# The job builds Dynamo at `source.rev` with that crate linked into the frontend, and
# `frontend.router_policy_config` selects the crate's policy type per worker role. Two
# `dynamo.mocker` workers stand in for engines, so a strategy can be tried end to end
# in minutes with no model weights on the GPU.
#
# To iterate: copy configs/router-plugins/least-active, edit src/lib.rs, point
# `router_plugin_crate` at the copy, and resubmit. The build cache is keyed by the
# crate's contents, so an edit rebuilds once and an unchanged crate reuses its wheel.
# See "Custom routing strategies" in docs/frontends.md.
#
# Aliases (`qwen3-0.6b`, `sglang`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-mocker-dynamo-router-plugin"

slurm:
  time_limit: "00:45:00"      # the first job for a crate version builds Dynamo

model:
  path: "qwen3-0.6b"
  container: "sglang"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8

dynamo:
  source:
    git: https://github.com/ai-dynamo/dynamo
    rev: 08cfa4ff200168975ddb902f2d25ceb02be888fa
    # A path under srtctl's configs/ directory, or an absolute path in the container.
    router_plugin_crate: router-plugins/least-active

frontend:
  type: dynamo
  enable_multiple_frontends: false
  # Dynamo's --router-policy-config document, inline. A path to a YAML file works too.
  router_policy_config:
    worker_selection:
      aggregated:
        type: srtctl-example-least-active   # registered by the crate's `register`
        parameters:
          active_request_weight: 1.0

engine:
  type: mocker
  engine_type: vllm
  speedup_ratio: 100

roles:
  agg:
    nodes: 1
    workers: 2

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4"
