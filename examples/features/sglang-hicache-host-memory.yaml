# SGLang HiCache with the host-memory preflight (`host_memory_check`).
#
# Four TP1 workers on one node, each with a 100 GB host KV pool (`hicache-size` is per
# GPU rank), so the node must hold 400 GB plus `headroom_gib`. Before any worker
# starts, srtctl reads MemAvailable on the node's bare host and fails the job in
# seconds, naming the node and the numbers, when it cannot. The block below spells
# out the defaults; `on_shortfall: warn` logs and continues instead.
#
# Aliases (`qwen3-0.6b`, `sglang`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-sglang-hicache-host-memory"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "sglang"
  precision: "bf16"

resources:
  gpu_type: "gb300"
  gpus_per_node: 4

frontend:
  type: sglang-router
  enable_multiple_frontends: false

host_memory_check:
  enabled: true
  headroom_gib: 32
  on_shortfall: fail

engine: sglang
roles:
  agg:
    nodes: 1
    workers: 4
    gpus: 1
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      mem-fraction-static: 0.5
      # HiCache needs a host pool larger than the device pool, in tokens.
      max-total-tokens: 262144
      context-length: 4096
      enable-hierarchical-cache: true
      hicache-size: 100

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
