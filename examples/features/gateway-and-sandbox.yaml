# A host-native sandbox service paired with a gateway in front of the inference frontend.
#
# Demonstrates:
# - `host_native: true` on a generic service (runs on the bare host node without a container,
#   for daemons that need host devices, sockets, or cgroups).
# - `{frontend_ip}` and `{frontend_port}` placeholders so a gateway service points at the
#   resolved frontend regardless of `frontend.placement.node`.
# - `benchmark.target_service` so a built-in benchmark (or custom script reading
#   `SRT_FRONTEND_HOST`/`SRT_FRONTEND_PORT`) drives the gateway instead of the raw frontend.
#
# Aliases (`qwen3-0.6b`, `sglang`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-gateway-and-sandbox"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "sglang"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8

frontend:
  type: sglang-router
  enable_multiple_frontends: false
  args:
    policy: "cache_aware"

engine: sglang
roles:
  agg:
    nodes: 1
    workers: 2
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      mem-fraction-static: 0.5
      context-length: 4096
      disable-piecewise-cuda-graph: true

services:
  - name: sandbox-service
    type: generic
    host_native: true
    placement:
      node: head
    start: after_frontend
    critical: true
    inherit_discovery_env: false
    env:
      SANDBOX_LISTEN: "127.0.0.1:18090"
    command:
      - python3
      - -m
      - http.server
      - "18090"
      - --bind
      - "127.0.0.1"
    readiness:
      log:
        pattern: "Serving HTTP"
      timeout_seconds: 60

  - name: gateway
    type: generic
    placement:
      node: head
    start: after_frontend
    critical: true
    inherit_discovery_env: false
    env:
      LLM_API_BASE: "http://{frontend_ip}:{frontend_port}"
      SANDBOX_ENDPOINT: "http://127.0.0.1:18090"
      GATEWAY_LISTEN: "0.0.0.0:18400"
    command:
      - python3
      - -m
      - http.server
      - "18400"
    readiness:
      http:
        port: 18400
        path: /
        status: 200
      timeout_seconds: 60
    metrics:
      port: 19092
      path: /metrics

benchmark:
  type: "sa-bench"
  target_service: "gateway"
  isl: 128
  osl: 128
  concurrencies: "4x8"
