# Shared by the recipes in this directory through `extends`: the model, the engine and the worker
# shape. It is a partial recipe; `srtctl apply` runs the files that extend it, not this one.
#
# Aliases (`qwen3-0.6b`, `sglang`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-extends"   # variants.yaml names its jobs after it; tp1.yaml sets its own

model:
  path: "qwen3-0.6b"
  container: "sglang"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8

frontend:
  type: sglang-router
  enable_multiple_frontends: false
  args:
    policy: "cache_aware"

engine: sglang
roles:
  agg:
    nodes: 1
    workers: 2
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      mem-fraction-static: 0.5
      context-length: 4096
      disable-piecewise-cuda-graph: true
