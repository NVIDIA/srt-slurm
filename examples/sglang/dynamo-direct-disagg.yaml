# SGLang disaggregated prefill/decode dialed directly by the Dynamo frontend.
#
# One TP1 prefill worker and one TP1 decode worker sharing a node (`nodes: colocate`
# places decode on the prefill node's spare GPUs). Both are plain
# `sglang.launch_server` engines with a native gRPC listener: no `dynamo.sglang`
# worker, no sidecar, no etcd. The frontend runs `dynamo.frontend --direct` with
# one `--engine-url` per engine and routes with `--router-mode kv`.
# `dynamo.source` must be a Dynamo build whose frontend has `--direct`; see
# docs/dynamo-direct.md.
#
# Aliases (`qwen3-0.6b`, `sglang`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-sglang-dynamo-direct-disagg"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "sglang"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
dynamo:
  source:
    pypi: "1.4.2"

frontend:
  type: dynamo-direct
  enable_multiple_frontends: false
  args:
    router-mode: "kv"

engine: sglang
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      mem-fraction-static: 0.5
      context-length: 4096
      disable-piecewise-cuda-graph: true
  decode:
    nodes: colocate
    workers: 1
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      mem-fraction-static: 0.5
      context-length: 4096
      disable-piecewise-cuda-graph: true

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
