# Standalone upstream sgl-router, distinct from the Python Model Gateway.
# Two local prefill workers and one decode worker; engines publish KV events,
# replay and queued-work load on independently allocated port ranges.
schema: 2
name: qwen3-sgl-router-kv-aware
slurm:
  time_limit: "00:30:00"
model:
  path: hf:Qwen/Qwen3-0.6B
  container: >-
    lmsysorg/sglang-rocm:v0.5.21-rocm720-mi30x-20261006@sha256:f7430d43c728da94f001ca51d5d2e0d754c85a3a8d54a3b68bf7aa2e12e6ff6a
  precision: bf16
resources:
  gpu_type: mi300x
  gpus_per_node: 8
frontend:
  type: sgl-router
  container_image: >-
    lmsysorg/sglang-staging:experimental-router-dev@sha256:b389a4ce338ecea703c3f67f0691ac657092d3412c93b73dc42192b9135f6018
  enable_multiple_frontends: false
  args:
    tokenizer-path: Qwen/Qwen3-0.6B
    chat-routing: reorg
    policy: cache_aware
    affinity-mode: balanced
    dp-aware: true
    disable-input-ids-forwarding: true
engine: sglang
roles:
  prefill:
    nodes: 1
    workers: 2
    gpus: 1
    kv_events:
      replay_endpoint: auto
    args:
      served-model-name: Qwen/Qwen3-0.6B
      tensor-parallel-size: 1
      context-length: 4096
      load-publish-endpoint: auto
      disaggregation-transfer-backend: mori
  decode:
    nodes: colocate
    workers: 1
    gpus: 1
    kv_events:
      replay_endpoint: auto
    args:
      served-model-name: Qwen/Qwen3-0.6B
      tensor-parallel-size: 1
      context-length: 4096
      load-publish-endpoint: auto
      disaggregation-transfer-backend: mori
benchmark:
  type: sa-bench
  isl: 128
  osl: 128
  concurrencies: "4"
