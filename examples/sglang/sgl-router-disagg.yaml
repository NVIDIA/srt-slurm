# SGLang disaggregated prefill/decode behind SGLang's Rust router (sgl-router).
#
# One TP1 prefill worker and one TP1 decode worker sharing a node (`nodes: colocate`
# places decode on the prefill node's spare GPUs). srtctl adds `--disaggregation-mode`
# and the prefill bootstrap port. The router gets one flat `--worker-urls` list and
# reads each engine's role and bootstrap port from its `/server_info`, so there is no
# P/D flag. It runs from its own image (`frontend.container_image`), started once
# every engine answers `/health`.
#
# Aliases (`qwen3-0.6b`, `sglang`, `sgl-router`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-sglang-sgl-router-disagg"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "sglang"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
frontend:
  type: sgl-router
  container_image: sgl-router
  enable_multiple_frontends: false
  args:
    chat-routing: "reorg"

engine: sglang
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      mem-fraction-static: 0.5
      context-length: 4096
      disable-piecewise-cuda-graph: true
  decode:
    nodes: colocate
    workers: 1
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      mem-fraction-static: 0.5
      context-length: 4096
      disable-piecewise-cuda-graph: true

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
