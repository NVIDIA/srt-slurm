# SGLang single replica, no router: `frontend.type: sglang`.
#
# One TP1 `sglang.launch_server` worker binds the public port itself; srtctl starts
# no frontend process. Readiness is the worker's /health and /v1/models, tachometer
# scrapes its /metrics. For several replicas use `sglang-router`; for KV-aware
# routing use `dynamo`.
#
# Aliases (`qwen3-0.6b`, `sglang`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-sglang-direct-agg"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "sglang"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8

frontend:
  type: sglang
  enable_multiple_frontends: false

engine: sglang
roles:
  agg:
    nodes: 1
    workers: 1
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      mem-fraction-static: 0.5
      context-length: 4096

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
