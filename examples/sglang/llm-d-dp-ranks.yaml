# SGLang disaggregated prefill/decode with attention DP behind the llm-d router (docs/llm-d.md).
#
# One TP4/attention-DP4 prefill worker and one TP4/attention-DP4 decode worker on two
# 4-GPU nodes, KV over NIXL. Because an SGLang server exposes every DP rank on a single
# port and each rank owns its own radix cache, srtctl launches `llm_d_dp_rank_proxy.py`
# on the prefill node (`LLM_D_DP_RANK_PORTS`, 9700+) and writes one endpoint per prefill
# DP rank (`prefill-0-0-dp0`..`dp3`) into `llm-d-endpoints.yaml`, pinning requests with
# `X-Data-Parallel-Rank` and narrowing `/metrics` to that rank. Both roles set
# `SGLANG_DISAGGREGATION_FORCE_QUERY_PREFILL_DP_RANK=1` so decode queries prefill for the
# rank holding the KV cache instead of assuming `bootstrap_room % dp`.
#
# Aliases (`llm-d-sglang`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-30b-a3b-sglang-llm-d-dp-ranks"

slurm:
  time_limit: "00:30:00"

model:
  path: "hf:Qwen/Qwen3-30B-A3B"
  container: "llm-d-sglang"
  precision: "bf16"

resources:
  gpu_type: "gb200"
  gpus_per_node: 4
frontend:
  type: llm-d
  enable_multiple_frontends: false
  epp_config:
    plugins:
      - type: approx-prefix-cache-producer
      - type: prefill-filter
      - type: decode-filter
      - type: prefix-cache-scorer
      - type: queue-scorer
      - type: always-disagg-pd-decider
      - type: disagg-profile-handler
        parameters:
          deciders:
            prefill: always-disagg-pd-decider
      - type: max-score-picker
    schedulingProfiles:
      - name: prefill
        plugins:
          - pluginRef: prefill-filter
          - pluginRef: prefix-cache-scorer
            weight: 3
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: max-score-picker
      - name: decode
        plugins:
          - pluginRef: decode-filter
          - pluginRef: queue-scorer
          - pluginRef: max-score-picker

engine: sglang
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 4
    env:
      PYTHONUNBUFFERED: "1"
      SGLANG_DISAGGREGATION_FORCE_QUERY_PREFILL_DP_RANK: "1"
    args:
      served-model-name: "Qwen/Qwen3-30B-A3B"
      tensor-parallel-size: 4
      attn-dp-size: 4
      disaggregation-transfer-backend: nixl
      mem-fraction-static: 0.8
      context-length: 4096
  decode:
    nodes: 1
    workers: 1
    gpus: 4
    env:
      PYTHONUNBUFFERED: "1"
      SGLANG_DISAGGREGATION_FORCE_QUERY_PREFILL_DP_RANK: "1"
    args:
      served-model-name: "Qwen/Qwen3-30B-A3B"
      tensor-parallel-size: 4
      attn-dp-size: 4
      disaggregation-transfer-backend: nixl
      mem-fraction-static: 0.8
      context-length: 4096

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "8x16"
