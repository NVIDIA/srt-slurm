# SGLang aggregated behind the Dynamo frontend with KV-aware routing.
#
# Two TP1 `dynamo.sglang` workers on one node register with etcd/NATS; the Dynamo
# frontend routes with `--router-mode kv`. Dynamo is pip-installed into the engine
# container at job start (`dynamo.version`); set `dynamo.install: false` when the
# container already ships it.
#
# Aliases (`qwen3-0.6b`, `sglang`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-sglang-dynamo-agg"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "sglang"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
  agg_nodes: 1
  agg_workers: 2
  gpus_per_agg: 1

dynamo:
  version: "1.4.2"

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "kv"

backend:
  type: sglang
  aggregated_environment:
    PYTHONUNBUFFERED: "1"
  sglang_config:
    aggregated:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      mem-fraction-static: 0.5
      context-length: 4096
      disable-piecewise-cuda-graph: true

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
