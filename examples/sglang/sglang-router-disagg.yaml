# SGLang disaggregated prefill/decode, fronted by the SGLang router (Model Gateway).
#
# One TP1 prefill worker and one TP1 decode worker sharing a node (`nodes: colocate`
# places decode on the prefill node's spare GPUs). srtctl adds `--disaggregation-mode`
# and the prefill bootstrap port; the router is launched with `--pd-disaggregation`.
# Per-role srun options give the colocated workers different host-memory caps.
# KV transfer uses SGLang's default backend (mooncake); set
# `disaggregation-transfer-backend: nixl` on both roles to switch.
#
# Aliases (`qwen3-0.6b`, `sglang`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-sglang-router-disagg"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "sglang"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
frontend:
  type: sglang-router
  enable_multiple_frontends: false
  args:
    policy: "cache_aware"

# Non-worker steps retain this limit; each worker role overrides it below.
srun_options:
  mem: "0"

engine: sglang
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 1
    srun_options:
      mem: "64G"
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      mem-fraction-static: 0.5
      context-length: 4096
      disable-piecewise-cuda-graph: true
  decode:
    nodes: colocate
    workers: 1
    gpus: 1
    srun_options:
      mem: "32G"
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      mem-fraction-static: 0.5
      context-length: 4096
      disable-piecewise-cuda-graph: true

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
