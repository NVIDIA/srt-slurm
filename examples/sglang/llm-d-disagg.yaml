# SGLang disaggregated prefill/decode behind the llm-d router (docs/llm-d.md).
#
# One TP1 prefill and one TP1 decode SGLang worker sharing a node, KV over NIXL.
# On the router node srtctl starts llm-d's Endpoint Picker (EPP) and Envoy on the
# public port. The decode worker sits behind llm-d's P/D sidecar (`llm-d-sidecar`,
# implied by the frontend, `--kv-connector=sglang`, `SGLANG_BOOTSTRAP_PORT=7200`),
# which coordinates bootstrap metadata and dispatches concurrent prefill and decode
# requests.
#
# Aliases (`qwen3-0.6b`, `llm-d-sglang`) resolve through srtslurm.yaml; see
# examples/README.md. `llm-d-sglang` is an SGLang image that also ships the `epp`,
# `pd-sidecar`, and `envoy` executables on PATH (docs/llm-d.md#images).

schema: 2
name: "qwen3-0.6b-sglang-llm-d-disagg"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "llm-d-sglang"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
frontend:
  type: llm-d
  enable_multiple_frontends: false
  epp_config:
    plugins:
      - type: approx-prefix-cache-producer
      - type: prefill-filter
      - type: decode-filter
      - type: prefix-cache-scorer
      - type: queue-scorer
      - type: always-disagg-pd-decider
      - type: disagg-profile-handler
        parameters:
          deciders:
            prefill: always-disagg-pd-decider
      - type: max-score-picker
    schedulingProfiles:
      - name: prefill
        plugins:
          - pluginRef: prefill-filter
          - pluginRef: prefix-cache-scorer
            weight: 2
          - pluginRef: queue-scorer
          - pluginRef: max-score-picker
      - name: decode
        plugins:
          - pluginRef: decode-filter
          - pluginRef: queue-scorer
          - pluginRef: max-score-picker

engine: sglang
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      disaggregation-transfer-backend: nixl
      mem-fraction-static: 0.5
      context-length: 4096
      disable-piecewise-cuda-graph: true
  decode:
    nodes: colocate
    workers: 1
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      disaggregation-transfer-backend: nixl
      mem-fraction-static: 0.5
      context-length: 4096
      disable-piecewise-cuda-graph: true

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
