# SGLang disaggregated prefill/decode, fronted by the Infera router.
#
# Each worker is `python3 -m infera.engine.sglang`, which starts SGLang's own server with
# the flags srtctl builds and registers it in the job's etcd (implied by frontend.type:
# infera). `infera-router` discovers the workers there and routes on KV events read
# straight from SGLang's ZMQ publishers; `kv_events` gives the prefill role an allocated
# publisher port. `configs/install-infera.sh` installs the Infera release named by
# INFERA_VERSION into the stock SGLang image, for the workers and the router alike.
#
# Aliases (`qwen3-0.6b`, `sglang`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-infera-disagg"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "sglang"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8

setup_script: install-infera.sh
environment:
  INFERA_VERSION: "0.3.2"

frontend:
  type: infera
  enable_multiple_frontends: false
  args:
    router-policy: "kv-aware"

engine: sglang
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 1
    kv_events: true
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      mem-fraction-static: 0.5
      context-length: 4096
      page-size: 64
  decode:
    nodes: colocate
    workers: 1
    gpus: 1
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      mem-fraction-static: 0.5
      context-length: 4096
      page-size: 64

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
