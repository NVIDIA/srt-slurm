# vLLM data parallel 16 with expert parallelism across two nodes, behind the llm-d
# router, which routes to every DP rank by the KV-cache blocks it holds (docs/llm-d.md).
#
# `data-parallel-external-lb` makes every DP rank its own `vllm serve
# --data-parallel-rank` on its own port, so the endpoints file lists 16 endpoints.
# `kv_events` makes every rank publish its KV-cache events to the Endpoint Picker
# (EPP), whose precise prefix-cache producer indexes them; the token producer
# tokenizes each prompt through a worker's render endpoint. srtctl wires the
# event socket, the topics, and the render URL.
#
# Aliases (`llm-d-vllm`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-30b-a3b-vllm-llm-d-dp-ranks"

slurm:
  time_limit: "00:30:00"

model:
  path: "hf:Qwen/Qwen3-30B-A3B"
  container: "llm-d-vllm"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
frontend:
  type: llm-d
  enable_multiple_frontends: false
  epp_config:
    plugins:
      # Tokenizes each prompt through a worker's render endpoint (srtctl sets vllm.url and modelName).
      - type: token-producer
      # Indexes the ranks' KV-cache events (srtctl sets kvEventsConfig's socket).
      - type: precise-prefix-cache-producer
        parameters:
          indexerConfig:
            kvBlockIndexConfig:
              enableMetrics: true
      - type: prefix-cache-scorer
        parameters:
          prefixMatchInfoProducerName: precise-prefix-cache-producer
      - type: queue-scorer
      - type: max-score-picker
    schedulingProfiles:
      - name: default
        plugins:
          - pluginRef: prefix-cache-scorer
            weight: 3
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: max-score-picker

engine: vllm
roles:
  agg:
    nodes: 2
    workers: 1
    gpus: 16
    kv_events: true
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-30B-A3B"
      tensor-parallel-size: 1
      data-parallel-size: 16
      data-parallel-external-lb: true
      enable-expert-parallel: true
      max-model-len: 4096

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "16x32"
