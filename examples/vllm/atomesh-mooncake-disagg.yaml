schema: 2
name: qwen3-0.6b-atomesh-vllm-mooncake
identity:
  model: {}
  container: {}

slurm:
  time_limit: "00:30:00"

model:
  path: qwen3-0.6b
  container: vllm
  precision: bf16

resources:
  gpu_type: mi355x
  gpus_per_node: 8

frontend:
  type: atomesh
  container_image: rocm/atom-dev:latest
  enable_multiple_frontends: false
  args:
    policy: dp_sticky

engine:
  type: vllm
  connector: mooncake

roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 1
    args:
      served-model-name: Qwen/Qwen3-0.6B
      tensor-parallel-size: 1
      gpu-memory-utilization: 0.5
      max-model-len: 4096
  decode:
    nodes: colocate
    workers: 1
    gpus: 1
    args:
      served-model-name: Qwen/Qwen3-0.6B
      tensor-parallel-size: 1
      gpu-memory-utilization: 0.5
      max-model-len: 4096

benchmark:
  type: sa-bench
  isl: 128
  osl: 128
  concurrencies: "4x8"
