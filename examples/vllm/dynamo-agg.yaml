# vLLM aggregated behind the Dynamo frontend with KV-aware routing.
#
# Two TP1 workers on one node, each a native `vllm-rs serve` engine beside a Dynamo
# sidecar (`sidecar: true`; docs/sidecars.md). The Dynamo frontend routes with
# `--router-mode kv`. Dynamo is pip-installed into the engine container at job start
# (`dynamo.source`); set `dynamo.install: false` when the container already ships it.
# The image must ship `vllm-rs` (vLLM 0.31 or later).
#
# Aliases (`qwen3-0.6b`, `vllm`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-vllm-dynamo-agg"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "vllm"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
dynamo:
  source:
    pypi: "1.6.2"

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "kv"

engine: vllm
roles:
  agg:
    nodes: 1
    workers: 2
    gpus: 1
    sidecar: true
    env:
      DYN_HEALTH_CHECK_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      gpu-memory-utilization: 0.5
      max-model-len: 4096

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
