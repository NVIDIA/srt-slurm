# vLLM aggregated behind the Dynamo frontend with KV-aware routing.
#
# Two TP1 `dynamo.vllm` workers on one node register with etcd/NATS; the Dynamo
# frontend routes with `--router-mode kv`. Dynamo is pip-installed into the engine
# container at job start (`dynamo.version`); set `dynamo.install: false` when the
# container already ships it.
#
# Aliases (`qwen3-0.6b`, `vllm`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-vllm-dynamo-agg"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "vllm"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
dynamo:
  version: "1.4.2"

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "kv"

backend:
  type: vllm
roles:
  agg:
    nodes: 1
    workers: 2
    gpus: 1
    env:
      DYN_HEALTH_CHECK_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      gpu-memory-utilization: 0.5
      max-model-len: 4096

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
