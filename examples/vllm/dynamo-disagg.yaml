# vLLM disaggregated prefill/decode behind the Dynamo frontend.
#
# One TP1 prefill and one TP1 decode `dynamo.vllm` worker sharing a node
# (`decode_nodes: 0` places decode on the prefill node's spare GPUs). KV moves over
# the NIXL connector; the Dynamo frontend routes with `--router-mode kv`.
#
# Aliases (`qwen3-0.6b`, `vllm`) resolve through srtslurm.yaml; see examples/README.md.

name: "qwen3-0.6b-vllm-dynamo-disagg"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "vllm"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
  prefill_nodes: 1
  prefill_workers: 1
  gpus_per_prefill: 1
  decode_nodes: 0
  decode_workers: 1
  gpus_per_decode: 1

dynamo:
  version: "1.4.2"

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "kv"

backend:
  type: vllm
  connector: nixl
  prefill_environment:
    DYN_HEALTH_CHECK_ENABLED: "false"
    PYTHONUNBUFFERED: "1"
  decode_environment:
    DYN_HEALTH_CHECK_ENABLED: "false"
    PYTHONUNBUFFERED: "1"
  vllm_config:
    prefill:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      gpu-memory-utilization: 0.5
      max-model-len: 4096
    decode:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      gpu-memory-utilization: 0.5
      max-model-len: 4096

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
