# vLLM aggregated behind the official vLLM Router.
#
# Two TP1 `vllm serve` workers on one node; the Router receives them through
# `--worker-urls` and distributes sessions with consistent hashing. No Dynamo,
# NATS, or etcd. The `vllm-router` executable must be present in the container.
#
# Aliases (`qwen3-0.6b`, `vllm`) resolve through srtslurm.yaml; see examples/README.md.

name: "qwen3-0.6b-vllm-router-agg"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "vllm"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
  agg_nodes: 1
  agg_workers: 2
  gpus_per_agg: 1

frontend:
  type: vllm-router
  enable_multiple_frontends: false
  args:
    policy: "consistent_hash"

backend:
  type: vllm
  aggregated_environment:
    PYTHONUNBUFFERED: "1"
  vllm_config:
    aggregated:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      gpu-memory-utilization: 0.5
      max-model-len: 4096

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
