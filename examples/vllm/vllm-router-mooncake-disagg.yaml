# vLLM disaggregated prefill/decode behind the official vLLM Router, with KV
# moving over vLLM's MooncakeConnector.
#
# `connector: mooncake` gives prefill a `kv_producer` and decode a `kv_consumer`
# MooncakeConnector. The Router is launched with `--vllm-pd-disaggregation
# --kv-connector mooncake`, a `--prefill URL PORT` entry and a `--decode URL`
# entry; the prefill worker opens its Mooncake bootstrap server on that PORT
# (VLLM_MOONCAKE_BOOTSTRAP_PORT). The Router reads the prefill's engine IDs from
# that server once, when it starts, so srtctl starts it only after every worker
# answers /health.
#
# One TP1 prefill and one TP1 decode worker share a node (`nodes: colocate`).
# Point `model.container` at a vLLM image that ships Mooncake
# (`mooncake-transfer-engine`, or `mooncake-transfer-engine-rocm` on ROCm);
# aliases (`qwen3-0.6b`, `vllm`) resolve through srtslurm.yaml.

schema: 2
name: "qwen3-0.6b-vllm-router-mooncake-disagg"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "vllm"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
frontend:
  type: vllm-router
  enable_multiple_frontends: false
  args:
    policy: "consistent_hash"

engine:
  type: vllm
  connector: mooncake
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      gpu-memory-utilization: 0.5
      max-model-len: 4096
  decode:
    nodes: colocate
    workers: 1
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      gpu-memory-utilization: 0.5
      max-model-len: 4096

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
