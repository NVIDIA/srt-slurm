# TokenSpeed headless ZMQ workers behind one SMG gateway on the head node.
# The image must include TokenSpeed and its matching tokenspeed-smg dependency.
# The gateway binds TCP handshake sockets; the workers dial them and export
# metrics on separate HTTP ports. See docs/tokenspeed.md.
# Aliases resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-tokenspeed-smg-agg"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "tokenspeed"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8

frontend:
  type: smg
  enable_multiple_frontends: false

engine: tokenspeed
roles:
  agg:
    nodes: 1
    workers: 2
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      attn-tp-size: 1
      enable-metrics: true
      gpu-memory-utilization: 0.5
      max-model-len: 4096

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
