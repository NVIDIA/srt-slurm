# Miles GRPO on Qwen3-4B with OpenEnv Terminal-Bench-2 rollouts, no Docker, no hosted sandbox.
#
# The Ray cluster owns the pool; the tbench2_env server rides on it (one per node,
# TB2_MODE=local) and the Miles adapter reaches it at localhost:8003 from every
# rollout worker. The recipe is benchmarks/rl/miles/recipes/openenv_tbench2_qwen3.py:
# Miles's Terminal-Bench-2 adapter with a dense Qwen3-4B profile.
#
# Prep (once, see examples/miles/openenv-tbench2-smoke.yaml for the venv): a
# torch_dist checkpoint of Qwen3-4B, the terminal-bench-2 checkout, a prompt file
# from Miles's make_tbench2_data.py, and a client-only site dir holding
# tbench2_env and openenv for the rollout workers (OPENENV_SITE).
#
# Local mode caveat: episodes of the same task share that task's source directory,
# so with n_samples_per_prompt > 1 concurrent episodes can see each other's files.
# This proves the plumbing end to end; per-episode isolation needs per-episode
# containers (nested enroot) or a hosted sandbox provider.
schema: 2
name: "qwen3-4b-openenv-tbench2"

slurm:
  time_limit: "02:00:00"

model:
  path: "qwen3-4b"
  container: "miles"
  precision: "bf16"

resources:
  gpu_type: "b200"
  gpus_per_node: 8

frontend:
  type: none

services:
  - name: train
    type: ray
    nodes: 1
    preamble: "cd /root/miles"
  - name: env
    type: generic
    placement:
      pool: train                # one env server per trainer node; workers use localhost
    command: ["python3", "-m", "tbench2_env.server.app", "--port", "8003"]
    preamble: "ulimit -n 1048576"
    env:
      PYTHONPATH: /data/home/idhanani/openenv/venv/lib/python3.12/site-packages
      TB2_MODE: local
      TB2_TASKS_DIR: /data/home/idhanani/openenv/terminal-bench-2
      TB2_OUTPUT_DIR: /tmp/tbench2_env_runs
      TB2_WITHHOLD_TESTS: "1"
      TB2_COMMAND_TIMEOUT_S: "120"
      MAX_CONCURRENT_ENVS: "64"
    readiness:
      http:
        port: 8003
        path: /health
      timeout_seconds: 300
    critical: true

benchmark:
  type: custom
  command: /benchmarks/rl/miles/launch.sh
  env:
    MILES_RECIPE: /benchmarks/rl/miles/recipes/openenv_tbench2_qwen3.py
    OPENENV_SITE: /data/home/idhanani/openenv/client-site
    MILES_SCRIPT_OPENENV_ENV_URL: http://127.0.0.1:8003
    MILES_SCRIPT_PROMPT_DATA: /data/home/idhanani/openenv/tbench2_train_8.jsonl
    MILES_SCRIPT_REF_LOAD: /data/home/idhanani/models/Qwen3-4B_torch_dist
    MILES_SCRIPT_HF_CHECKPOINT: /data/home/idhanani/models/Qwen3-4B
    MILES_SCRIPT_SAVE_DIR: /data/home/idhanani/miles-runs/qwen3-4b-openenv-tbench2/
    MILES_SCRIPT_NUM_ROLLOUT: "2"
    MILES_SCRIPT_ROLLOUT_BATCH_SIZE: "8"
    MILES_SCRIPT_N_SAMPLES_PER_PROMPT: "4"
    MILES_SCRIPT_GLOBAL_BATCH_SIZE: "32"
    MILES_SCRIPT_OPENENV_MAX_TURNS: "8"
    MILES_SCRIPT_OPENENV_MAX_ROLLOUT_TIME_SECONDS: "900"
    MILES_SCRIPT_EXTRA_ENV_VARS: '{"PYTHONNOUSERSITE": "1"}'

extra_mount:
  - "/data/home/idhanani/models:/data/home/idhanani/models"
  - "/data/home/idhanani/openenv:/data/home/idhanani/openenv"
  - "/data/home/idhanani/miles-runs:/data/home/idhanani/miles-runs"

environment:
  NCCL_SOCKET_IFNAME: bond0
  GLOO_SOCKET_IFNAME: bond0

observability:
  tachometer:
    enabled: true
