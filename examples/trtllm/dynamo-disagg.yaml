# TRT-LLM disaggregated prefill/decode behind the Dynamo frontend.
#
# One TP1 prefill and one TP1 decode worker sharing a node (`nodes: colocate`
# places decode on the prefill node's spare GPUs), each a TRT-LLM OpenEngine gRPC
# engine beside a Dynamo sidecar (`sidecar: true`; docs/sidecars.md). KV moves
# through the NIXL cache transceiver; the Dynamo frontend routes with `--router-mode kv`.
#
# Dynamo 1.7.0 is pip-installed into the engine container at job start (`dynamo.source`).
# The image must ship TensorRT-LLM 1.4.0rc0 or later; see docs/sidecars.md.
#
# Aliases (`qwen3-0.6b`, `trtllm`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-trtllm-dynamo-disagg"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "trtllm"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8

dynamo:
  source:
    pypi: "1.7.0"

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "kv"

engine:
  type: trtllm
  served_model_name: "Qwen/Qwen3-0.6B"
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 1
    sidecar: true
    env:
      PYTHONUNBUFFERED: "1"
      TLLM_LOG_LEVEL: "INFO"
    args:
      backend: "pytorch"
      tensor_parallel_size: 1
      max_batch_size: 8
      max_num_tokens: 8192
      max_seq_len: 4096
      trust_remote_code: true
      disable_overlap_scheduler: true
      kv_cache_config:
        free_gpu_memory_fraction: 0.5
      cache_transceiver_config:
        backend: "NIXL"
  decode:
    nodes: colocate
    workers: 1
    gpus: 1
    sidecar: true
    env:
      PYTHONUNBUFFERED: "1"
      TLLM_LOG_LEVEL: "INFO"
    args:
      backend: "pytorch"
      tensor_parallel_size: 1
      max_batch_size: 64
      max_num_tokens: 4096
      max_seq_len: 4096
      trust_remote_code: true
      kv_cache_config:
        free_gpu_memory_fraction: 0.5
      cache_transceiver_config:
        backend: "NIXL"

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
