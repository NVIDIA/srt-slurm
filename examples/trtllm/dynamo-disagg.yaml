# TRT-LLM disaggregated prefill/decode behind the Dynamo frontend.
#
# One TP1 prefill and one TP1 decode `dynamo.trtllm` worker sharing a node
# (`decode_nodes: 0` places decode on the prefill node's spare GPUs). KV moves
# through the UCX cache transceiver; the Dynamo frontend routes with
# `--router-mode kv`. Dynamo TRT-LLM runtime images already ship `ai-dynamo`.
#
# Aliases (`qwen3-0.6b`, `trtllm`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-trtllm-dynamo-disagg"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "trtllm"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
dynamo:
  install: false

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "kv"

backend:
  type: trtllm
  served_model_name: "Qwen/Qwen3-0.6B"
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
      TLLM_LOG_LEVEL: "INFO"
    args:
      backend: "pytorch"
      tensor_parallel_size: 1
      max_batch_size: 8
      max_num_tokens: 8192
      max_seq_len: 4096
      trust_remote_code: true
      disable_overlap_scheduler: true
      kv_cache_config:
        free_gpu_memory_fraction: 0.5
      cache_transceiver_config:
        backend: "UCX"
  decode:
    nodes: 0
    workers: 1
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
      TLLM_LOG_LEVEL: "INFO"
    args:
      backend: "pytorch"
      tensor_parallel_size: 1
      max_batch_size: 64
      max_num_tokens: 4096
      max_seq_len: 4096
      trust_remote_code: true
      kv_cache_config:
        free_gpu_memory_fraction: 0.5
      cache_transceiver_config:
        backend: "UCX"

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
