# TRT-LLM disaggregated serving with a Mooncake KV pool. The prefill worker
# registers the store segment; the decode node lends host memory through a
# standalone donor. Both roles keep NIXL for live prefill-to-decode transfer.
# Helpers and workers initialize concurrently; pool readiness gates the frontend.
# Requires a TRT-LLM build with the Mooncake pool commands and connector.
# The image must also include mooncake_master and the Mooncake wheel.
schema: 2
name: "qwen3-0.6b-trtllm-mooncake"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "trtllm"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8

frontend:
  type: trtllm_serve
  enable_multiple_frontends: false

engine:
  type: trtllm
  served_model_name: "Qwen/Qwen3-0.6B"

roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 1
    args:
      backend: pytorch
      tensor_parallel_size: 1
      max_batch_size: 8
      max_num_tokens: 8192
      max_seq_len: 4096
      trust_remote_code: true
      cache_transceiver_config:
        backend: NIXL
      kv_cache_config:
        use_kv_cache_manager_v2: true
        host_cache_size: 0
        disk_cache_size: 0
      kv_connector_config:
        connector: mooncake-store
        mooncake_store:
          master_server_address: file:///logs/mooncake_master.addr
          protocol: rdma
          global_segment_size: 4GiB
  decode:
    nodes: 1
    workers: 1
    gpus: 1
    args:
      backend: pytorch
      tensor_parallel_size: 1
      max_batch_size: 64
      max_num_tokens: 4096
      max_seq_len: 4096
      trust_remote_code: true
      cache_transceiver_config:
        backend: NIXL

services:
  - name: mooncake-master
    type: mooncake-master
    start: with_workers
    options:
      eviction_ratio: 0.05
      master_timeout_s: 900
      store_role: both
  - name: mooncake-donor
    type: mooncake-donor
    start: with_workers
    readiness:
      file:
        path: "mooncake/donor-{node}.ready"
      timeout_seconds: 900
    placement:
      node: decode
    options:
      size: 4GiB
      protocol: rdma
  - name: memory-monitor
    type: generic
    start: before_workers
    critical: false
    placement:
      node: workers
    command: [python3, /configs/collect_memory.py, --interval, '5']

benchmark:
  type: sa-bench
  isl: 128
  osl: 128
  concurrencies: "4x8"
