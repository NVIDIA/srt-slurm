# TRT-LLM disaggregated serving with a decode worker that spans two nodes.
#
# One TP4 prefill worker on a 4-GPU node and one TP8 decode worker across two
# 4-GPU nodes, behind the Dynamo frontend. The decode worker is a single srun of
# eight MPI ranks: srtctl lists one host per rank in its own node order under
# `--distribution=arbitrary` (`--nodelist A,A,A,A,B,B,B,B`), so rank 0 is on the
# node whose IP it exported as MASTER_ADDR. Model and parallelism are placeholders
# for the layout; see tests/snapshots/launch/trtllm__dynamo-disagg-multinode.txt
# for the exact launch plan.
#
# Aliases (`qwen3-0.6b`, `trtllm`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-trtllm-dynamo-disagg-multinode"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "trtllm"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 4
dynamo:
  install: false

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "kv"

engine:
  type: trtllm
  served_model_name: "Qwen/Qwen3-0.6B"
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 4
    env:
      PYTHONUNBUFFERED: "1"
      TLLM_LOG_LEVEL: "INFO"
    args:
      backend: "pytorch"
      tensor_parallel_size: 4
      max_batch_size: 8
      max_num_tokens: 8192
      max_seq_len: 4096
      trust_remote_code: true
      disable_overlap_scheduler: true
      kv_cache_config:
        free_gpu_memory_fraction: 0.5
      cache_transceiver_config:
        backend: "UCX"
  decode:
    nodes: 2
    workers: 1
    gpus: 8
    env:
      PYTHONUNBUFFERED: "1"
      TLLM_LOG_LEVEL: "INFO"
    args:
      backend: "pytorch"
      tensor_parallel_size: 8
      max_batch_size: 64
      max_num_tokens: 4096
      max_seq_len: 4096
      trust_remote_code: true
      kv_cache_config:
        free_gpu_memory_fraction: 0.5
      cache_transceiver_config:
        backend: "UCX"

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
