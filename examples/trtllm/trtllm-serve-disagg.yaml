# TRT-LLM disaggregated prefill/decode, fronted by `trtllm-serve disaggregated`.
#
# One TP1 context (prefill) and one TP1 generation (decode) `trtllm-serve` worker
# sharing a node (`decode_nodes: 0` places decode on the prefill node's spare
# GPUs). srtctl writes the static ser.yaml listing both server URLs and launches
# `trtllm-serve disaggregated --config ser.yaml` on the head node as the router.
# KV moves through the UCX cache transceiver. No Dynamo, NATS, or etcd.
#
# Aliases (`qwen3-0.6b`, `trtllm`) resolve through srtslurm.yaml; see examples/README.md.

name: "qwen3-0.6b-trtllm-serve-disagg"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "trtllm"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
  prefill_nodes: 1
  prefill_workers: 1
  gpus_per_prefill: 1
  decode_nodes: 0
  decode_workers: 1
  gpus_per_decode: 1

frontend:
  type: trtllm_serve
  enable_multiple_frontends: false

backend:
  type: trtllm
  served_model_name: "Qwen/Qwen3-0.6B"
  prefill_environment:
    PYTHONUNBUFFERED: "1"
    TLLM_LOG_LEVEL: "INFO"
  decode_environment:
    PYTHONUNBUFFERED: "1"
    TLLM_LOG_LEVEL: "INFO"
  trtllm_config:
    prefill:
      backend: "pytorch"
      tensor_parallel_size: 1
      max_batch_size: 8
      max_num_tokens: 8192
      max_seq_len: 4096
      trust_remote_code: true
      disable_overlap_scheduler: true
      kv_cache_config:
        free_gpu_memory_fraction: 0.5
      cache_transceiver_config:
        backend: "UCX"
    decode:
      backend: "pytorch"
      tensor_parallel_size: 1
      max_batch_size: 64
      max_num_tokens: 4096
      max_seq_len: 4096
      trust_remote_code: true
      kv_cache_config:
        free_gpu_memory_fraction: 0.5
      cache_transceiver_config:
        backend: "UCX"

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
