# TRT-LLM disaggregated prefill/decode with a shared Mooncake Store pool, behind
# the Dynamo frontend.
#
# Same pool as trtllm-serve-disagg-mooncake.yaml: the `mooncake-master` service runs
# the upstream `mooncake_master` on the infra node, and srtctl gives each role's
# workers its Mooncake client config through MOONCAKE_CONFIG_PATH. `dynamo.trtllm`
# provisions no pool itself, so that variable is how its ranks find the master; no
# wrapper around the worker is needed. Needs a TRT-LLM build with the refined
# Mooncake connector API (NVIDIA/TensorRT-LLM#19706). See docs/mooncake-kv-store.md.
#
# Aliases (`qwen3-0.6b`, `trtllm`) resolve through srtslurm.yaml; see examples/README.md.

schema: 2
name: "qwen3-0.6b-trtllm-dynamo-disagg-mooncake"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "trtllm"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
dynamo:
  install: false

frontend:
  type: dynamo
  enable_multiple_frontends: false

engine:
  type: trtllm
  served_model_name: "Qwen/Qwen3-0.6B"
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
      TLLM_LOG_LEVEL: "INFO"
    args:
      backend: "pytorch"
      tensor_parallel_size: 1
      max_batch_size: 8
      max_num_tokens: 8192
      max_seq_len: 4096
      trust_remote_code: true
      disable_overlap_scheduler: true
      kv_cache_config:
        free_gpu_memory_fraction: 0.5
        use_kv_cache_manager_v2: true
      cache_transceiver_config:        # KV cache manager v2 needs the Python NIXL transceiver
        backend: "NIXL"
        transceiver_runtime: "PYTHON"
      kv_connector_config:
        connector: mooncake-store
  decode:
    nodes: colocate
    workers: 1
    gpus: 1
    env:
      PYTHONUNBUFFERED: "1"
      TLLM_LOG_LEVEL: "INFO"
    args:
      backend: "pytorch"
      tensor_parallel_size: 1
      max_batch_size: 64
      max_num_tokens: 4096
      max_seq_len: 4096
      trust_remote_code: true
      kv_cache_config:
        free_gpu_memory_fraction: 0.5
        use_kv_cache_manager_v2: true
      cache_transceiver_config:        # KV cache manager v2 needs the Python NIXL transceiver
        backend: "NIXL"
        transceiver_runtime: "PYTHON"
      kv_connector_config:
        connector: mooncake-store

services:
  - name: mooncake-master
    type: mooncake-master
    options:
      store_config:                  # model_key defaults to the served model name
        protocol: rdma
        global_segment_size: 8GiB
        stage_through_host: true

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
