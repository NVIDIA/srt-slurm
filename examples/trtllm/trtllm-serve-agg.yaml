# TRT-LLM aggregated, router-free.
#
# Exactly one `trtllm-serve` worker owns the public OpenAI port directly; no
# separate frontend process is launched. `frontend.type: trtllm_serve` in aggregate
# mode requires exactly one aggregated worker. No Dynamo, NATS, or etcd.
#
# Aliases (`qwen3-0.6b`, `trtllm`) resolve through srtslurm.yaml; see examples/README.md.

name: "qwen3-0.6b-trtllm-serve-agg"

slurm:
  time_limit: "00:30:00"

model:
  path: "qwen3-0.6b"
  container: "trtllm"
  precision: "bf16"

resources:
  gpu_type: "h100"
  gpus_per_node: 8
  agg_nodes: 1
  agg_workers: 1
  gpus_per_agg: 1

frontend:
  type: trtllm_serve
  enable_multiple_frontends: false

backend:
  type: trtllm
  served_model_name: "Qwen/Qwen3-0.6B"
  aggregated_environment:
    PYTHONUNBUFFERED: "1"
    TLLM_LOG_LEVEL: "INFO"
  trtllm_config:
    aggregated:
      backend: "pytorch"
      tensor_parallel_size: 1
      max_batch_size: 64
      max_num_tokens: 8192
      max_seq_len: 4096
      trust_remote_code: true
      kv_cache_config:
        free_gpu_memory_fraction: 0.5

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
