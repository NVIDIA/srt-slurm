# vLLM aggregated on one GPU, for `launcher: docker` (a single GPU VM without Slurm).
#
# Set `launcher: docker` in srtslurm.yaml, then `srtctl apply -f` this file; see
# docs/cluster-config.md#launcher. The same recipe also runs under Slurm.
# vllm/vllm-openai:v0.11.0 has no --device-ids, so the worker's GPU comes from
# an environment mask (set_visible_devices). A worker that owns the whole node
# gets no automatic mask, so CUDA_VISIBLE_DEVICES pins it here.

schema: 2
name: "qwen3-0.6b-vllm-docker-agg"

model:
  path: "hf:Qwen/Qwen3-0.6B"
  container: "vllm/vllm-openai:v0.11.0"
  precision: "bf16"

resources:
  gpu_type: "l4"
  gpus_per_node: 1

frontend:
  type: vllm
  enable_multiple_frontends: false

engine:
  type: vllm
  set_visible_devices: true

roles:
  agg:
    nodes: 1
    workers: 1
    gpus: 1
    env:
      CUDA_VISIBLE_DEVICES: "0"
    args:
      served-model-name: "Qwen/Qwen3-0.6B"
      tensor-parallel-size: 1
      gpu-memory-utilization: 0.5
      max-model-len: 4096

benchmark:
  type: "sa-bench"
  isl: 128
  osl: 128
  concurrencies: "4x8"
