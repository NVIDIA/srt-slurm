# Native ATOM prefill/decode behind AToMesh, with the prefill worker split into four
# pipeline stages of one GPU each. srtctl passes -tp 1 = 4 GPUs / pipeline-parallel-size 4.
# Pipeline parallelism needs ATOM v0.1.6 or later and a model ATOM can split into stages
# (dense Qwen3 cannot; Qwen3 MoE can).
# Configure visible_devices_env: ROCR_VISIBLE_DEVICES in the cluster srtslurm.yaml.
# The container must include both atom.entrypoints.openai_server and atomesh.
schema: 2
name: qwen3-30b-a3b-atomesh-disagg-pp-prefill
model:
  path: hf:Qwen/Qwen3-30B-A3B
  container: rocm/atom:latest
  precision: bf16
resources:
  gpu_type: mi300x
  gpus_per_node: 8
engine:
  type: atom
  mooncake_protocol: tcp
frontend:
  type: atomesh
  enable_multiple_frontends: false
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 4
    args:
      pipeline-parallel-size: 4
  decode:
    nodes: 1
    workers: 1
    gpus: 1
benchmark:
  type: sa-bench
  isl: 128
  osl: 128
  concurrencies: "4x8"
