config:
  output_dir: __NEL_OUTPUT_DIR__
  params:
    extra:
      judge:
        api_key: INFERENCE_API_KEY
        max_new_tokens: 4096
        model_id: nvidia/qwen/eccn-qwen-235b
        parallelism: 16
        temperature: 0.0
        top_p: 1.0
        url: https://inference-api.nvidia.com/v1
      num_repeats: 16
    max_new_tokens: 65536
    max_retries: 10
    parallelism: 16
    request_timeout: 3600
    temperature: 1.0
    top_p: 0.95
  type: ns_aa_lcr
metadata:
  source: nemo-evaluator-launcher-dry-run
  versioning:
    nemo_evaluator_launcher: 0.2.7+20260902.673edc82
    nemo_evaluator_launcher_internal: 0.3.178+20260805
target:
  api_endpoint:
    adapter_config:
      interceptors:
        - config:
            max_requests: 20
            output_dir: __NEL_OUTPUT_DIR__
          name: request_logging
        - config:
            params_to_add:
              chat_template_kwargs:
                thinking_mode: enabled
          name: payload_modifier
        - name: endpoint
        - config:
            enable_reasoning_tracking: true
            end_reasoning_token: </mm:think>
            include_if_not_finished: true
            start_reasoning_token: <mm:think>
          name: reasoning
        - config:
            max_responses: 20
            output_dir: __NEL_OUTPUT_DIR__
          name: response_logging
    model_id: nvidia/MiniMax-M3-NVFP4
    post_eval_hooks:
      - config:
          html_report_size: 5
          report_types: [html, json]
        name: post_eval_report
    type: chat
    url: __SRT_TARGET_URL__
