      block-size: 128
      trust-remote-code: true
      enable-prefix-caching: true
      language-model-only: true
      no-enable-flashinfer-autotune: true
      reasoning-parser: minimax_m3
      max-cudagraph-capture-size: 512
      max-num-batched-tokens: 16384
      stream-interval: 20
      gpu-memory-utilization: 0.9
      tensor-parallel-size: 1
      data-parallel-size: 8
      data-parallel-rpc-port: 13345
      enable-expert-parallel: true
      attention-config: '{"backend":"FLASHINFER","use_trtllm_attention":true,"indexer_kv_dtype":"fp8"}'
      all2all-backend: flashinfer_nvlink_one_sided
      speculative-config: '{"method":"eagle3","model":"/scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/kylliang/models/MiniMax-M3-EAGLE3-GQA","num_speculative_tokens":3,"attention_backend":"FLASH_ATTN","rejection_sample_method":"synthetic","synthetic_acceptance_length":2.83}'
