    PYTHONNOUSERSITE: "1"
    HF_HOME: "/scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/kylliang/models/.cache"
    VLLM_FLOAT32_MATMUL_PRECISION: high
    VLLM_FLASHINFER_ALLREDUCE_BACKEND: trtllm
    VLLM_USE_NCCL_SYMM_MEM: "0"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
