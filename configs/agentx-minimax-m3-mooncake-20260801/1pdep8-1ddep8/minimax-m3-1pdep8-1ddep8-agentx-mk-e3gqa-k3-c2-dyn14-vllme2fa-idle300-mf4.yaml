name: minimax-m3-1pdep8-1ddep8-agentx-mk-e3gqa-k3-c2-dyn14-vllme2fa-idle300-mf4

dynamo:
  wheel: 1.4.0.dev20260730
  install: true

infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 32

frontend:
  type: dynamo
  enable_multiple_frontends: true
  # One frontend per allocated model node: 1 primary + 3 additional.
  num_additional_frontends: 3
  nginx_raise_ulimit: false
  nginx_session_affinity: true
  nginx_session_affinity_header: X-Dynamo-Session-ID
  args:
    router-mode: least-loaded
    router-session-affinity-ttl-secs: 1800
  env:
    DYN_TOKENIZER_CACHE_BYTES: "8589934592"
    DYN_LOG: info,dynamo_llm::session_affinity=debug
    DYN_TOKENIZER: fastokens
    DYN_TCP_CONNECT_TIMEOUT: "60"

model:
