# git-cliff configuration: release notes from the squash-merged, conventional-commit PR titles.
# Used by .github/workflows/release.yaml; run locally with `git cliff v1.0.103..HEAD`.

[changelog]
header = ""
body = """
{%- if version %}## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% if commit.breaking %} **[breaking]**{% endif %}\
{% if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}
{%- endfor %}
{% endfor %}
{%- if previous.version and version %}
**Full changelog:** [{{ previous.version }}...{{ version }}]({{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }})
{% endif %}
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
# Squash-merge subjects already end with "(#123)", which GitHub renders as a link in release notes,
# so no extra PR link is added. Preprocessing the subject would break conventional-commit parsing.
# Order matters: the first matching group wins. Breaking changes float to the top.
commit_parsers = [
  { breaking = true, group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^refactor", group = "<!-- 5 -->Refactoring" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^(ci|build|chore)", group = "<!-- 7 -->Build and CI" },
  { message = "^revert", group = "<!-- 8 -->Reverts" },
  { message = "^Revert", group = "<!-- 8 -->Reverts" },
  { message = ".*", group = "<!-- 9 -->Other changes" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "newest"

[remote.github]
owner = "NVIDIA"
repo = "srt-slurm"
